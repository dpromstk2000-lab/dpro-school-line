name: "STEP SCHOOL-NEXT-4-R1 | 業務進捗・ステータス見える化修正"
run-name: "SCHOOL-NEXT-4-R1 progress board fix by ${{ github.actor }}"

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/step-school-next-4-r1-progress-board.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: school-next-4-r1-progress-board
  cancel-in-progress: false

env:
  STEP_NAME: SCHOOL-NEXT-4-R1
  COMPLETED_STEP: SCHOOL-NEXT-4
  WORKFLOW_FILE: .github/workflows/step-school-next-4-r1-progress-board.yml
  ORIGINAL_WORKFLOW_FILE: .github/workflows/step-school-next-4-progress-board.yml
  STATE_DIR: dpro-next
  CURRENT_STEP_FILE: dpro-next/current-step.yml
  TARGET_FILE: owner.html
  EXPECTED_CURRENT_STEP: SCHOOL-NEXT-4
  DUPLICATE_COMPLETED_STEP: SCHOOL-NEXT-5
  NEXT_STEP: SCHOOL-NEXT-5
  BASELINE_TAG: backup-school-next-before-4-20260724
  OWNER_URL: https://dpromstk2000-lab.github.io/dpro-school-line/owner.html
  API_BASE: https://dpro-school-line-api.dpromstk2000.workers.dev
  EXPECTED_WORKER_VERSION: STEP-SCHOOL-NEXT-1-R1-WORKER-SECURITY-20260723

jobs:
  progress-board:
    name: 業務進捗・ステータス見える化 R1
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. リポジトリ取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 前STEP完了・重複実行防止・変更前保護
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "${GITHUB_REF_NAME}" = "main"
          test -f "${WORKFLOW_FILE}"
          test -f "${ORIGINAL_WORKFLOW_FILE}"
          test -f "${TARGET_FILE}"
          test -f config.js
          test -f "${CURRENT_STEP_FILE}"

          CURRENT_STEP="$(grep -E '^current_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs)"
          LAST_COMPLETED="$(grep -E '^last_completed_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs)"

          if [ "${CURRENT_STEP}" = "${DUPLICATE_COMPLETED_STEP}" ] \
            && [ "${LAST_COMPLETED}" = "${COMPLETED_STEP}" ] \
            && grep -q 'STEP SCHOOL-NEXT-4 / owner.html' "${TARGET_FILE}"; then
            echo "mode=duplicate" >> "${GITHUB_OUTPUT}"
            echo "::notice::SCHOOL-NEXT-4は完了済みです。再アップロードされたYMLだけを削除します。"
            exit 0
          fi

          if [ "${CURRENT_STEP}" != "${EXPECTED_CURRENT_STEP}" ]; then
            echo "::error::current_step=${CURRENT_STEP}, expected=${EXPECTED_CURRENT_STEP}"
            exit 1
          fi

          if [ "${LAST_COMPLETED}" != "SCHOOL-NEXT-3" ]; then
            echo "::error::前STEPが未完了です。last_completed_step=${LAST_COMPLETED}"
            exit 1
          fi

          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true); puts "YAML syntax OK"' "${WORKFLOW_FILE}"

          BEFORE_SHA256="$(sha256sum "${TARGET_FILE}" | awk '{print $1}')"
          BEFORE_GIT_SHA="$(git rev-parse HEAD)"
          BEFORE_BYTES="$(wc -c < "${TARGET_FILE}" | tr -d ' ')"

          echo "mode=apply" >> "${GITHUB_OUTPUT}"
          echo "before_sha256=${BEFORE_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "before_git_sha=${BEFORE_GIT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "before_bytes=${BEFORE_BYTES}" >> "${GITHUB_OUTPUT}"

          cp "${TARGET_FILE}" "${RUNNER_TEMP}/owner-before-school-next-4.html"
          cp "${CURRENT_STEP_FILE}" "${RUNNER_TEMP}/current-step-before-school-next-4.yml"

          if git rev-parse "refs/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            echo "::notice::既存バックアップタグを維持: ${BASELINE_TAG}"
          elif git ls-remote --exit-code --tags origin "refs/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${BASELINE_TAG}:refs/tags/${BASELINE_TAG}"
          else
            git tag -a "${BASELINE_TAG}" "${BEFORE_GIT_SHA}" -m "DPRO 学習塾 LINE / SCHOOL-NEXT-4 変更前正常版"
            git push origin "refs/tags/${BASELINE_TAG}"
          fi

      - name: 2B. 完了後に再アップロードされたYMLを整理
        if: steps.preflight.outputs.mode == 'duplicate'
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "${ORIGINAL_WORKFLOW_FILE}" "${WORKFLOW_FILE}"

          stage_path(){
            local path="$1"
            if [ -e "${path}" ] || git ls-files --error-unmatch "${path}" >/dev/null 2>&1; then
              git add -A -- "${path}"
            fi
          }
          stage_path "${ORIGINAL_WORKFLOW_FILE}"
          stage_path "${WORKFLOW_FILE}"

          if git diff --cached --quiet; then
            echo "::notice::削除対象はありません。"
            exit 0
          fi

          git commit -m "chore(school-next): remove duplicate NEXT-4 workflow upload"
          git push origin main

      - name: 3. owner.htmlへ業務進捗ボードを追加
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("owner.html")
          text = path.read_text(encoding="utf-8")
          original = text

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}の一致数が1ではありません: {count}")
              return source.replace(old, new, 1)

          def insert_before_once(source, marker, addition, label):
              count = source.count(marker)
              if count != 1:
                  raise RuntimeError(f"{label}の基準位置が1件ではありません: {count}")
              return source.replace(marker, addition + marker, 1)

          if "STEP SCHOOL-NEXT-4 / owner.html" in text:
              print("owner.htmlは既にSCHOOL-NEXT-4です。")
              sys.exit(0)

          required = [
              '<div class="version">STEP SCHOOL-NEXT-3 / owner.html</div>',
              '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-3 / owner.html</p>',
              "const VERSION = 'STEP SCHOOL-NEXT-3';",
              "受付・予約統合一覧",
              '<div class="unified-toolbar">',
              'id="unifiedReceptionList"',
              "        unifiedFilter: 'all',",
              "        unifiedQuery: '',",
              "        renderPriorityGuide();",
              "        renderUnifiedReception();",
              "function unifiedFilteredItems(){",
              "function renderUnifiedReception(){",
              "$('unifiedFilterBar').addEventListener('click', (e) => {",
              '<li>今日やることを上から確認</li>',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise RuntimeError("現行NEXT-3マーカー不足: " + " / ".join(missing))

          text = replace_once(
              text,
              '<div class="version">STEP SCHOOL-NEXT-3 / owner.html</div>',
              '<div class="version">STEP SCHOOL-NEXT-4 / owner.html</div>',
              "画面バージョン",
          )
          text = replace_once(
              text,
              '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-3 / owner.html</p>',
              '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-4 / owner.html</p>',
              "フッターバージョン",
          )
          text = replace_once(
              text,
              "const VERSION = 'STEP SCHOOL-NEXT-3';",
              "const VERSION = 'STEP SCHOOL-NEXT-4';",
              "JavaScriptバージョン",
          )

          css = r'''
          /* SCHOOL-NEXT-4: 業務進捗・ステータス見える化 */
          .progress-board{margin:0 0 16px;padding:16px;border:1px solid #dbe5f2;border-radius:18px;background:linear-gradient(135deg,#f8fbff,#f0fdf9);}
          .progress-board-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:13px;}
          .progress-board-title{display:block;font-size:17px;font-weight:950;color:#0f172a;margin-bottom:4px;}
          .progress-board-copy{display:block;color:#64748b;font-size:12px;line-height:1.65;font-weight:750;}
          .progress-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px;}
          .progress-stage{appearance:none;text-align:left;border:1px solid #dbe5f2;border-radius:15px;background:#fff;color:#0f172a;padding:12px;min-height:105px;box-shadow:none;transition:.15s ease;position:relative;overflow:hidden;}
          .progress-stage:hover{transform:translateY(-1px);box-shadow:0 9px 20px rgba(15,23,42,.08);}
          .progress-stage.active{outline:3px solid rgba(37,99,235,.18);border-color:#60a5fa;background:#eff6ff;}
          .progress-stage .stage-no{display:inline-flex;align-items:center;justify-content:center;min-width:25px;height:25px;padding:0 7px;border-radius:999px;background:#0f172a;color:#fff;font-size:11px;font-weight:950;margin-bottom:8px;}
          .progress-stage strong{display:block;font-size:27px;line-height:1;font-weight:950;letter-spacing:-.04em;margin-bottom:7px;}
          .progress-stage b{display:block;font-size:13px;line-height:1.35;margin-bottom:4px;}
          .progress-stage small{display:block;color:#64748b;font-size:11px;line-height:1.5;font-weight:750;}
          .progress-stage[data-progress-stage="trial"]{border-top:4px solid #2563eb;}
          .progress-stage[data-progress-stage="request"]{border-top:4px solid #f97316;}
          .progress-stage[data-progress-stage="scheduled"]{border-top:4px solid #64748b;}
          .progress-stage[data-progress-stage="checked_in"]{border-top:4px solid #0ea5e9;}
          .progress-stage[data-progress-stage="in_progress"]{border-top:4px solid #7c3aed;}
          .progress-stage[data-progress-stage="absent"]{border-top:4px solid #ef4444;}
          .progress-stage[data-progress-stage="done"]{border-top:4px solid #10b981;}
          .progress-board-summary{margin-top:11px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #e2e8f0;color:#475569;font-size:12px;font-weight:850;line-height:1.65;}
          @media(max-width:720px){
          .progress-board-head{flex-direction:column;}
          .progress-board-head .btn{width:100%;}
          .progress-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
          .progress-stage{min-height:112px;}
          }

          '''
          css_pattern = r'(?m)^[ \t]*/\* SCHOOL-NEXT-3: 受付・予約・授業の統合表示 \*/'
          css_matches = list(re.finditer(css_pattern, text))
          if len(css_matches) != 1:
              raise RuntimeError(f"NEXT-4 CSS基準位置が1件ではありません: {len(css_matches)}")
          css_position = css_matches[0].start()
          text = text[:css_position] + css + text[css_position:]

          progress_html = r'''
          <div class="progress-board" id="progressBoard">
            <div class="progress-board-head">
              <div>
                <span class="progress-board-title">業務進捗ボード</span>
                <span class="progress-board-copy">現在保存されている受付・授業状態を段階別に集計します。カードを押すと下の統合一覧を絞り込みます。</span>
              </div>
              <button class="btn secondary small" id="clearProgressStageBtn" type="button">全段階を表示</button>
            </div>
            <div class="progress-grid">
              <button class="progress-stage" type="button" data-progress-stage="trial" aria-pressed="false">
                <span class="stage-no">1</span><strong id="progressTrialCount">0</strong>
                <b>体験確認</b><small>未完了の体験予約</small>
              </button>
              <button class="progress-stage" type="button" data-progress-stage="request" aria-pressed="false">
                <span class="stage-no">2</span><strong id="progressRequestCount">0</strong>
                <b>欠席・振替対応</b><small>返信・確認が必要</small>
              </button>
              <button class="progress-stage" type="button" data-progress-stage="scheduled" aria-pressed="false">
                <span class="stage-no">3</span><strong id="progressScheduledCount">0</strong>
                <b>授業予定</b><small>来校・開始前</small>
              </button>
              <button class="progress-stage" type="button" data-progress-stage="checked_in" aria-pressed="false">
                <span class="stage-no">4</span><strong id="progressCheckedInCount">0</strong>
                <b>来校済</b><small>出席を確認済み</small>
              </button>
              <button class="progress-stage" type="button" data-progress-stage="in_progress" aria-pressed="false">
                <span class="stage-no">5</span><strong id="progressInProgressCount">0</strong>
                <b>授業中</b><small>現在進行中</small>
              </button>
              <button class="progress-stage" type="button" data-progress-stage="absent" aria-pressed="false">
                <span class="stage-no">6</span><strong id="progressAbsentCount">0</strong>
                <b>欠席</b><small>欠席記録・次対応</small>
              </button>
              <button class="progress-stage" type="button" data-progress-stage="done" aria-pressed="false">
                <span class="stage-no">7</span><strong id="progressDoneCount">0</strong>
                <b>完了</b><small>対応済み・授業完了</small>
              </button>
            </div>
            <div class="progress-board-summary" id="progressBoardSummary">情報を更新すると、段階別件数を表示します。</div>
          </div>

          '''
          text = insert_before_once(
              text,
              '<div class="unified-toolbar">',
              progress_html,
              "進捗ボードHTML",
          )

          text = replace_once(
              text,
              "        unifiedFilter: 'all',\n        unifiedQuery: '',\n        dashboard: makeEmptyDashboard(),",
              "        unifiedFilter: 'all',\n"
              "        unifiedQuery: '',\n"
              "        progressStage: 'all',\n"
              "        dashboard: makeEmptyDashboard(),",
              "進捗state",
          )

          text = replace_once(
              text,
              "        renderTasks();\n        renderUnifiedReception();",
              "        renderTasks();\n"
              "        renderProgressBoard();\n"
              "        renderUnifiedReception();",
              "進捗ボード描画",
          )

          progress_functions = r'''
          function progressStageForItem(item){
          const status = String(item && item.status || '').toLowerCase();
          if(item && item.kind === 'request'){
          if(boolDone(item.status)) return 'done';
          if(isTrialType(item.type)) return 'trial';
          return 'request';
          }
          if(status.includes('欠席') || status.includes('absent')) return 'absent';
          if(boolDone(item && item.status) || status.includes('completed') || status.includes('finished')) return 'done';
          if(status.includes('授業中') || status.includes('in_progress')) return 'in_progress';
          if(status.includes('出席') || status.includes('checked_in') || status.includes('attended')) return 'checked_in';
          return 'scheduled';
          }

          function progressStageLabel(stage){
          return {
          trial:'体験確認',
          request:'欠席・振替対応',
          scheduled:'授業予定',
          checked_in:'来校済',
          in_progress:'授業中',
          absent:'欠席',
          done:'完了',
          all:'全段階'
          }[stage] || '全段階';
          }

          function progressStageBadgeClass(stage){
          return {
          trial:'blue',
          request:'orange',
          scheduled:'gray',
          checked_in:'blue',
          in_progress:'purple',
          absent:'red',
          done:'green'
          }[stage] || 'gray';
          }

          function progressStageCounts(items){
          const counts = { trial:0, request:0, scheduled:0, checked_in:0, in_progress:0, absent:0, done:0 };
          (items || []).forEach((item) => {
          const stage = progressStageForItem(item);
          if(Object.prototype.hasOwnProperty.call(counts, stage)) counts[stage] += 1;
          });
          return counts;
          }

          function renderProgressBoard(){
          const board = $('progressBoard');
          if(!board) return;
          const items = getUnifiedItems();
          const counts = progressStageCounts(items);
          const ids = {
          trial:'progressTrialCount',
          request:'progressRequestCount',
          scheduled:'progressScheduledCount',
          checked_in:'progressCheckedInCount',
          in_progress:'progressInProgressCount',
          absent:'progressAbsentCount',
          done:'progressDoneCount'
          };
          Object.keys(ids).forEach((stage) => {
          const element = $(ids[stage]);
          if(element) element.textContent = String(counts[stage] || 0);
          });
          document.querySelectorAll('#progressBoard [data-progress-stage]').forEach((button) => {
          const active = button.dataset.progressStage === (state.progressStage || 'all');
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', active ? 'true' : 'false');
          });
          const openCount = counts.trial + counts.request + counts.scheduled + counts.checked_in + counts.in_progress + counts.absent;
          const summary = $('progressBoardSummary');
          if(summary){
          const selected = state.progressStage && state.progressStage !== 'all' ? ` / 表示中：${progressStageLabel(state.progressStage)}` : '';
          summary.textContent = `読込対象 ${items.length}件 / 完了前 ${openCount}件 / 完了 ${counts.done}件${selected}`;
          }
          }

          function setProgressStage(stage){
          state.progressStage = stage || 'all';
          state.unifiedFilter = 'all';
          document.querySelectorAll('#unifiedFilterBar [data-unified-filter]').forEach((button) => {
          button.classList.toggle('active', button.dataset.unifiedFilter === 'all');
          });
          renderProgressBoard();
          renderUnifiedReception();
          }

          '''
          text = insert_before_once(
              text,
              "function unifiedFilteredItems(){",
              progress_functions,
              "進捗判定関数",
          )

          old_filtered = (
              "function unifiedFilteredItems(){\n"
              "const filter = state.unifiedFilter || 'all';\n"
              "const query = String(state.unifiedQuery || '').trim();\n"
              "return getUnifiedItems().filter((item) => {\n"
              "if(filter === 'request' && item.kind !== 'request') return false;\n"
              "if(filter === 'lesson' && item.kind !== 'lesson') return false;\n"
              "if(filter === 'pending' && boolDone(item.status)) return false;\n"
              "if(filter === 'done' && !boolDone(item.status)) return false;\n"
              "return unifiedMatchesQuery(item, query);\n"
              "});\n"
              "}"
          )
          new_filtered = (
              "function unifiedFilteredItems(){\n"
              "const filter = state.unifiedFilter || 'all';\n"
              "const query = String(state.unifiedQuery || '').trim();\n"
              "const progressStage = state.progressStage || 'all';\n"
              "return getUnifiedItems().filter((item) => {\n"
              "if(filter === 'request' && item.kind !== 'request') return false;\n"
              "if(filter === 'lesson' && item.kind !== 'lesson') return false;\n"
              "if(filter === 'pending' && boolDone(item.status)) return false;\n"
              "if(filter === 'done' && !boolDone(item.status)) return false;\n"
              "if(progressStage !== 'all' && progressStageForItem(item) !== progressStage) return false;\n"
              "return unifiedMatchesQuery(item, query);\n"
              "});\n"
              "}"
          )
          text = replace_once(
              text,
              old_filtered,
              new_filtered,
              "統合一覧進捗絞り込み",
          )

          badge_pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)<span class="badge unified-source">\$\{escapeHtml\(item\.source\)\}</span>\r?\n'
              r'(?P=indent)<span class="badge \$\{badgeClassForStatus\(item\.status\)\}">\$\{escapeHtml\(item\.status\)\}</span>$'
          )
          badge_matches = list(badge_pattern.finditer(text))
          if len(badge_matches) != 1:
              raise RuntimeError(f"統合カード進捗表示の一致数が1ではありません: {len(badge_matches)}")
          badge_match = badge_matches[0]
          badge_indent = badge_match.group("indent")
          new_badges = (
              f'{badge_indent}<span class="badge unified-source">${{escapeHtml(item.source)}}</span>\n'
              f'{badge_indent}<span class="badge ${{badgeClassForStatus(item.status)}}">${{escapeHtml(item.status)}}</span>\n'
              f'{badge_indent}<span class="badge ${{progressStageBadgeClass(progressStageForItem(item))}}">進捗：${{escapeHtml(progressStageLabel(progressStageForItem(item)))}}</span>'
          )
          text = text[:badge_match.start()] + new_badges + text[badge_match.end():]

          progress_events = r'''
          $('progressBoard').addEventListener('click', (e) => {
          const button = e.target.closest('[data-progress-stage]');
          if(!button) return;
          setProgressStage(button.dataset.progressStage || 'all');
          scrollToNextTarget('unifiedReceptionList');
          });
          $('clearProgressStageBtn').addEventListener('click', () => {
          setProgressStage('all');
          });
          '''
          text = insert_before_once(
              text,
              "$('unifiedFilterBar').addEventListener('click', (e) => {",
              progress_events,
              "進捗ボードイベント",
          )

          old_unified_filter_event = (
              "$('unifiedFilterBar').addEventListener('click', (e) => {\n"
              "const button = e.target.closest('[data-unified-filter]');\n"
              "if(!button) return;\n"
              "state.unifiedFilter = button.dataset.unifiedFilter || 'all';\n"
              "document.querySelectorAll('#unifiedFilterBar [data-unified-filter]').forEach((item) => item.classList.toggle('active', item === button));\n"
              "renderUnifiedReception();\n"
              "});"
          )
          new_unified_filter_event = (
              "$('unifiedFilterBar').addEventListener('click', (e) => {\n"
              "const button = e.target.closest('[data-unified-filter]');\n"
              "if(!button) return;\n"
              "state.unifiedFilter = button.dataset.unifiedFilter || 'all';\n"
              "state.progressStage = 'all';\n"
              "document.querySelectorAll('#unifiedFilterBar [data-unified-filter]').forEach((item) => item.classList.toggle('active', item === button));\n"
              "renderProgressBoard();\n"
              "renderUnifiedReception();\n"
              "});"
          )
          text = replace_once(
              text,
              old_unified_filter_event,
              new_unified_filter_event,
              "既存フィルター連携",
          )

          text = replace_once(
              text,
              '<li>今日やることを上から確認</li>\n            <li>文面を確認・コピーしてLINEで送信</li>',
              '<li>今日やることを上から確認</li>\n'
              '            <li>進捗ボードで受付・授業の滞留を確認</li>\n'
              '            <li>文面を確認・コピーしてLINEで送信</li>',
              "運用フロー進捗確認",
          )

          if text == original:
              raise RuntimeError("owner.htmlに変更がありません。")

          path.write_text(text, encoding="utf-8", newline="\n")
          print("SCHOOL-NEXT-4 patch complete")
          PY

      - name: 4. HTML・JavaScript・ID・進捗ロジック検査
        if: steps.preflight.outputs.mode == 'apply'
        id: validate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${STATE_DIR}"

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from datetime import datetime, timezone, timedelta
          import hashlib
          import json
          import os
          import re
          import subprocess

          before = Path(os.environ["RUNNER_TEMP"]) / "owner-before-school-next-4.html"
          after = Path("owner.html")
          out = Path("dpro-next")
          results = []

          def add(key, label, status, detail, blocking=False):
              results.append({
                  "key": key,
                  "label": label,
                  "status": status,
                  "detail": detail,
                  "blocking": bool(blocking and status == "NG"),
              })

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
                  self.scripts = []
                  self.in_script = False
                  self.external = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if data.get("id"):
                      self.ids.append(data["id"])
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = bool(data.get("src"))
                      self.parts = []

              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external:
                          self.scripts.append("".join(self.parts))
                      self.in_script = False
                      self.external = False
                      self.parts = []

          before_text = before.read_text(encoding="utf-8")
          after_text = after.read_text(encoding="utf-8")
          bp = Inspector()
          ap = Inspector()
          bp.feed(before_text)
          bp.close()
          ap.feed(after_text)
          ap.close()

          old_ids = set(bp.ids)
          new_ids = set(ap.ids)
          missing_old = sorted(old_ids - new_ids)
          duplicates = sorted({value for value in ap.ids if ap.ids.count(value) > 1})
          required_new_ids = {
              "progressBoard",
              "clearProgressStageBtn",
              "progressTrialCount",
              "progressRequestCount",
              "progressScheduledCount",
              "progressCheckedInCount",
              "progressInProgressCount",
              "progressAbsentCount",
              "progressDoneCount",
              "progressBoardSummary",
          }
          missing_new = sorted(required_new_ids - new_ids)

          add(
              "existing_ids",
              "既存HTML ID維持",
              "NG" if missing_old else "OK",
              "削除: " + ", ".join(missing_old) if missing_old else f"既存ID {len(old_ids)}件を維持",
              bool(missing_old),
          )
          add(
              "duplicate_ids",
              "HTML ID重複",
              "NG" if duplicates else "OK",
              "重複: " + ", ".join(duplicates) if duplicates else f"ID {len(ap.ids)}件、重複なし",
              bool(duplicates),
          )
          add(
              "new_ids",
              "NEXT-4追加ID",
              "NG" if missing_new else "OK",
              "不足: " + ", ".join(missing_new) if missing_new else f"追加ID {len(required_new_ids)}件を確認",
              bool(missing_new),
          )

          script_errors = []
          for index, script in enumerate(ap.scripts, 1):
              if not script.strip():
                  continue
              temp = out / f".school-next-4-{index}.js"
              temp.write_text(script, encoding="utf-8")
              proc = subprocess.run(["node", "--check", str(temp)], capture_output=True, text=True)
              temp.unlink(missing_ok=True)
              if proc.returncode:
                  script_errors.append((proc.stderr or proc.stdout)[-1800:])

          add(
              "javascript",
              "JavaScript構文",
              "NG" if script_errors else "OK",
              " / ".join(script_errors) if script_errors else f"インラインscript {len(ap.scripts)}件 PASS",
              bool(script_errors),
          )

          required_markers = [
              '<div class="version">STEP SCHOOL-NEXT-4 / owner.html</div>',
              '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-4 / owner.html</p>',
              "const VERSION = 'STEP SCHOOL-NEXT-4';",
              "業務進捗ボード",
              "progressStageForItem",
              "progressStageLabel",
              "progressStageCounts",
              "renderProgressBoard",
              "setProgressStage",
              "progressStage !== 'all'",
              'data-progress-stage="trial"',
              'data-progress-stage="request"',
              'data-progress-stage="scheduled"',
              'data-progress-stage="checked_in"',
              'data-progress-stage="in_progress"',
              'data-progress-stage="absent"',
              'data-progress-stage="done"',
              "進捗：${escapeHtml(progressStageLabel(progressStageForItem(item)))}",
              "受付・予約統合一覧",
              'id="requestTabs"',
              'id="requestList"',
              'id="lessonList"',
              'id="createLessonCard"',
              'id="clearAdminBtn"',
          ]
          missing_markers = [marker for marker in required_markers if marker not in after_text]
          add(
              "features",
              "進捗機能・既存機能",
              "NG" if missing_markers else "OK",
              "不足: " + " / ".join(missing_markers) if missing_markers else f"必須マーカー {len(required_markers)}件",
              bool(missing_markers),
          )

          api_pattern = re.compile(r"['\"](/api/[a-zA-Z0-9_./-]+)['\"]")
          before_api = sorted(set(api_pattern.findall(before_text)))
          after_api = sorted(set(api_pattern.findall(after_text)))
          api_changed = before_api != after_api
          add(
              "api",
              "既存API維持",
              "NG" if api_changed else "OK",
              f"before={before_api} / after={after_api}" if api_changed else f"既存API {len(after_api)}件、追加・削除なし",
              api_changed,
          )

          before_fetch = before_text.count("fetch(")
          after_fetch = after_text.count("fetch(")
          fetch_changed = before_fetch != after_fetch
          add(
              "network",
              "追加通信なし",
              "NG" if fetch_changed else "OK",
              f"before={before_fetch}, after={after_fetch}" if fetch_changed else f"fetch呼出数 {after_fetch}を維持",
              fetch_changed,
          )

          stages = ["trial", "request", "scheduled", "checked_in", "in_progress", "absent", "done"]
          stage_missing = [
              stage
              for stage in stages
              if f"'{stage}'" not in after_text and f'"{stage}"' not in after_text
          ]
          add(
              "stages",
              "学習塾進捗7段階",
              "NG" if stage_missing else "OK",
              "不足: " + ", ".join(stage_missing) if stage_missing else "体験確認・欠席振替対応・授業予定・来校済・授業中・欠席・完了",
              bool(stage_missing),
          )

          unsafe_status_api = "/api/admin/progress" in after_text or "/api/admin/workflow" in after_text
          add(
              "no_new_status_api",
              "新規進捗APIなし",
              "NG" if unsafe_status_api else "OK",
              "新しい進捗APIは追加せず、既存状態を表示変換" if not unsafe_status_api else "想定外の進捗APIを検出",
              unsafe_status_api,
          )

          size = after.stat().st_size
          add(
              "size",
              "owner.html容量",
              "注意" if size > 180000 else "OK",
              f"{size:,} bytes",
              False,
          )

          changed = subprocess.run(
              ["git", "diff", "--name-only"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout.splitlines()
          forbidden = [
              name
              for name in ["index.html", "member.html", "owner-ipad.html", "system-check.html", "config.js"]
              if name in changed
          ]
          add(
              "scope",
              "対象ファイル限定",
              "NG" if forbidden else "OK",
              "意図しない変更: " + ", ".join(forbidden) if forbidden else "本体変更はowner.htmlのみ",
              bool(forbidden),
          )

          add("worker", "Worker変更", "OK", "変更なし")
          add("supabase", "Supabase変更", "OK", "変更なし・SQL不要")
          add("automatic_line", "一括自動LINE配信", "OK", "追加なし・個別確認を維持")

          counts = {
              name: sum(1 for row in results if row["status"] == name)
              for name in ["OK", "注意", "NG"]
          }
          blocking = sum(1 for row in results if row["blocking"])
          payload = {
              "step": "SCHOOL-NEXT-4",
              "checked_at_jst": datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds"),
              "target": "owner.html",
              "before_sha256": hashlib.sha256(before.read_bytes()).hexdigest(),
              "after_sha256": hashlib.sha256(after.read_bytes()).hexdigest(),
              "counts": counts,
              "blocking_ng": blocking,
              "results": results,
          }
          (out / "school-next-4-validation.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"after_sha256={payload['after_sha256']}\n")
              fh.write(f"ok_count={counts['OK']}\n")
              fh.write(f"warning_count={counts['注意']}\n")
              fh.write(f"ng_count={counts['NG']}\n")

          if blocking:
              raise SystemExit(f"blocking NG: {blocking}")
          PY

      - name: 5. Worker・Supabase接続確認
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
          HEALTH="${RUNNER_TEMP}/school-next-4-health.json"

          STATUS="$(curl -sS -L --retry 2 --max-time 25 \
            -A "${UA}" \
            -H "Accept: application/json,text/plain,*/*" \
            -H "Accept-Language: ja,en-US;q=0.9,en;q=0.8" \
            -H "Cache-Control: no-cache" \
            -o "${HEALTH}" -w '%{http_code}' \
            "${API_BASE}/api/health?next_check=school-next-4-${GITHUB_RUN_ID}")"

          if [ "${STATUS}" != "200" ]; then
            echo "::error::Worker health HTTP ${STATUS}"
            cat "${HEALTH}" || true
            exit 1
          fi

          python3 - "${HEALTH}" "${EXPECTED_WORKER_VERSION}" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = sys.argv[2]
          if data.get("version") != expected:
              raise SystemExit(f"Worker version mismatch: {data.get('version')} != {expected}")
          if data.get("db_ok") is not True:
              raise SystemExit("db_ok is not true")
          print("Worker / Supabase OK")
          PY

      - name: 6. NEXT-4を仮Commit・Push
        if: steps.preflight.outputs.mode == 'apply'
        id: apply
        shell: bash
        env:
          BEFORE_SHA256: ${{ steps.preflight.outputs.before_sha256 }}
          BEFORE_GIT_SHA: ${{ steps.preflight.outputs.before_git_sha }}
          AFTER_SHA256: ${{ steps.validate.outputs.after_sha256 }}
          OK_COUNT: ${{ steps.validate.outputs.ok_count }}
          WARNING_COUNT: ${{ steps.validate.outputs.warning_count }}
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import os

          out = Path("dpro-next")
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")
          record = f'''step: "SCHOOL-NEXT-4"
          revision: "R1"
          result: "PUBLIC_VERIFY_PENDING"
          applied_at_jst: "{now}"
          target_files:
            - "owner.html"
          changes:
            - "受付・授業の業務進捗ボード"
            - "体験確認・欠席振替対応・授業予定・来校済・授業中・欠席・完了の7段階"
            - "進捗カードから統合一覧を絞り込み"
            - "統合一覧へ進捗バッジを表示"
            - "既存状態更新ボタンを維持"
            - "完了後のYML再アップロードによる台帳書戻しを防止"
            - "進捗バッジ追加をインデント非依存の正規表現へ修正"
            - "存在しない台帳ファイルでも失敗しない安全なロールバック"
          owner_before_sha256: "{os.environ.get('BEFORE_SHA256','')}"
          owner_after_sha256: "{os.environ.get('AFTER_SHA256','')}"
          baseline_commit: "{os.environ.get('BEFORE_GIT_SHA','')}"
          backup_tag: "backup-school-next-before-4-20260724"
          worker_changed: false
          supabase_changed: false
          sql_required: false
          api_changed: false
          added_network_request: false
          validation_ok: {os.environ.get('OK_COUNT','0')}
          validation_warning: {os.environ.get('WARNING_COUNT','0')}
          next_step_after_public_verify: "SCHOOL-NEXT-5"
          '''
          record = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in record.splitlines()
          ) + "\n"
          (out / "school-next-4-change-record.yml").write_text(record, encoding="utf-8")
          PY

          git add owner.html \
            "${STATE_DIR}/school-next-4-validation.json" \
            "${STATE_DIR}/school-next-4-change-record.yml"

          git commit -m "feat(school-next): apply NEXT-4 progress board"
          git push origin main
          echo "applied=true" >> "${GITHUB_OUTPUT}"

      - name: 7. GitHub Pages公開反映確認
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
          PAGE="${RUNNER_TEMP}/school-next-4-public.html"
          PASS=0

          for attempt in $(seq 1 24); do
            STATUS="$(curl -sS -L --max-time 25 \
              -A "${UA}" \
              -H "Accept: text/html,application/xhtml+xml" \
              -H "Cache-Control: no-cache" \
              -o "${PAGE}" -w '%{http_code}' \
              "${OWNER_URL}?next_check=school-next-4-${GITHUB_RUN_ID}-${attempt}")" || STATUS="000"

            if [ "${STATUS}" = "200" ] \
              && grep -q 'STEP SCHOOL-NEXT-4 / owner.html' "${PAGE}" \
              && grep -q 'id="progressBoard"' "${PAGE}" \
              && grep -q '業務進捗ボード' "${PAGE}" \
              && grep -q 'data-progress-stage="in_progress"' "${PAGE}" \
              && grep -q '進捗：' "${PAGE}"; then
              PASS=1
              break
            fi
            sleep 5
          done

          if [ "${PASS}" != "1" ]; then
            echo "::error::GitHub PagesへSCHOOL-NEXT-4が反映されませんでした。"
            exit 1
          fi

      - name: 8. 完成台帳更新・YML削除・自動Commit
        if: steps.preflight.outputs.mode == 'apply' && success()
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          out = Path("dpro-next")
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")

          current_path = out / "current-step.yml"
          current = current_path.read_text(encoding="utf-8")
          current = re.sub(r'^current_step:.*$', 'current_step: "SCHOOL-NEXT-5"', current, flags=re.M)
          current = re.sub(r'^last_completed_step:.*$', 'last_completed_step: "SCHOOL-NEXT-4"', current, flags=re.M)
          current = re.sub(r'^last_result:.*$', 'last_result: "OK"', current, flags=re.M)
          current = re.sub(r'^updated_at_jst:.*$', f'updated_at_jst: "{now}"', current, flags=re.M)
          current = re.sub(r'^worker_changed:.*$', 'worker_changed: false', current, flags=re.M)
          current = re.sub(r'^supabase_changed:.*$', 'supabase_changed: false', current, flags=re.M)
          current = re.sub(r'^api_changed:.*$', 'api_changed: false', current, flags=re.M)
          current_path.write_text(current, encoding="utf-8")

          record_path = out / "school-next-4-change-record.yml"
          record = record_path.read_text(encoding="utf-8")
          record = record.replace('result: "PUBLIC_VERIFY_PENDING"', 'result: "OK"')
          record += (
              f'completed_at_jst: "{now}"\n'
              f'public_owner_url: "https://dpromstk2000-lab.github.io/dpro-school-line/owner.html"\n'
              f'public_verify: "PASS"\n'
              f'current_step: "SCHOOL-NEXT-5"\n'
              f'last_completed_step: "SCHOOL-NEXT-4"\n'
              f'next_step: "SCHOOL-NEXT-5"\n'
          )
          record_path.write_text(record, encoding="utf-8")
          PY

          rm -f "${ORIGINAL_WORKFLOW_FILE}" "${WORKFLOW_FILE}"

          stage_path(){
            local path="$1"
            if [ -e "${path}" ] || git ls-files --error-unmatch "${path}" >/dev/null 2>&1; then
              git add -A -- "${path}"
            fi
          }
          stage_path "${CURRENT_STEP_FILE}"
          stage_path "${STATE_DIR}/school-next-4-change-record.yml"
          stage_path "${ORIGINAL_WORKFLOW_FILE}"
          stage_path "${WORKFLOW_FILE}"

          git commit -m "fix(school-next): complete NEXT-4 R1 progress board"
          git push origin main

          {
            echo "## SCHOOL-NEXT-4 R1 完了"
            echo ""
            echo "- 業務進捗ボード: 公開確認PASS"
            echo "- 進捗7段階: PASS"
            echo "- Worker変更: なし"
            echo "- Supabase変更: なし"
            echo "- API変更: なし"
            echo "- 次のSTEP: SCHOOL-NEXT-5"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 9. 失敗時ロールバック・R2台帳
        if: failure() && steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main || true

          CURRENT_AFTER="$(grep -E '^current_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs || true)"
          LAST_AFTER="$(grep -E '^last_completed_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs || true)"

          if [ "${CURRENT_AFTER}" = "SCHOOL-NEXT-5" ] && [ "${LAST_AFTER}" = "SCHOOL-NEXT-4" ]; then
            echo "::notice::NEXT-4は既に完了しています。台帳を書き戻さず終了します。"
            exit 0
          fi

          if [ -f "${RUNNER_TEMP}/owner-before-school-next-4.html" ]; then
            cp "${RUNNER_TEMP}/owner-before-school-next-4.html" owner.html
          fi
          if [ -f "${RUNNER_TEMP}/current-step-before-school-next-4.yml" ]; then
            cp "${RUNNER_TEMP}/current-step-before-school-next-4.yml" "${CURRENT_STEP_FILE}"
          fi

          rm -f "${STATE_DIR}/school-next-4-change-record.yml"

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          out = Path("dpro-next")
          out.mkdir(exist_ok=True)
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")

          current_path = out / "current-step.yml"
          current = current_path.read_text(encoding="utf-8")
          current = re.sub(r'^current_step:.*$', 'current_step: "SCHOOL-NEXT-4-R2_REQUIRED"', current, flags=re.M)
          current = re.sub(r'^last_completed_step:.*$', 'last_completed_step: "SCHOOL-NEXT-3"', current, flags=re.M)
          current = re.sub(r'^last_result:.*$', 'last_result: "NG"', current, flags=re.M)
          current = re.sub(r'^updated_at_jst:.*$', f'updated_at_jst: "{now}"', current, flags=re.M)
          current_path.write_text(current, encoding="utf-8")

          failure = f'''step: "SCHOOL-NEXT-4-R1"
          result: "NG"
          checked_at_jst: "{now}"
          rollback: "owner.htmlとcurrent-stepを変更前へ復元"
          owner_changed_after_rollback: false
          worker_changed: false
          supabase_changed: false
          api_changed: false
          next_step: "SCHOOL-NEXT-4-R2_REQUIRED"
          '''
          failure = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in failure.splitlines()
          ) + "\n"
          (out / "school-next-4-r1-failure-record.yml").write_text(failure, encoding="utf-8")
          PY

          stage_path(){
            local path="$1"
            if [ -e "${path}" ] || git ls-files --error-unmatch "${path}" >/dev/null 2>&1; then
              git add -A -- "${path}"
            fi
          }

          stage_path owner.html
          stage_path "${CURRENT_STEP_FILE}"
          stage_path "${STATE_DIR}/school-next-4-change-record.yml"
          stage_path "${STATE_DIR}/school-next-4-r1-failure-record.yml"
          stage_path "${STATE_DIR}/school-next-4-validation.json"

          if ! git diff --cached --quiet; then
            git commit -m "chore(school-next): rollback NEXT-4 R1 and record failure"
            git push origin main
          fi
