name: "STEP SCHOOL-NEXT-3-R2 | 完了状態復旧"
run-name: "SCHOOL-NEXT-3-R2 recover completed NEXT-3 by ${{ github.actor }}"

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/step-school-next-3-r2-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: school-next-3-r2-recovery
  cancel-in-progress: false

env:
  WORKFLOW_FILE: .github/workflows/step-school-next-3-r2-recovery.yml
  R1_WORKFLOW_FILE: .github/workflows/step-school-next-3-r1-unified-reception.yml
  ORIGINAL_WORKFLOW_FILE: .github/workflows/step-school-next-3-unified-reception.yml
  STATE_DIR: dpro-next
  CURRENT_STEP_FILE: dpro-next/current-step.yml
  CHANGE_RECORD_FILE: dpro-next/school-next-3-change-record.yml
  VALIDATION_FILE: dpro-next/school-next-3-validation.json
  R1_FAILURE_FILE: dpro-next/school-next-3-r1-failure-record.yml
  EXPECTED_CURRENT_STEP: SCHOOL-NEXT-3-R2_REQUIRED
  OWNER_URL: https://dpromstk2000-lab.github.io/dpro-school-line/owner.html
  API_BASE: https://dpro-school-line-api.dpromstk2000.workers.dev
  EXPECTED_WORKER_VERSION: STEP-SCHOOL-NEXT-1-R1-WORKER-SECURITY-20260723
  BASELINE_TAG: backup-school-next-3-recovery-20260724

jobs:
  recovery:
    name: NEXT-3完了状態の検証・台帳復旧
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. リポジトリ取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 復旧前状態確認・バックアップタグ
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "${GITHUB_REF_NAME}" = "main"
          test -f "${WORKFLOW_FILE}"
          test -f "${R1_WORKFLOW_FILE}"
          test -f owner.html
          test -f "${CURRENT_STEP_FILE}"
          test -f "${CHANGE_RECORD_FILE}"
          test -f "${VALIDATION_FILE}"

          CURRENT_STEP="$(grep -E '^current_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs)"
          LAST_COMPLETED="$(grep -E '^last_completed_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs)"

          if [ "${CURRENT_STEP}" != "${EXPECTED_CURRENT_STEP}" ]; then
            echo "::error::current_step=${CURRENT_STEP}, expected=${EXPECTED_CURRENT_STEP}"
            exit 1
          fi
          if [ "${LAST_COMPLETED}" != "SCHOOL-NEXT-3" ]; then
            echo "::error::last_completed_step=${LAST_COMPLETED}, expected=SCHOOL-NEXT-3"
            exit 1
          fi

          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true); puts "YAML syntax OK"' "${WORKFLOW_FILE}"

          BEFORE_GIT_SHA="$(git rev-parse HEAD)"
          echo "before_git_sha=${BEFORE_GIT_SHA}" >> "${GITHUB_OUTPUT}"

          if git rev-parse "refs/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            echo "::notice::既存タグを維持: ${BASELINE_TAG}"
          elif git ls-remote --exit-code --tags origin "refs/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${BASELINE_TAG}:refs/tags/${BASELINE_TAG}"
          else
            git tag -a "${BASELINE_TAG}" "${BEFORE_GIT_SHA}" -m "DPRO 学習塾 LINE / NEXT-3台帳復旧前"
            git push origin "refs/tags/${BASELINE_TAG}"
          fi

      - name: 3. NEXT-3実装・完成記録・検査結果を再確認
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${STATE_DIR}"

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from datetime import datetime, timezone, timedelta
          import hashlib, json, os, re, subprocess

          owner_path = Path("owner.html")
          change_path = Path("dpro-next/school-next-3-change-record.yml")
          validation_path = Path("dpro-next/school-next-3-validation.json")
          output_path = Path("dpro-next/school-next-3-r2-recovery-validation.json")

          owner = owner_path.read_text(encoding="utf-8")
          change = change_path.read_text(encoding="utf-8")
          validation = json.loads(validation_path.read_text(encoding="utf-8"))
          results = []

          def add(key, status, detail, blocking=True):
              results.append({
                  "key": key,
                  "status": status,
                  "detail": detail,
                  "blocking": bool(blocking and status == "NG"),
              })

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids, self.scripts = [], []
                  self.in_script = False
                  self.external = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if data.get("id"):
                      self.ids.append(data["id"])
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = bool(data.get("src"))
                      self.parts = []
              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external:
                          self.scripts.append("".join(self.parts))
                      self.in_script = False
                      self.external = False
                      self.parts = []

          markers = [
              '<div class="version">STEP SCHOOL-NEXT-3 / owner.html</div>',
              '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-3 / owner.html</p>',
              "const VERSION = 'STEP SCHOOL-NEXT-3';",
              "受付・予約統合一覧",
              'id="unifiedFilterBar"',
              'id="unifiedSearchInput"',
              'id="clearUnifiedSearchBtn"',
              'id="unifiedCountLabel"',
              'id="unifiedReceptionList"',
              "renderUnifiedReception",
              "getUnifiedItems",
              "unifiedUnique",
              "unifiedNextLessonStatus",
              "slice(0, 30)",
              'id="requestTabs"',
              'id="requestList"',
              'id="lessonList"',
              'id="createLessonCard"',
              'id="clearAdminBtn"',
          ]
          missing = [m for m in markers if m not in owner]
          add("owner_markers", "NG" if missing else "OK",
              "不足: " + " / ".join(missing) if missing else f"必須マーカー {len(markers)}件")

          parser = Inspector()
          parser.feed(owner)
          parser.close()
          duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
          add("duplicate_ids", "NG" if duplicates else "OK",
              "重複: " + ", ".join(duplicates) if duplicates else f"HTML ID {len(parser.ids)}件、重複なし")

          js_errors = []
          for index, script in enumerate(parser.scripts, 1):
              if not script.strip():
                  continue
              temp = Path("dpro-next") / f".next3-r2-{index}.js"
              temp.write_text(script, encoding="utf-8")
              proc = subprocess.run(["node", "--check", str(temp)], capture_output=True, text=True)
              temp.unlink(missing_ok=True)
              if proc.returncode:
                  js_errors.append((proc.stderr or proc.stdout)[-1400:])
          add("javascript", "NG" if js_errors else "OK",
              " / ".join(js_errors) if js_errors else f"インラインscript {len(parser.scripts)}件 PASS")

          owner_sha = hashlib.sha256(owner_path.read_bytes()).hexdigest()
          sha_match = re.search(r'^owner_after_sha256:\s*"([^"]+)"', change, re.M)
          recorded_sha = sha_match.group(1) if sha_match else ""
          add("owner_sha256", "OK" if owner_sha == recorded_sha else "NG",
              f"current={owner_sha} / recorded={recorded_sha or 'missing'}")

          record_markers = [
              'revision: "R1"', 'result: "OK"', 'public_verify: "PASS"',
              'next_step: "SCHOOL-NEXT-4"', 'worker_changed: false',
              'supabase_changed: false', 'api_changed: false'
          ]
          record_missing = [m for m in record_markers if m not in change]
          add("change_record", "NG" if record_missing else "OK",
              "不足: " + " / ".join(record_missing) if record_missing else f"完成記録 {len(record_markers)}項目")

          validation_ok = (
              validation.get("step") == "SCHOOL-NEXT-3"
              and validation.get("blocking_ng") == 0
              and validation.get("counts", {}).get("NG") == 0
              and validation.get("counts", {}).get("OK", 0) >= 13
          )
          add("validation_record", "OK" if validation_ok else "NG",
              f"step={validation.get('step')} / counts={validation.get('counts')} / blocking={validation.get('blocking_ng')}")

          fetch_count = owner.count("fetch(")
          add("network_guard", "OK" if fetch_count == 1 else "NG", f"fetch呼出数={fetch_count}（期待1）")

          size = owner_path.stat().st_size
          add("file_size", "OK" if size <= 180000 else "注意", f"owner.html {size:,} bytes", blocking=False)
          add("worker_change", "OK", "今回の復旧では変更なし")
          add("supabase_change", "OK", "今回の復旧では変更なし・SQL不要")
          add("api_change", "OK", "今回の復旧では変更なし")

          counts = {name: sum(1 for r in results if r["status"] == name) for name in ["OK", "注意", "NG"]}
          blocking_ng = sum(1 for r in results if r["blocking"])
          payload = {
              "step": "SCHOOL-NEXT-3-R2",
              "purpose": "完了後のR1再アップロードで書き戻された台帳の復旧",
              "checked_at_jst": datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds"),
              "owner_sha256": owner_sha,
              "counts": counts,
              "blocking_ng": blocking_ng,
              "results": results,
          }
          output_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"owner_sha256={owner_sha}\n")
              fh.write(f"ok_count={counts['OK']}\n")
              fh.write(f"warning_count={counts['注意']}\n")

          if blocking_ng:
              raise SystemExit(f"blocking NG: {blocking_ng}")
          PY

      - name: 4. Worker・Supabase・公開owner確認
        shell: bash
        run: |
          set -Eeuo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
          HEALTH="${RUNNER_TEMP}/next3-r2-health.json"
          PAGE="${RUNNER_TEMP}/next3-r2-owner.html"

          HEALTH_STATUS="$(curl -sS -L --retry 2 --max-time 25 \
            -A "${UA}" -H "Accept: application/json,text/plain,*/*" -H "Cache-Control: no-cache" \
            -o "${HEALTH}" -w '%{http_code}' \
            "${API_BASE}/api/health?next_check=school-next-3-r2-${GITHUB_RUN_ID}")"
          test "${HEALTH_STATUS}" = "200"

          python3 - "${HEALTH}" "${EXPECTED_WORKER_VERSION}" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("version") != sys.argv[2]:
              raise SystemExit(f"Worker version mismatch: {data.get('version')} != {sys.argv[2]}")
          if data.get("db_ok") is not True:
              raise SystemExit("db_ok is not true")
          PY

          PASS=0
          for attempt in $(seq 1 12); do
            PAGE_STATUS="$(curl -sS -L --max-time 25 \
              -A "${UA}" -H "Accept: text/html,application/xhtml+xml" -H "Cache-Control: no-cache" \
              -o "${PAGE}" -w '%{http_code}' \
              "${OWNER_URL}?next_check=school-next-3-r2-${GITHUB_RUN_ID}-${attempt}")" || PAGE_STATUS="000"

            if [ "${PAGE_STATUS}" = "200" ] \
              && grep -q 'STEP SCHOOL-NEXT-3 / owner.html' "${PAGE}" \
              && grep -q 'id="unifiedReceptionList"' "${PAGE}" \
              && grep -q '受付・予約統合一覧' "${PAGE}" \
              && grep -q 'slice(0, 30)' "${PAGE}"; then
              PASS=1
              break
            fi
            sleep 5
          done
          test "${PASS}" = "1"

      - name: 5. 台帳復旧・誤再実行記録・YML削除
        if: success()
        shell: bash
        env:
          OWNER_SHA256: ${{ steps.verify.outputs.owner_sha256 }}
          OK_COUNT: ${{ steps.verify.outputs.ok_count }}
          WARNING_COUNT: ${{ steps.verify.outputs.warning_count }}
          BEFORE_GIT_SHA: ${{ steps.preflight.outputs.before_git_sha }}
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import os, re

          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")
          current_path = Path("dpro-next/current-step.yml")
          current = current_path.read_text(encoding="utf-8")
          current = re.sub(r'^current_step:.*$', 'current_step: "SCHOOL-NEXT-4"', current, flags=re.M)
          current = re.sub(r'^last_completed_step:.*$', 'last_completed_step: "SCHOOL-NEXT-3"', current, flags=re.M)
          current = re.sub(r'^last_result:.*$', 'last_result: "OK"', current, flags=re.M)
          current = re.sub(r'^updated_at_jst:.*$', f'updated_at_jst: "{now}"', current, flags=re.M)
          current = re.sub(r'^worker_changed:.*$', 'worker_changed: false', current, flags=re.M)
          current = re.sub(r'^supabase_changed:.*$', 'supabase_changed: false', current, flags=re.M)
          current = re.sub(r'^api_changed:.*$', 'api_changed: false', current, flags=re.M)
          current_path.write_text(current, encoding="utf-8")

          change_path = Path("dpro-next/school-next-3-change-record.yml")
          change = change_path.read_text(encoding="utf-8")
          if 'recovery_step: "SCHOOL-NEXT-3-R2"' not in change:
              change += (
                  f'recovery_step: "SCHOOL-NEXT-3-R2"\n'
                  f'recovered_at_jst: "{now}"\n'
                  'recovery_reason: "NEXT-3完了後にR1 YMLが再アップロードされ、失敗時処理が台帳だけを書き戻したため"\n'
                  'recovery_result: "OK"\n'
              )
          change_path.write_text(change, encoding="utf-8")

          r1_failure = Path("dpro-next/school-next-3-r1-failure-record.yml")
          if r1_failure.exists():
              text = r1_failure.read_text(encoding="utf-8")
              if 'superseded_by: "SCHOOL-NEXT-3-R2"' not in text:
                  text += (
                      'superseded_by: "SCHOOL-NEXT-3-R2"\n'
                      f'superseded_at_jst: "{now}"\n'
                      'note: "NEXT-3実装は既に完了済み。このNGはR1再アップロードによる台帳書戻し"\n'
                  )
              r1_failure.write_text(text, encoding="utf-8")

          record = f'''step: "SCHOOL-NEXT-3-R2"
          result: "OK"
          recovered_at_jst: "{now}"
          purpose: "完了済みNEXT-3の台帳復旧"
          cause: "成功後にR1 YMLが再アップロードされた"
          owner_sha256: "{os.environ.get('OWNER_SHA256','')}"
          validation_ok: {os.environ.get('OK_COUNT','0')}
          validation_warning: {os.environ.get('WARNING_COUNT','0')}
          recovery_baseline_commit: "{os.environ.get('BEFORE_GIT_SHA','')}"
          backup_tag: "backup-school-next-3-recovery-20260724"
          owner_changed: false
          worker_changed: false
          supabase_changed: false
          sql_required: false
          api_changed: false
          public_owner: "PASS"
          current_step: "SCHOOL-NEXT-4"
          last_completed_step: "SCHOOL-NEXT-3"
          next_step: "SCHOOL-NEXT-4"
          '''
          record = "\n".join(line[10:] if line.startswith("          ") else line for line in record.splitlines()) + "\n"
          Path("dpro-next/school-next-3-r2-recovery-record.yml").write_text(record, encoding="utf-8")
          PY

          rm -f "${ORIGINAL_WORKFLOW_FILE}" "${R1_WORKFLOW_FILE}" "${WORKFLOW_FILE}"

          git add "${CURRENT_STEP_FILE}" "${CHANGE_RECORD_FILE}" "${R1_FAILURE_FILE}" \
            "${STATE_DIR}/school-next-3-r2-recovery-record.yml" \
            "${STATE_DIR}/school-next-3-r2-recovery-validation.json"
          git add -A -- .github/workflows

          git commit -m "fix(school-next): recover completed NEXT-3 state"
          git push origin main

          {
            echo "## SCHOOL-NEXT-3-R2 復旧完了"
            echo ""
            echo "- NEXT-3実装・公開画面: PASS"
            echo "- current_step: SCHOOL-NEXT-4"
            echo "- owner.html変更: なし"
            echo "- Worker / Supabase / API変更: なし"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 6. 復旧失敗時R3台帳
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main || true

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")
          current_path = Path("dpro-next/current-step.yml")
          if current_path.exists():
              current = current_path.read_text(encoding="utf-8")
              current = re.sub(r'^current_step:.*$', 'current_step: "SCHOOL-NEXT-3-R3_REQUIRED"', current, flags=re.M)
              current = re.sub(r'^last_completed_step:.*$', 'last_completed_step: "SCHOOL-NEXT-3"', current, flags=re.M)
              current = re.sub(r'^last_result:.*$', 'last_result: "NG"', current, flags=re.M)
              current = re.sub(r'^updated_at_jst:.*$', f'updated_at_jst: "{now}"', current, flags=re.M)
              current_path.write_text(current, encoding="utf-8")

          record = f'''step: "SCHOOL-NEXT-3-R2"
          result: "NG"
          checked_at_jst: "{now}"
          owner_changed: false
          worker_changed: false
          supabase_changed: false
          api_changed: false
          next_step: "SCHOOL-NEXT-3-R3_REQUIRED"
          '''
          record = "\n".join(line[10:] if line.startswith("          ") else line for line in record.splitlines()) + "\n"
          Path("dpro-next/school-next-3-r2-failure-record.yml").write_text(record, encoding="utf-8")
          PY

          git add "${CURRENT_STEP_FILE}" "${STATE_DIR}/school-next-3-r2-failure-record.yml"
          if [ -f "${STATE_DIR}/school-next-3-r2-recovery-validation.json" ]; then
            git add "${STATE_DIR}/school-next-3-r2-recovery-validation.json"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore(school-next): record NEXT-3 R2 recovery failure"
            git push origin main
          fi
