name: SCHOOL Tutorial R4 Guide Center QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/school-r4-guide-center-qa.yml"

permissions:
  contents: write

concurrency:
  group: school-tutorial-r4-guide-center-qa
  cancel-in-progress: false

jobs:
  guide-center-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_BASE: https://dpromstk2000-lab.github.io/dpro-school-line/
      WORKFLOW_PATH: .github/workflows/school-r4-guide-center-qa.yml
      QA_RESULT: tutorial-qa/school-r4-guide-center-qa.json
      R3_RESULT: tutorial-qa/school-r3-live-qa.json
      EXPECTED_GUIDE_SHA256: df6b099b4b588a033ee20a376dfb7c3b5cfc583609a2a4c15aa8dfe6472bc31e

    steps:
      - name: Checkout newest SCHOOL main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R3 gate and R4 payload
        shell: bash
        run: |
          set -euo pipefail
          test -s "$R3_RESULT"
          node - <<'NODE'
          const r=require('./tutorial-qa/school-r3-live-qa.json');
          if(r.pass!==true) throw new Error('R3 pass is not true');
          if(!Array.isArray(r.failures)||r.failures.length!==0) throw new Error('R3 failures not empty');
          if(!Array.isArray(r.unsafeWrites)||r.unsafeWrites.length!==0) throw new Error('R3 unsafeWrites not empty');
          if(r.businessMutation!==0) throw new Error('R3 businessMutation is not 0');
          if(r.first10Expected!==10) throw new Error('R3 First10 is not 10');
          NODE
          test -s guide-center.html
          test "$(sha256sum guide-center.html | awk '{print $1}')" = "$EXPECTED_GUIDE_SHA256"
          grep -q 'DPRO_TUTORIAL_SCHOOL_R4_GUIDE_CENTER_V1_0' guide-center.html
          test "$(grep -o 'data-guide-step data-step-key=' guide-center.html | wc -l)" -eq 10
          ! grep -Eq '\bfetch\s*\(' guide-center.html
          ! grep -Eq 'XMLHttpRequest|sendBeacon' guide-center.html
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/r4-qa-upload-head.txt
          printf '%s\n' "$(git log -1 --format=%H -- guide-center.html)" > /tmp/r4-guide-head.txt

      - name: Wait for GitHub Pages Guide Center
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            cb="qa=$(date +%s)-$i"
            if curl -fsS -o /tmp/school-r4-guide-center.html "${PUBLIC_BASE}guide-center.html?${cb}" \
              && grep -q 'DPRO_TUTORIAL_SCHOOL_R4_GUIDE_CENTER_V1_0' /tmp/school-r4-guide-center.html; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1

      - name: Setup Node and Chromium
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run exact-width R4 Guide Center QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutorial-qa
          rm -f "$QA_RESULT"
          cat > ./school-r4-guide-center-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base=process.env.PUBLIC_BASE;
          const resultPath=process.env.QA_RESULT;
          const viewports=[
            {name:'1440',width:1440,height:1000},
            {name:'1024',width:1024,height:768},
            {name:'390',width:390,height:844},
            {name:'320',width:320,height:720}
          ];
          const result={
            schema:'DPRO_TUTORIAL_SCHOOL_R4_GUIDE_CENTER_QA_V1_0',
            publicBase:base,
            qaUploadHead:fs.readFileSync('/tmp/r4-qa-upload-head.txt','utf8').trim(),
            guideHead:fs.readFileSync('/tmp/r4-guide-head.txt','utf8').trim(),
            exactViewports:viewports,
            first10Expected:10,
            widths:[],
            unsafeWrites:[],
            failures:[],
            businessMutation:0,
            standard:'V1.1_LOCKED'
          };
          const browser=await chromium.launch({headless:true});
          function fail(vp,msg){result.failures.push(`${vp}: ${msg}`);}
          async function waitGuide(page){
            await page.waitForFunction(()=>window.DPRO_SCHOOL_GUIDE_CENTER?.ready===true && window.DPRO_TUTORIAL_SCHOOL?.first10Count===10,null,{timeout:15000});
            await page.waitForSelector('#guideReady[data-guide-ready="true"]',{timeout:15000});
          }
          async function waitTutorial(page){
            await page.waitForFunction(()=>window.DPRO_TUTORIAL_SCHOOL?.first10Count===10,null,{timeout:15000});
          }
          async function tabToGuideAction(page,wanted){
            await page.evaluate(()=>document.activeElement?.blur?.());
            for(let i=0;i<24;i++){
              await page.keyboard.press('Tab');
              const action=await page.evaluate(()=>document.activeElement?.getAttribute?.('data-guide-action')||'');
              if(action===wanted)return true;
            }
            return false;
          }
          async function visibleFocus(page){
            return page.evaluate(()=>{
              const e=document.activeElement;if(!e)return false;
              const s=getComputedStyle(e);
              return s.outlineStyle!=='none'&&s.outlineWidth!=='0px';
            });
          }
          async function makeContext(spec,bucket){
            const context=await browser.newContext({viewport:{width:spec.width,height:spec.height}});
            await context.route('**/*',async route=>{
              const req=route.request();const method=req.method();
              bucket.network.push({method,url:req.url(),type:req.resourceType()});
              if(['POST','PUT','PATCH','DELETE'].includes(method)){
                result.unsafeWrites.push({viewport:spec.name,method,url:req.url()});
                return route.abort('blockedbyclient');
              }
              return route.continue();
            });
            return context;
          }
          async function guideMetrics(page){
            return page.evaluate(()=>({
              href:location.href,
              innerWidth:innerWidth,
              innerHeight:innerHeight,
              documentScrollWidth:document.documentElement.scrollWidth,
              bodyScrollWidth:document.body.scrollWidth,
              guideCount:document.querySelectorAll('[data-guide-step]').length,
              apiCount:window.DPRO_TUTORIAL_SCHOOL?.first10Count??null,
              aligned:window.DPRO_SCHOOL_GUIDE_CENTER?.aligned===true,
              ready:document.getElementById('guideReady')?.dataset.guideReady||null,
              stateMode:window.DPRO_SCHOOL_GUIDE_CENTER?.stateMode||null,
              buttons:[...document.querySelectorAll('[data-guide-action]')].map(b=>({action:b.dataset.guideAction,disabled:b.disabled}))
            }));
          }
          async function alignmentData(page){
            return page.evaluate(()=>{
              const api=window.DPRO_TUTORIAL_SCHOOL;
              const rows=[...document.querySelectorAll('[data-guide-step]')];
              return rows.map((row,i)=>({
                i,
                guide:{key:row.dataset.stepKey,route:row.dataset.route,primary:row.dataset.primary,fallback:row.dataset.fallback,title:row.querySelector('h3')?.textContent?.trim()||''},
                api:api?.steps?.[i]?{key:api.steps[i].key,route:api.steps[i].route,primary:api.steps[i].primary,fallback:api.steps[i].fallback,title:api.steps[i].title}:null
              }));
            });
          }
          function alignmentOk(items){
            return items.length===10&&items.every(x=>x.api&&x.guide.key===x.api.key&&x.guide.route===x.api.route&&x.guide.primary===x.api.primary&&x.guide.fallback===x.api.fallback&&x.guide.title===x.api.title);
          }
          async function runViewport(spec){
            const bucket={viewport:spec,metrics:null,alignment:[],controls:{},pageErrors:[],consoleErrors:[],network:[]};
            result.widths.push(bucket);
            const context=await makeContext(spec,bucket);
            const page=await context.newPage();
            page.on('pageerror',e=>bucket.pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')bucket.consoleErrors.push(m.text());});

            await page.goto(`${base}guide-center.html?qa=r4-${spec.name}-${Date.now()}`,{waitUntil:'domcontentloaded'});
            await waitGuide(page);
            const m=await guideMetrics(page);bucket.metrics=m;
            if(m.innerWidth!==spec.width)fail(spec.name,`innerWidth ${m.innerWidth}`);
            if(m.documentScrollWidth>m.innerWidth)fail(spec.name,`document overflow ${m.documentScrollWidth-m.innerWidth}`);
            if(m.bodyScrollWidth>m.innerWidth)fail(spec.name,`body overflow ${m.bodyScrollWidth-m.innerWidth}`);
            if(m.guideCount!==10||m.apiCount!==10)fail(spec.name,`First10 mismatch guide=${m.guideCount} api=${m.apiCount}`);
            if(!m.aligned||m.ready!=='true')fail(spec.name,'Guide Center runtime alignment not ready');
            const startButton=m.buttons.find(b=>b.action==='start');
            const resumeButton=m.buttons.find(b=>b.action==='resume');
            const replayButton=m.buttons.find(b=>b.action==='replay');
            if(m.buttons.length!==3||m.stateMode!=='start'||startButton?.disabled!==false||resumeButton?.disabled!==true||replayButton?.disabled!==true)fail(spec.name,'fresh Start/Resume/Replay state mismatch');
            const alignment=await alignmentData(page);bucket.alignment=alignment;
            if(!alignmentOk(alignment))fail(spec.name,'Guide Center First10 does not exactly match runtime');

            const startFocused=await tabToGuideAction(page,'start');
            if(!startFocused)fail(spec.name,'keyboard cannot reach Start');
            const startFocusVisible=startFocused?await visibleFocus(page):false;
            if(!startFocusVisible)fail(spec.name,'Start visible focus not proven');
            bucket.controls.startFocusVisible=startFocusVisible;
            if(startFocused){
              await Promise.all([page.waitForURL(/index\.html/),page.keyboard.press('Enter')]);
              await waitTutorial(page);
              const s=await page.evaluate(()=>window.DPRO_TUTORIAL_SCHOOL.readState());
              if(s.currentStepKey!=='school.first10.01'||s.closed||s.complete||s.skipped)fail(spec.name,'Start did not open Step 1');
              bucket.controls.start=true;
            }

            await page.locator('[data-dpro-tutorial-action="next"]').click();
            await page.waitForFunction(()=>window.DPRO_TUTORIAL_SCHOOL.readState().currentStepKey==='school.first10.02');
            await page.locator('[data-dpro-tutorial-action="close"]').click();
            await page.goto(`${base}guide-center.html?qa=r4-resume-${spec.name}-${Date.now()}`,{waitUntil:'domcontentloaded'});
            await waitGuide(page);
            const resumeMode=await page.evaluate(()=>window.DPRO_SCHOOL_GUIDE_CENTER?.stateMode);
            if(resumeMode!=='resume')fail(spec.name,`Guide Center resume state mismatch: ${resumeMode}`);
            const resumeFocused=await tabToGuideAction(page,'resume');
            if(!resumeFocused)fail(spec.name,'keyboard cannot reach Resume');
            if(resumeFocused){
              await Promise.all([page.waitForURL(/index\.html/),page.keyboard.press('Enter')]);
              await waitTutorial(page);
              const s=await page.evaluate(()=>window.DPRO_TUTORIAL_SCHOOL.readState());
              if(s.currentStepKey!=='school.first10.02'||s.closed)fail(spec.name,'Resume did not restore Step 2');
              bucket.controls.resume=true;
            }

            await page.evaluate(()=>window.DPRO_TUTORIAL_SCHOOL.skip());
            await page.goto(`${base}guide-center.html?qa=r4-replay-${spec.name}-${Date.now()}`,{waitUntil:'domcontentloaded'});
            await waitGuide(page);
            const replayMode=await page.evaluate(()=>window.DPRO_SCHOOL_GUIDE_CENTER?.stateMode);
            if(replayMode!=='replay')fail(spec.name,`Guide Center replay state mismatch: ${replayMode}`);
            const replayFocused=await tabToGuideAction(page,'replay');
            if(!replayFocused)fail(spec.name,'keyboard cannot reach Replay');
            if(replayFocused){
              await Promise.all([page.waitForURL(/index\.html/),page.keyboard.press('Enter')]);
              await waitTutorial(page);
              const s=await page.evaluate(()=>window.DPRO_TUTORIAL_SCHOOL.readState());
              if(s.currentStepKey!=='school.first10.01'||s.closed||s.complete||s.skipped)fail(spec.name,'Replay did not reset to Step 1');
              bucket.controls.replay=true;
            }

            if(bucket.pageErrors.length)fail(spec.name,`pageerror ${bucket.pageErrors.join(' | ')}`);
            if(bucket.consoleErrors.length)fail(spec.name,`console error ${bucket.consoleErrors.join(' | ')}`);
            await context.close();
          }

          for(const spec of viewports){await runViewport(spec);}
          await browser.close();
          if(result.unsafeWrites.length){result.businessMutation=result.unsafeWrites.length;result.failures.push(`unsafe write count ${result.unsafeWrites.length}`);}
          result.pass=result.failures.length===0&&result.unsafeWrites.length===0;
          result.completedAt=new Date().toISOString();
          fs.writeFileSync(resultPath,JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          NODE
          node ./school-r4-guide-center-qa.mjs

      - name: Commit R4 QA evidence and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$QA_RESULT")"
          test -s "$QA_RESULT" || printf '%s\n' '{"schema":"DPRO_TUTORIAL_SCHOOL_R4_GUIDE_CENTER_QA_V1_0","pass":false,"failures":["R4 QA result file missing"],"businessMutation":0}' > "$QA_RESULT"
          pass=$(node -e "const r=require('./$QA_RESULT');process.stdout.write(r.pass?'true':'false')")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f ./school-r4-guide-center-qa.mjs
          rm -f "$WORKFLOW_PATH"
          git add "$QA_RESULT" "$WORKFLOW_PATH"
          git commit -m "Record SCHOOL R4 Guide Center QA and remove temporary workflow [skip ci]" || true
          git push origin HEAD:main
          test "$pass" = "true"
