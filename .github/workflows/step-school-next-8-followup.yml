          local_only = (
              "このブラウザ上で候補を隠す補助機能" in owner_text
              and "教室全体の共有済み記録ではありません" in owner_text
          )
          add(
              "local_review_disclosure",
              "端末内確認済みの説明",
              "OK" if local_only else "NG",
              "14日間・端末内限定を表示" if local_only else "端末内限定の説明不足",
              not local_only,
          )

          changed = subprocess.run(
              ["git", "diff", "--name-only"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout.splitlines()
          unexpected_files = [
              name for name in changed
              if name not in ["owner.html", "member.html"]
          ]
          add(
              "scope",
              "対象ファイル限定",
              "NG" if unexpected_files else "OK",
              "意図しない変更: " + ", ".join(unexpected_files) if unexpected_files else "本体変更はowner.html・member.htmlのみ",
              bool(unexpected_files),
          )

          add("worker", "Worker変更", "OK", "変更なし")
          add("supabase", "Supabase変更", "OK", "変更なし・SQL不要")
          add("followup_storage", "新規フォローテーブル", "OK", "追加なし・既存データと端末内補助記録を利用")
          add("member_storage", "会員次アクション保存", "OK", "保存せず取得済みプロフィールから都度判定")

          counts = {
              status: sum(1 for row in results if row["status"] == status)
              for status in ["OK", "注意", "NG"]
          }
          blocking = sum(1 for row in results if row["blocking"])
          payload = {
              "step": "SCHOOL-NEXT-8",
              "checked_at_jst": datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds"),
              "files": payload_files,
              "counts": counts,
              "blocking_ng": blocking,
              "results": results,
          }
          Path("dpro-next/school-next-8-validation.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"owner_after_sha256={payload_files['owner']['after_sha256']}\n")
              fh.write(f"member_after_sha256={payload_files['member']['after_sha256']}\n")
              fh.write(f"ok_count={counts['OK']}\n")
              fh.write(f"warning_count={counts['注意']}\n")
              fh.write(f"ng_count={counts['NG']}\n")

          if blocking:
              raise SystemExit(f"blocking NG: {blocking}")
          PY

      - name: 5. Worker・Supabase接続確認
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
          HEALTH="${RUNNER_TEMP}/school-next-8-health.json"

          STATUS="$(curl -sS -L --retry 2 --max-time 25 \
            -A "${UA}" \
            -H "Accept: application/json,text/plain,*/*" \
            -H "Cache-Control: no-cache" \
            -o "${HEALTH}" -w '%{http_code}' \
            "${API_BASE}/api/health?next_check=school-next-8-${GITHUB_RUN_ID}")"

          if [ "${STATUS}" != "200" ]; then
            echo "::error::Worker health HTTP ${STATUS}"
            cat "${HEALTH}" || true
            exit 1
          fi

          python3 - "${HEALTH}" "${EXPECTED_WORKER_VERSION}" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = sys.argv[2]
          if data.get("version") != expected:
              raise SystemExit(f"Worker version mismatch: {data.get('version')} != {expected}")
          if data.get("db_ok") is not True:
              raise SystemExit("db_ok is not true")
          print("Worker / Supabase OK")
          PY

      - name: 6. NEXT-8を仮Commit・Push
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        env:
          BEFORE_OWNER_SHA256: ${{ steps.preflight.outputs.before_owner_sha256 }}
          BEFORE_MEMBER_SHA256: ${{ steps.preflight.outputs.before_member_sha256 }}
          BEFORE_GIT_SHA: ${{ steps.preflight.outputs.before_git_sha }}
          OWNER_AFTER_SHA256: ${{ steps.validate.outputs.owner_after_sha256 }}
          MEMBER_AFTER_SHA256: ${{ steps.validate.outputs.member_after_sha256 }}
          OK_COUNT: ${{ steps.validate.outputs.ok_count }}
          WARNING_COUNT: ${{ steps.validate.outputs.warning_count }}
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import os

          out = Path("dpro-next")
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")
          record = f'''step: "SCHOOL-NEXT-8"
          result: "PUBLIC_VERIFY_PENDING"
          applied_at_jst: "{now}"
          target_files:
            - "owner.html"
            - "member.html"
          changes:
            - "体験後フォロー候補"
            - "欠席・振替後フォロー候補"
            - "授業完了後の次回確認候補"
            - "個別フォロー文面の表示・コピー"
            - "端末内14日間の確認済み補助表示"
            - "会員画面の次にすること"
            - "確認待ち・次回授業・振替・教室相談の案内"
          owner_before_sha256: "{os.environ.get('BEFORE_OWNER_SHA256','')}"
          owner_after_sha256: "{os.environ.get('OWNER_AFTER_SHA256','')}"
          member_before_sha256: "{os.environ.get('BEFORE_MEMBER_SHA256','')}"
          member_after_sha256: "{os.environ.get('MEMBER_AFTER_SHA256','')}"
          baseline_commit: "{os.environ.get('BEFORE_GIT_SHA','')}"
          backup_tag: "backup-school-next-before-8-20260724"
          worker_changed: false
          supabase_changed: false
          sql_required: false
          api_changed: false
          added_network_request: false
          new_followup_table: false
          automatic_line_delivery: false
          followup_display_limit: 20
          reviewed_retention_days: 14
          reviewed_scope: "browser_local_only"
          reviewed_shared_across_devices: false
          member_next_action_persisted: false
          validation_ok: {os.environ.get('OK_COUNT','0')}
          validation_warning: {os.environ.get('WARNING_COUNT','0')}
          next_step_after_public_verify: "SCHOOL-NEXT-9"
          '''
          record = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in record.splitlines()
          ) + "\n"
          (out / "school-next-8-change-record.yml").write_text(record, encoding="utf-8")
          PY

          git add owner.html member.html \
            "${STATE_DIR}/school-next-8-validation.json" \
            "${STATE_DIR}/school-next-8-change-record.yml"

          git commit -m "feat(school-next): apply NEXT-8 followup"
          git push origin main

      - name: 7. GitHub Pages公開反映確認
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
          OWNER_PAGE="${RUNNER_TEMP}/school-next-8-owner.html"
          MEMBER_PAGE="${RUNNER_TEMP}/school-next-8-member.html"
          PASS=0

          for attempt in $(seq 1 24); do
            OWNER_STATUS="$(curl -sS -L --max-time 25 \
              -A "${UA}" -H "Accept: text/html" -H "Cache-Control: no-cache" \
              -o "${OWNER_PAGE}" -w '%{http_code}' \
              "${OWNER_URL}?next_check=school-next-8-${GITHUB_RUN_ID}-${attempt}")" || OWNER_STATUS="000"

            MEMBER_STATUS="$(curl -sS -L --max-time 25 \
              -A "${UA}" -H "Accept: text/html" -H "Cache-Control: no-cache" \
              -o "${MEMBER_PAGE}" -w '%{http_code}' \
              "${MEMBER_URL}?next_check=school-next-8-${GITHUB_RUN_ID}-${attempt}")" || MEMBER_STATUS="000"

            if [ "${OWNER_STATUS}" = "200" ] \
              && [ "${MEMBER_STATUS}" = "200" ] \
              && grep -q 'STEP SCHOOL-NEXT-8 / owner.html' "${OWNER_PAGE}" \
              && grep -q 'id="followupCard"' "${OWNER_PAGE}" \
              && grep -q 'id="followupList"' "${OWNER_PAGE}" \
              && grep -q 'STEP SCHOOL-NEXT-8 / member.html' "${MEMBER_PAGE}" \
              && grep -q 'id="memberNextActionSection"' "${MEMBER_PAGE}" \
              && grep -q 'function renderNextMemberAction' "${MEMBER_PAGE}"; then
              PASS=1
              break
            fi
            sleep 5
          done

          if [ "${PASS}" != "1" ]; then
            echo "::error::GitHub PagesへSCHOOL-NEXT-8が反映されませんでした。"
            exit 1
          fi

      - name: 8. 完成台帳更新・YML削除・自動Commit
        if: steps.preflight.outputs.mode == 'apply' && success()
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          out = Path("dpro-next")
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")

          current_path = out / "current-step.yml"
          current = current_path.read_text(encoding="utf-8")
          current = re.sub(r'^current_step:.*$', 'current_step: "SCHOOL-NEXT-9"', current, flags=re.M)
          current = re.sub(r'^last_completed_step:.*$', 'last_completed_step: "SCHOOL-NEXT-8"', current, flags=re.M)
          current = re.sub(r'^last_result:.*$', 'last_result: "OK"', current, flags=re.M)
          current = re.sub(r'^updated_at_jst:.*$', f'updated_at_jst: "{now}"', current, flags=re.M)
          current = re.sub(r'^worker_changed:.*$', 'worker_changed: false', current, flags=re.M)
          current = re.sub(r'^supabase_changed:.*$', 'supabase_changed: false', current, flags=re.M)
          current = re.sub(r'^api_changed:.*$', 'api_changed: false', current, flags=re.M)
          current_path.write_text(current, encoding="utf-8")

          record_path = out / "school-next-8-change-record.yml"
          record = record_path.read_text(encoding="utf-8")
          record = record.replace('result: "PUBLIC_VERIFY_PENDING"', 'result: "OK"')
          record += (
              f'completed_at_jst: "{now}"\n'
              f'public_owner_url: "https://dpromstk2000-lab.github.io/dpro-school-line/owner.html"\n'
              f'public_member_url: "https://dpromstk2000-lab.github.io/dpro-school-line/member.html"\n'
              f'public_verify: "PASS"\n'
              f'current_step: "SCHOOL-NEXT-9"\n'
              f'last_completed_step: "SCHOOL-NEXT-8"\n'
              f'next_step: "SCHOOL-NEXT-9"\n'
          )
          record_path.write_text(record, encoding="utf-8")
          PY

          rm -f "${WORKFLOW_FILE}"

          stage_path(){
            local path="$1"
            if [ -e "${path}" ] || git ls-files --error-unmatch "${path}" >/dev/null 2>&1; then
              git add -A -- "${path}"
            fi
          }

          stage_path "${CURRENT_STEP_FILE}"
          stage_path "${STATE_DIR}/school-next-8-change-record.yml"
          stage_path "${WORKFLOW_FILE}"

          git commit -m "feat(school-next): complete NEXT-8 followup"
          git push origin main

          {
            echo "## SCHOOL-NEXT-8 完了"
            echo ""
            echo "- オーナーフォロー候補: PASS"
            echo "- 会員ページ次アクション: PASS"
            echo "- 自動LINE配信なし: PASS"
            echo "- 端末内確認済み表示: PASS"
            echo "- 公開owner/member: PASS"
            echo "- Worker変更: なし"
            echo "- Supabase変更: なし"
            echo "- API変更: なし"
            echo "- 次のSTEP: SCHOOL-NEXT-9"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 9. 失敗時ロールバック・R1台帳
        if: failure() && steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main || true

          CURRENT_AFTER="$(grep -E '^current_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs || true)"
          LAST_AFTER="$(grep -E '^last_completed_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs || true)"

          if [ "${CURRENT_AFTER}" = "SCHOOL-NEXT-9" ] && [ "${LAST_AFTER}" = "SCHOOL-NEXT-8" ]; then
            echo "::notice::NEXT-8は既に完了しています。台帳を書き戻さず終了します。"
            exit 0
          fi

          if [ -f "${RUNNER_TEMP}/owner-before-school-next-8.html" ]; then
            cp "${RUNNER_TEMP}/owner-before-school-next-8.html" owner.html
          fi
          if [ -f "${RUNNER_TEMP}/member-before-school-next-8.html" ]; then
            cp "${RUNNER_TEMP}/member-before-school-next-8.html" member.html
          fi
          if [ -f "${RUNNER_TEMP}/current-step-before-school-next-8.yml" ]; then
            cp "${RUNNER_TEMP}/current-step-before-school-next-8.yml" "${CURRENT_STEP_FILE}"
          fi

          rm -f "${STATE_DIR}/school-next-8-change-record.yml"

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          out = Path("dpro-next")
          out.mkdir(exist_ok=True)
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")

          current_path = out / "current-step.yml"
          current = current_path.read_text(encoding="utf-8")
          current = re.sub(r'^current_step:.*$', 'current_step: "SCHOOL-NEXT-8-R1_REQUIRED"', current, flags=re.M)
          current = re.sub(r'^last_completed_step:.*$', 'last_completed_step: "SCHOOL-NEXT-7"', current, flags=re.M)
          current = re.sub(r'^last_result:.*$', 'last_result: "NG"', current, flags=re.M)
          current = re.sub(r'^updated_at_jst:.*$', f'updated_at_jst: "{now}"', current, flags=re.M)
          current_path.write_text(current, encoding="utf-8")

          failure = f'''step: "SCHOOL-NEXT-8"
          result: "NG"
          checked_at_jst: "{now}"
          rollback: "owner.html・member.html・current-stepを変更前へ復元"
          worker_changed: false
          supabase_changed: false
          api_changed: false
          next_step: "SCHOOL-NEXT-8-R1_REQUIRED"
          '''
          failure = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in failure.splitlines()
          ) + "\n"
          (out / "school-next-8-failure-record.yml").write_text(failure, encoding="utf-8")
          PY

          stage_path(){
            local path="$1"
            if [ -e "${path}" ] || git ls-files --error-unmatch "${path}" >/dev/null 2>&1; then
              git add -A -- "${path}"
            fi
          }

          stage_path owner.html
          stage_path member.html
          stage_path "${CURRENT_STEP_FILE}"
          stage_path "${STATE_DIR}/school-next-8-change-record.yml"
          stage_path "${STATE_DIR}/school-next-8-failure-record.yml"
          stage_path "${STATE_DIR}/school-next-8-validation.json"

          if ! git diff --cached --quiet; then
            git commit -m "chore(school-next): rollback NEXT-8 and record failure"
            git push origin main
          fi
