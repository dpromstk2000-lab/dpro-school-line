name: "STEP SCHOOL-NEXT-8 | 次回案内・再来校・フォロー"
run-name: "SCHOOL-NEXT-8 followup by ${{ github.actor }}"

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/step-school-next-8-followup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: school-next-8-followup
  cancel-in-progress: false

env:
  STEP_NAME: SCHOOL-NEXT-8
  WORKFLOW_FILE: .github/workflows/step-school-next-8-followup.yml
  STATE_DIR: dpro-next
  CURRENT_STEP_FILE: dpro-next/current-step.yml
  OWNER_FILE: owner.html
  MEMBER_FILE: member.html
  EXPECTED_CURRENT_STEP: SCHOOL-NEXT-8
  DUPLICATE_COMPLETED_STEP: SCHOOL-NEXT-9
  NEXT_STEP: SCHOOL-NEXT-9
  BASELINE_TAG: backup-school-next-before-8-20260724
  OWNER_URL: https://dpromstk2000-lab.github.io/dpro-school-line/owner.html
  MEMBER_URL: https://dpromstk2000-lab.github.io/dpro-school-line/member.html
  API_BASE: https://dpro-school-line-api.dpromstk2000.workers.dev
  EXPECTED_WORKER_VERSION: STEP-SCHOOL-NEXT-1-R1-WORKER-SECURITY-20260723

jobs:
  followup:
    name: 次回案内・再来校・フォロー
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. リポジトリ取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 前STEP完了・重複実行防止・変更前保護
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "${GITHUB_REF_NAME}" = "main"
          test -f "${WORKFLOW_FILE}"
          test -f "${OWNER_FILE}"
          test -f "${MEMBER_FILE}"
          test -f config.js
          test -f "${CURRENT_STEP_FILE}"

          CURRENT_STEP="$(grep -E '^current_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs)"
          LAST_COMPLETED="$(grep -E '^last_completed_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs)"

          if [ "${CURRENT_STEP}" = "${DUPLICATE_COMPLETED_STEP}" ] \
            && [ "${LAST_COMPLETED}" = "${STEP_NAME}" ] \
            && grep -q 'STEP SCHOOL-NEXT-8 / owner.html' "${OWNER_FILE}" \
            && grep -q 'STEP SCHOOL-NEXT-8 / member.html' "${MEMBER_FILE}"; then
            echo "mode=duplicate" >> "${GITHUB_OUTPUT}"
            echo "::notice::SCHOOL-NEXT-8は完了済みです。再アップロードされたYMLだけを削除します。"
            exit 0
          fi

          if [ "${CURRENT_STEP}" != "${EXPECTED_CURRENT_STEP}" ]; then
            echo "::error::current_step=${CURRENT_STEP}, expected=${EXPECTED_CURRENT_STEP}"
            exit 1
          fi

          if [ "${LAST_COMPLETED}" != "SCHOOL-NEXT-7" ]; then
            echo "::error::前STEPが未完了です。last_completed_step=${LAST_COMPLETED}"
            exit 1
          fi

          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true); puts "YAML syntax OK"' "${WORKFLOW_FILE}"

          BEFORE_OWNER_SHA256="$(sha256sum "${OWNER_FILE}" | awk '{print $1}')"
          BEFORE_MEMBER_SHA256="$(sha256sum "${MEMBER_FILE}" | awk '{print $1}')"
          BEFORE_GIT_SHA="$(git rev-parse HEAD)"

          echo "mode=apply" >> "${GITHUB_OUTPUT}"
          echo "before_owner_sha256=${BEFORE_OWNER_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "before_member_sha256=${BEFORE_MEMBER_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "before_git_sha=${BEFORE_GIT_SHA}" >> "${GITHUB_OUTPUT}"

          cp "${OWNER_FILE}" "${RUNNER_TEMP}/owner-before-school-next-8.html"
          cp "${MEMBER_FILE}" "${RUNNER_TEMP}/member-before-school-next-8.html"
          cp "${CURRENT_STEP_FILE}" "${RUNNER_TEMP}/current-step-before-school-next-8.yml"

          if git rev-parse "refs/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            echo "::notice::既存バックアップタグを維持: ${BASELINE_TAG}"
          elif git ls-remote --exit-code --tags origin "refs/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${BASELINE_TAG}:refs/tags/${BASELINE_TAG}"
          else
            git tag -a "${BASELINE_TAG}" "${BEFORE_GIT_SHA}" -m "DPRO 学習塾 LINE / SCHOOL-NEXT-8 変更前正常版"
            git push origin "refs/tags/${BASELINE_TAG}"
          fi

      - name: 2B. 完了後に再アップロードされたYMLを整理
        if: steps.preflight.outputs.mode == 'duplicate'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "${WORKFLOW_FILE}"

          stage_path(){
            local path="$1"
            if [ -e "${path}" ] || git ls-files --error-unmatch "${path}" >/dev/null 2>&1; then
              git add -A -- "${path}"
            fi
          }

          stage_path "${WORKFLOW_FILE}"

          if git diff --cached --quiet; then
            echo "::notice::削除対象はありません。"
            exit 0
          fi

          git commit -m "chore(school-next): remove duplicate NEXT-8 workflow upload"
          git push origin main

      - name: 3. フォロー候補・会員次アクションを追加
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f"{label}の一致数が1ではありません: {count}")
              return updated

          def insert_before_match(text, pattern, addition, label, flags=0):
              match = re.search(pattern, text, flags)
              if not match:
                  raise RuntimeError(f"{label}の基準位置がありません")
              return text[:match.start()] + addition + text[match.start():]

          # ----------------------------------------------------------
          # owner.html
          # ----------------------------------------------------------
          owner_path = Path("owner.html")
          owner = owner_path.read_text(encoding="utf-8")
          owner_original = owner

          if "STEP SCHOOL-NEXT-8 / owner.html" not in owner:
              required_owner = [
                  '<div class="version">STEP SCHOOL-NEXT-5 / owner.html</div>',
                  '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-5 / owner.html</p>',
                  "const VERSION = 'STEP SCHOOL-NEXT-5';",
                  'id="tasksCard"',
                  'id="todayLessonsCard"',
                  'id="confirmationBoard"',
                  'id="messagePreview"',
                  'function getUnifiedItems(){',
                  'function renderAll(){',
                  'function renderTasks(){',
                  'function showMessage(obj){',
                  'async function copyText(text, message){',
                  'function bindEvents(){',
              ]
              missing = [marker for marker in required_owner if marker not in owner]
              if missing:
                  raise RuntimeError("owner現行マーカー不足: " + " / ".join(missing))

              owner = sub_once(
                  owner,
                  r'<div class="version">STEP SCHOOL-NEXT-5 / owner\.html</div>',
                  '<div class="version">STEP SCHOOL-NEXT-8 / owner.html</div>',
                  "ownerバージョン",
              )
              owner = sub_once(
                  owner,
                  r'<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-5 / owner\.html</p>',
                  '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-8 / owner.html</p>',
                  "ownerフッターバージョン",
              )
              owner = sub_once(
                  owner,
                  r"const VERSION = 'STEP SCHOOL-NEXT-5';",
                  "const VERSION = 'STEP SCHOOL-NEXT-8';",
                  "owner JavaScriptバージョン",
              )
              owner = sub_once(
                  owner,
                  r'(<span class="pill">電話予約</span>)',
                  r'\1\n          <span class="pill">次回フォロー</span>',
                  "ownerフォローピル",
              )

              owner_css = r'''
          /* SCHOOL-NEXT-8: 次回案内・再来校・フォロー */
          .followup-card{border-color:#c7d2fe;background:linear-gradient(135deg,rgba(238,242,255,.97),rgba(240,253,250,.97));}
          .followup-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px;}
          .followup-head-copy{color:#64748b;font-size:12px;font-weight:800;line-height:1.7;margin-top:5px;}
          .followup-count-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:13px;}
          .followup-count{border:1px solid #dbe5f2;border-top:4px solid #2563eb;border-radius:16px;background:#fff;padding:13px;text-align:left;box-shadow:none;color:#0f172a;}
          .followup-count[data-followup-filter="trial"]{border-top-color:#7c3aed;}
          .followup-count[data-followup-filter="absence"]{border-top-color:#f97316;}
          .followup-count[data-followup-filter="next"]{border-top-color:#10b981;}
          .followup-count.active{outline:3px solid rgba(37,99,235,.15);background:#eff6ff;}
          .followup-count strong{display:block;font-size:28px;line-height:1;margin-bottom:7px;}
          .followup-count b{display:block;font-size:13px;margin-bottom:4px;}
          .followup-count small{display:block;color:#64748b;font-size:11px;font-weight:800;line-height:1.5;}
          .followup-item{border-left:5px solid #2563eb;}
          .followup-item.trial{border-left-color:#7c3aed;}
          .followup-item.absence{border-left-color:#f97316;}
          .followup-item.next{border-left-color:#10b981;}
          .followup-reviewed{opacity:.68;background:#f8fafc;}
          .followup-summary{margin-top:12px;padding:11px 13px;border-radius:14px;background:#fff;border:1px solid #dbe5f2;color:#475569;font-size:12px;font-weight:820;line-height:1.7;}
          .followup-device-note{margin-top:12px;padding:10px 12px;border-radius:13px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px;font-weight:800;line-height:1.7;}
          @media(max-width:900px){.followup-count-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.followup-head{flex-direction:column;}}
          @media(max-width:560px){.followup-count-grid{grid-template-columns:1fr;}}

          '''
              owner = insert_before_match(
                  owner,
                  r'(?m)^[ \t]*@media\(max-width:1100px\)',
                  owner_css,
                  "owner NEXT-8 CSS",
              )

              followup_html = r'''
          <div class="card followup-card" id="followupCard">
          <div class="section-title"><span class="num">F</span><h2>次回案内・再来校フォロー</h2></div>
          <div class="followup-head">
            <div>
              <p class="hint" style="margin-bottom:0;">体験後、欠席・振替後、授業完了後の候補を既存データから整理します。自動配信は行わず、対象と文面を個別確認してLINEへコピーします。</p>
              <div class="followup-head-copy">初期表示は最大20件です。候補は体験後・欠席振替・次回授業確認に分類します。</div>
            </div>
            <button class="btn secondary small" id="followupShowReviewedBtn" type="button" aria-pressed="false">確認済みも表示</button>
          </div>
          <div class="followup-count-grid" id="followupFilterBar">
            <button class="followup-count active" type="button" data-followup-filter="all" aria-pressed="true">
              <strong id="followupAllCount">0</strong><b>すべて</b><small>現在のフォロー候補</small>
            </button>
            <button class="followup-count" type="button" data-followup-filter="trial" aria-pressed="false">
              <strong id="followupTrialCount">0</strong><b>体験後</b><small>感想・入会相談</small>
            </button>
            <button class="followup-count" type="button" data-followup-filter="absence" aria-pressed="false">
              <strong id="followupAbsenceCount">0</strong><b>欠席・振替後</b><small>振替・確定確認</small>
            </button>
            <button class="followup-count" type="button" data-followup-filter="next" aria-pressed="false">
              <strong id="followupNextCount">0</strong><b>次回授業</b><small>授業完了後の確認</small>
            </button>
          </div>
          <div class="list" id="followupList"></div>
          <div class="followup-summary" id="followupSummary">情報を更新すると、既存の受付・授業データからフォロー候補を表示します。</div>
          <div class="followup-device-note">「この端末で確認済み」は14日間だけ、このブラウザ上で候補を隠す補助機能です。教室全体の共有済み記録ではありません。</div>
          </div>

          '''
              owner = insert_before_match(
                  owner,
                  r'(?m)^[ \t]*<div class="card" id="todayLessonsCard">',
                  followup_html,
                  "ownerフォローHTML",
              )

              owner = sub_once(
                  owner,
                  r"(confirmationStage:\s*'all',\s*\n)(\s*dashboard:)",
                  r"\1        followupFilter: 'all',\n        followupShowReviewed: false,\n        followupMap: new Map(),\n\2",
                  "ownerフォローstate",
              )

              followup_functions = r'''
          function followupDateDistance(value){
          const ymd = String(value || '').slice(0,10);
          if(!ymd) return 0;
          const target = new Date(`${ymd}T00:00:00`);
          const today = new Date(`${todayYmd()}T00:00:00`);
          if(Number.isNaN(target.getTime())) return 0;
          return Math.round((target.getTime() - today.getTime()) / 86400000);
          }

          function followupTypeForItem(item){
          if(!item) return '';
          const status = String(item.status || '').toLowerCase();
          if(item.kind === 'request'){
          if(!boolDone(item.status)) return '';
          if(isTrialType(item.type)) return 'trial';
          if(isAbsenceType(item.type) || isMakeupType(item.type)) return 'absence';
          return '';
          }
          if(status.includes('欠席') || status.includes('absent')) return 'absence';
          if(boolDone(item.status) || status.includes('completed') || status.includes('finished')) return 'next';
          return '';
          }

          function followupTypeLabel(type){
          return {trial:'体験後フォロー',absence:'欠席・振替後フォロー',next:'次回授業確認'}[type] || 'フォロー';
          }

          function followupBadgeClass(type){
          return {trial:'purple',absence:'orange',next:'green'}[type] || 'blue';
          }

          function followupCandidateKey(candidate){
          return [
          candidate.type || '',
          normalizePhone(candidate.phone || ''),
          candidate.studentNo || '',
          candidate.studentName || '',
          String(candidate.date || '').slice(0,10)
          ].join('|');
          }

          function loadFollowupReviewed(){
          let data = {};
          try{ data = JSON.parse(localStorage.getItem('dpro_school_followup_reviewed_v1') || '{}') || {}; }catch(e){ data = {}; }
          const limit = Date.now() - 14 * 86400000;
          Object.keys(data).forEach((key) => {
          if(!Number.isFinite(Number(data[key])) || Number(data[key]) < limit) delete data[key];
          });
          localStorage.setItem('dpro_school_followup_reviewed_v1', JSON.stringify(data));
          return data;
          }

          function markFollowupReviewed(candidate){
          const data = loadFollowupReviewed();
          data[followupCandidateKey(candidate)] = Date.now();
          localStorage.setItem('dpro_school_followup_reviewed_v1', JSON.stringify(data));
          }

          function followupMessage(candidate){
          const guardian = candidate.guardianName || candidate.studentName || '保護者';
          const student = candidate.studentName || 'お子さま';
          if(candidate.type === 'trial'){
          return normalizeNewlines(`${guardian}様\n${state.config.shopName}です。\n\n先日は${student}さんの体験授業にお越しいただき、ありがとうございました。\n授業のご感想や、学習について気になる点はございませんか。\n\nご希望があれば、今後の通い方やコースについて個別にご案内いたします。`);
          }
          if(candidate.type === 'absence'){
          return normalizeNewlines(`${guardian}様\n${state.config.shopName}です。\n\n${student}さんの欠席・振替について確認のご連絡です。\n対象：${formatDateTime(candidate.date, candidate.time)}\n\n振替日時のご希望や、確定内容についてご不明な点がございましたら、このLINEへご返信ください。`);
          }
          return normalizeNewlines(`${guardian}様\n${state.config.shopName}です。\n\n${student}さんの授業後の確認です。\n直近授業：${formatDateTime(candidate.date, candidate.time)}\n\n次回授業の予定や、学習内容について確認したい点がございましたら、このLINEへご返信ください。`);
          }

          function makeFollowupCandidate(item){
          const type = followupTypeForItem(item);
          if(!type) return null;
          const distance = followupDateDistance(item.date);
          if(item.date && (distance > 14 || distance < -45)) return null;
          return {
          type,
          kind:item.kind,
          rawItem:item.rawItem,
          studentName:item.studentName || '',
          guardianName:item.guardianName || '',
          phone:item.phone || '',
          studentNo:item.studentNo || '',
          course:item.course || '',
          date:item.date || '',
          time:item.time || '',
          status:item.status || '',
          source:item.source || '',
          message:'',
          reviewed:false
          };
          }

          function demoFollowupCandidates(){
          const today = todayYmd();
          return [
          {type:'trial',kind:'request',studentName:'テスト 次郎',guardianName:'テスト 太郎',phone:'090-1111-2222',studentNo:'SCHOOL-DEMO-1001',course:'体験授業：小学生算数',date:addDays(today,-2),time:'17:00',status:'対応済み',source:'LINE体験予約'},
          {type:'absence',kind:'lesson',studentName:'テスト 太郎',guardianName:'テスト 保護者',phone:DEMO_PHONE,studentNo:DEMO_STUDENT_NO,course:'小学生算数',date:addDays(today,-1),time:'17:00',status:'欠席',source:'授業予定'},
          {type:'next',kind:'lesson',studentName:'テスト 花子',guardianName:'テスト 保護者',phone:'090-8888-0000',studentNo:'SCHOOL-DEMO-998',course:'英会話キッズ',date:today,time:'18:00',status:'完了',source:'授業予定'}
          ];
          }

          function buildFollowupCandidates(){
          let candidates = getUnifiedItems().map(makeFollowupCandidate).filter(Boolean);
          if(!candidates.length && state.usedFallback) candidates = demoFollowupCandidates();
          const reviewedMap = loadFollowupReviewed();
          const dedup = new Map();
          candidates.forEach((candidate) => {
          candidate.message = followupMessage(candidate);
          candidate.reviewed = Boolean(reviewedMap[followupCandidateKey(candidate)]);
          const key = [candidate.type, normalizePhone(candidate.phone), candidate.studentNo, candidate.studentName].join('|');
          const current = dedup.get(key);
          if(!current || String(candidate.date || '').localeCompare(String(current.date || '')) > 0) dedup.set(key, candidate);
          });
          const priority = {trial:3,absence:2,next:1};
          return [...dedup.values()].sort((a,b) => {
          const reviewedDiff = Number(a.reviewed) - Number(b.reviewed);
          if(reviewedDiff) return reviewedDiff;
          const typeDiff = (priority[b.type] || 0) - (priority[a.type] || 0);
          if(typeDiff) return typeDiff;
          return String(b.date || '').localeCompare(String(a.date || '')) || String(b.time || '').localeCompare(String(a.time || ''));
          });
          }

          function renderFollowupBoard(){
          const list = $('followupList');
          if(!list) return;
          const all = buildFollowupCandidates();
          const counts = {
          all:all.length,
          trial:all.filter((item) => item.type === 'trial').length,
          absence:all.filter((item) => item.type === 'absence').length,
          next:all.filter((item) => item.type === 'next').length
          };
          $('followupAllCount').textContent = String(counts.all);
          $('followupTrialCount').textContent = String(counts.trial);
          $('followupAbsenceCount').textContent = String(counts.absence);
          $('followupNextCount').textContent = String(counts.next);
          document.querySelectorAll('#followupFilterBar [data-followup-filter]').forEach((button) => {
          const active = button.dataset.followupFilter === state.followupFilter;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', active ? 'true' : 'false');
          });
          $('followupShowReviewedBtn').textContent = state.followupShowReviewed ? '確認済みを隠す' : '確認済みも表示';
          $('followupShowReviewedBtn').setAttribute('aria-pressed', state.followupShowReviewed ? 'true' : 'false');

          let filtered = all.filter((item) => state.followupFilter === 'all' || item.type === state.followupFilter);
          if(!state.followupShowReviewed) filtered = filtered.filter((item) => !item.reviewed);
          const visible = filtered.slice(0,20);
          state.followupMap = new Map();

          if(!visible.length){
          list.innerHTML = '<div class="empty">現在の表示条件に一致するフォロー候補はありません。</div>';
          } else {
          list.innerHTML = visible.map((candidate, index) => {
          const key = `followup-${index}`;
          state.followupMap.set(key, candidate);
          return `
          <div class="item followup-item ${candidate.type} ${candidate.reviewed ? 'followup-reviewed' : ''}">
          <div class="item-main">
          <div class="item-title">
          <span>${escapeHtml(followupTypeLabel(candidate.type))}</span>
          <span class="badge ${followupBadgeClass(candidate.type)}">${escapeHtml(followupTypeLabel(candidate.type))}</span>
          <span class="badge ${candidate.reviewed ? 'gray' : 'blue'}">${candidate.reviewed ? 'この端末で確認済み' : '個別確認'}</span>
          </div>
          <div class="item-meta">
          生徒：<b>${escapeHtml(candidate.studentName || '対象者確認中')}</b>　保護者：${escapeHtml(candidate.guardianName || '保護者確認中')}<br>
          対象：${escapeHtml(formatDateTime(candidate.date, candidate.time))}　${candidate.course ? `コース：${escapeHtml(candidate.course)}` : ''}<br>
          ${candidate.phone ? `電話：${escapeHtml(formatPhone(candidate.phone))}` : ''}${candidate.studentNo ? `　生徒番号：${escapeHtml(candidate.studentNo)}` : ''}
          </div>
          </div>
          <div class="item-actions">
          <button class="btn navy small" type="button" data-followup-action="show" data-followup-key="${key}">文面を見る</button>
          <button class="btn small" type="button" data-followup-action="copy" data-followup-key="${key}">文面コピー</button>
          ${candidate.phone && candidate.studentNo ? `<a class="btn secondary small" href="./member.html?phone=${encodeURIComponent(candidate.phone)}&student_no=${encodeURIComponent(candidate.studentNo)}&auto=1" target="_blank" rel="noopener">会員画面確認</a>` : ''}
          ${candidate.reviewed ? '' : `<button class="btn green small" type="button" data-followup-action="reviewed" data-followup-key="${key}">この端末で確認済み</button>`}
          </div>
          </div>`;
          }).join('');
          }
          const hiddenReviewed = all.filter((item) => item.reviewed).length;
