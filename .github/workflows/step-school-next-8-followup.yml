              script_errors = []
              for index, script in enumerate(ap.scripts, 1):
                  if not script.strip():
                      continue
                  temp = Path("dpro-next") / f".school-next-8-{name}-{index}.js"
                  temp.write_text(script, encoding="utf-8")
