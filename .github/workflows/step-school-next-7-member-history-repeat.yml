        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main || true

          CURRENT_AFTER="$(grep -E '^current_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs || true)"
          LAST_AFTER="$(grep -E '^last_completed_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs || true)"

          if [ "${CURRENT_AFTER}" = "SCHOOL-NEXT-8" ] && [ "${LAST_AFTER}" = "SCHOOL-NEXT-7" ]; then
            echo "::notice::NEXT-7は既に完了しています。台帳を書き戻さず終了します。"
            exit 0
          fi

          if [ -f "${RUNNER_TEMP}/member-before-school-next-7.html" ]; then
            cp "${RUNNER_TEMP}/member-before-school-next-7.html" member.html
          fi
          if [ -f "${RUNNER_TEMP}/index-before-school-next-7.html" ]; then
            cp "${RUNNER_TEMP}/index-before-school-next-7.html" index.html
          fi
          if [ -f "${RUNNER_TEMP}/current-step-before-school-next-7.yml" ]; then
            cp "${RUNNER_TEMP}/current-step-before-school-next-7.yml" "${CURRENT_STEP_FILE}"
          fi

          rm -f "${STATE_DIR}/school-next-7-change-record.yml"

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          out = Path("dpro-next")
          out.mkdir(exist_ok=True)
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")

          current_path = out / "current-step.yml"
          current = current_path.read_text(encoding="utf-8")
          current = re.sub(r'^current_step:.*$', 'current_step: "SCHOOL-NEXT-7-R1_REQUIRED"', current, flags=re.M)
          current = re.sub(r'^last_completed_step:.*$', 'last_completed_step: "SCHOOL-NEXT-6"', current, flags=re.M)
          current = re.sub(r'^last_result:.*$', 'last_result: "NG"', current, flags=re.M)
          current = re.sub(r'^updated_at_jst:.*$', f'updated_at_jst: "{now}"', current, flags=re.M)
          current_path.write_text(current, encoding="utf-8")

          failure = f'''step: "SCHOOL-NEXT-7"
          result: "NG"
          checked_at_jst: "{now}"
          rollback: "member.html・index.html・current-stepを変更前へ復元"
          worker_changed: false
          supabase_changed: false
          api_changed: false
          next_step: "SCHOOL-NEXT-7-R1_REQUIRED"
          '''
          failure = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in failure.splitlines()
          ) + "\n"
          (out / "school-next-7-failure-record.yml").write_text(failure, encoding="utf-8")
          PY

          stage_path(){
            local path="$1"
            if [ -e "${path}" ] || git ls-files --error-unmatch "${path}" >/dev/null 2>&1; then
              git add -A -- "${path}"
            fi
          }

          stage_path member.html
          stage_path index.html
          stage_path "${CURRENT_STEP_FILE}"
          stage_path "${STATE_DIR}/school-next-7-change-record.yml"
          stage_path "${STATE_DIR}/school-next-7-failure-record.yml"
          stage_path "${STATE_DIR}/school-next-7-validation.json"

          if ! git diff --cached --quiet; then
            git commit -m "chore(school-next): rollback NEXT-7 and record failure"
            git push origin main
          fi
