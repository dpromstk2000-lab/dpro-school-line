name: "STEP SCHOOL-NEXT-7 | LINE会員履歴・前回と同じ"
run-name: "SCHOOL-NEXT-7 member history repeat by ${{ github.actor }}"

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/step-school-next-7-member-history-repeat.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: school-next-7-member-history-repeat
  cancel-in-progress: false

env:
  STEP_NAME: SCHOOL-NEXT-7
  WORKFLOW_FILE: .github/workflows/step-school-next-7-member-history-repeat.yml
  STATE_DIR: dpro-next
  CURRENT_STEP_FILE: dpro-next/current-step.yml
  MEMBER_FILE: member.html
  INDEX_FILE: index.html
  EXPECTED_CURRENT_STEP: SCHOOL-NEXT-7
  DUPLICATE_COMPLETED_STEP: SCHOOL-NEXT-8
  NEXT_STEP: SCHOOL-NEXT-8
  BASELINE_TAG: backup-school-next-before-7-20260724
  MEMBER_URL: https://dpromstk2000-lab.github.io/dpro-school-line/member.html
  INDEX_URL: https://dpromstk2000-lab.github.io/dpro-school-line/index.html
  API_BASE: https://dpro-school-line-api.dpromstk2000.workers.dev
  EXPECTED_WORKER_VERSION: STEP-SCHOOL-NEXT-1-R1-WORKER-SECURITY-20260723

jobs:
  member-history-repeat:
    name: LINE会員履歴・前回と同じ
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. リポジトリ取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 前STEP完了・重複実行防止・変更前保護
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "${GITHUB_REF_NAME}" = "main"
          test -f "${WORKFLOW_FILE}"
          test -f "${MEMBER_FILE}"
          test -f "${INDEX_FILE}"
          test -f config.js
          test -f "${CURRENT_STEP_FILE}"

          CURRENT_STEP="$(grep -E '^current_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs)"
          LAST_COMPLETED="$(grep -E '^last_completed_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs)"

          if [ "${CURRENT_STEP}" = "${DUPLICATE_COMPLETED_STEP}" ] \
            && [ "${LAST_COMPLETED}" = "${STEP_NAME}" ] \
            && grep -q 'STEP SCHOOL-NEXT-7 / member.html' "${MEMBER_FILE}" \
            && grep -q 'STEP SCHOOL-NEXT-7 / index.html' "${INDEX_FILE}"; then
            echo "mode=duplicate" >> "${GITHUB_OUTPUT}"
            echo "::notice::SCHOOL-NEXT-7は完了済みです。再アップロードされたYMLだけを削除します。"
            exit 0
          fi

          if [ "${CURRENT_STEP}" != "${EXPECTED_CURRENT_STEP}" ]; then
            echo "::error::current_step=${CURRENT_STEP}, expected=${EXPECTED_CURRENT_STEP}"
            exit 1
          fi

          if [ "${LAST_COMPLETED}" != "SCHOOL-NEXT-6" ]; then
            echo "::error::前STEPが未完了です。last_completed_step=${LAST_COMPLETED}"
            exit 1
          fi

          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true); puts "YAML syntax OK"' "${WORKFLOW_FILE}"

          BEFORE_MEMBER_SHA256="$(sha256sum "${MEMBER_FILE}" | awk '{print $1}')"
          BEFORE_INDEX_SHA256="$(sha256sum "${INDEX_FILE}" | awk '{print $1}')"
          BEFORE_GIT_SHA="$(git rev-parse HEAD)"

          echo "mode=apply" >> "${GITHUB_OUTPUT}"
          echo "before_member_sha256=${BEFORE_MEMBER_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "before_index_sha256=${BEFORE_INDEX_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "before_git_sha=${BEFORE_GIT_SHA}" >> "${GITHUB_OUTPUT}"

          cp "${MEMBER_FILE}" "${RUNNER_TEMP}/member-before-school-next-7.html"
          cp "${INDEX_FILE}" "${RUNNER_TEMP}/index-before-school-next-7.html"
          cp "${CURRENT_STEP_FILE}" "${RUNNER_TEMP}/current-step-before-school-next-7.yml"

          if git rev-parse "refs/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            echo "::notice::既存バックアップタグを維持: ${BASELINE_TAG}"
          elif git ls-remote --exit-code --tags origin "refs/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${BASELINE_TAG}:refs/tags/${BASELINE_TAG}"
          else
            git tag -a "${BASELINE_TAG}" "${BEFORE_GIT_SHA}" -m "DPRO 学習塾 LINE / SCHOOL-NEXT-7 変更前正常版"
            git push origin "refs/tags/${BASELINE_TAG}"
          fi

      - name: 2B. 完了後に再アップロードされたYMLを整理
        if: steps.preflight.outputs.mode == 'duplicate'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "${WORKFLOW_FILE}"

          stage_path(){
            local path="$1"
            if [ -e "${path}" ] || git ls-files --error-unmatch "${path}" >/dev/null 2>&1; then
              git add -A -- "${path}"
            fi
          }

          stage_path "${WORKFLOW_FILE}"

          if git diff --cached --quiet; then
            echo "::notice::削除対象はありません。"
            exit 0
          fi

          git commit -m "chore(school-next): remove duplicate NEXT-7 workflow upload"
          git push origin main

      - name: 3. 会員履歴・前回と同じ・入力引継ぎを追加
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f"{label}の一致数が1ではありません: {count}")
              return updated

          def insert_before_match(text, pattern, addition, label, flags=0):
              match = re.search(pattern, text, flags)
              if not match:
                  raise RuntimeError(f"{label}の基準位置がありません")
              return text[:match.start()] + addition + text[match.start():]

          # ----------------------------------------------------------
          # member.html
          # ----------------------------------------------------------
          member_path = Path("member.html")
          member = member_path.read_text(encoding="utf-8")
          member_original = member

          if "STEP SCHOOL-NEXT-7 / member.html" not in member:
              required_member = [
                  '<div class="version">STEP SCHOOL-NEXT-6 / member.html</div>',
                  '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-6 / member.html</p>',
                  'const VERSION = "STEP SCHOOL-NEXT-6";',
                  '<span class="num">5</span><h2>欠席・振替依頼状況</h2>',
                  'id="requestList"',
                  'function renderAll() {',
                  'function renderRequests(requests) {',
                  'function renderSiblings(siblings) {',
                  'function openIndex(mode) {',
                  'function bindEvents() {',
              ]
              missing = [marker for marker in required_member if marker not in member]
              if missing:
                  raise RuntimeError("member現行マーカー不足: " + " / ".join(missing))

              member = sub_once(
                  member,
                  r'<div class="version">STEP SCHOOL-NEXT-6 / member\.html</div>',
                  '<div class="version">STEP SCHOOL-NEXT-7 / member.html</div>',
                  "memberバージョン",
              )
              member = sub_once(
                  member,
                  r'<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-6 / member\.html</p>',
                  '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-7 / member.html</p>',
                  "memberフッターバージョン",
              )
              member = sub_once(
                  member,
                  r'const VERSION = "STEP SCHOOL-NEXT-6";',
                  'const VERSION = "STEP SCHOOL-NEXT-7";',
                  "member JavaScriptバージョン",
              )

              member_css = r'''
          /* SCHOOL-NEXT-7: 利用履歴・前回と同じ */
          .history-card{border-color:#bfdbfe;background:linear-gradient(135deg,rgba(239,246,255,.96),rgba(240,253,250,.96));}
          .history-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:14px;}
          .history-kpi{background:#fff;border:1px solid #dbe5f2;border-radius:16px;padding:13px;}
          .history-kpi strong{display:block;font-size:27px;line-height:1;font-weight:950;margin-bottom:7px;}
          .history-kpi span{display:block;color:#64748b;font-size:11px;font-weight:800;line-height:1.5;}
          .history-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px;}
          .history-filter button{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:999px;padding:9px 13px;font-weight:900;}
          .history-filter button.active{background:#0f172a;color:#fff;border-color:#0f172a;}
          .history-item{background:#fff;border:1px solid #dbe5f2;border-radius:17px;padding:15px;margin-bottom:10px;}
          .history-item:last-child{margin-bottom:0;}
          .history-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
          .history-title{font-size:15px;font-weight:950;line-height:1.5;}
          .history-meta{color:#64748b;font-size:12px;font-weight:750;line-height:1.7;margin-top:4px;}
          .history-note{margin-top:9px;padding:9px 11px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;color:#475569;font-size:12px;font-weight:760;line-height:1.65;}
          .history-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;}
          .repeat-safety{margin-top:12px;padding:10px 12px;border-radius:13px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px;font-weight:800;line-height:1.7;}
          @media(max-width:700px){.history-summary{grid-template-columns:1fr;}.history-head{flex-direction:column;}}

          '''
              member = insert_before_match(
                  member,
                  r'(?m)^[ \t]*\.student-card \{',
                  member_css,
                  "member NEXT-7 CSS",
              )

              history_html = r'''
          <div class="card history-card" id="historySection">
          <div class="section-title"><span class="num">6</span><h2>利用履歴・前回と同じ</h2></div>
          <p class="hint">教室から取得した最近の授業・連絡履歴を最大12件表示します。欠席・振替は、前回の時間と連絡内容を引き継げます。</p>
          <div class="history-summary">
            <div class="history-kpi"><strong id="historyLessonCount">0</strong><span>完了・過去の授業</span></div>
            <div class="history-kpi"><strong id="historyRequestCount">0</strong><span>欠席・振替・体験連絡</span></div>
            <div class="history-kpi"><strong id="historyRepeatCount">0</strong><span>前回と同じを使える連絡</span></div>
          </div>
          <div class="history-filter" id="historyFilterBar">
            <button class="active" type="button" data-history-filter="all" aria-pressed="true">すべて</button>
            <button type="button" data-history-filter="lesson" aria-pressed="false">授業</button>
            <button type="button" data-history-filter="request" aria-pressed="false">連絡</button>
          </div>
          <div class="list" id="historyList"></div>
          <div class="repeat-safety">「前回と同じ」では、生徒・保護者情報、時間、連絡内容だけを反映します。日付は誤送信防止のためコピーせず、新しく選び直します。</div>
          </div>

          '''
              member = sub_once(
                  member,
                  r'(<div class="card">\s*'
                  r'<div class="section-title"><span class="num">5</span><h2>欠席・振替依頼状況</h2></div>\s*'
                  r'<div class="list" id="requestList"></div>\s*'
                  r'</div>)(\s*</section>)',
                  r'\1\n' + history_html + r'\2',
                  "member履歴HTML",
                  re.S,
              )

              member = sub_once(
                  member,
                  r"(usedFallback:\s*false,\s*\n\s*lastMessage:\s*''\s*)",
                  r"\1,\n        historyFilter: 'all',\n        repeatMap: new Map()",
                  "member履歴state",
              )

              member = sub_once(
                  member,
                  r'(renderRequests\(p\.requests \|\| \[\]\);\s*\n)(\s*renderSiblings)',
                  r'\1        renderHistory(p);\n\2',
                  "member履歴描画",
              )

              history_functions = r'''
          function isLessonHistory(lesson) {
          const status = String(lesson && lesson.status || '').toLowerCase();
          if (['完了','done','completed','欠席','absence','取消','cancel'].some((value) => status.includes(value))) return true;
          const date = String(lesson && lesson.date || '').slice(0, 10);
          return Boolean(date && date < todayYmd());
          }

          function repeatModeForRequest(request) {
          const type = String(request && request.type || '').toLowerCase();
          if (type.includes('absence') || type.includes('欠席')) return 'absence';
          if (type.includes('makeup') || type.includes('振替')) return 'makeup';
          return '';
          }

          function historySortKey(item) {
          return `${String(item.date || '').slice(0, 10)}T${formatTime(item.time || '00:00')}`;
          }

          function buildHistoryItems(profile) {
          const lessons = (profile.lessons || [])
          .filter(isLessonHistory)
          .map((lesson) => ({
            kind: 'lesson',
            id: `lesson:${lesson.id}`,
            date: lesson.date,
            time: lesson.time,
            title: lesson.course || '授業',
            status: lesson.status || '完了',
            meta: `担当：${lesson.teacher || '担当未定'}${lesson.room ? ' / ' + lesson.room : ''}`,
            note: lesson.memo || ''
          }));
          const requests = (profile.requests || []).map((request) => ({
          kind: 'request',
          id: `request:${request.id}`,
          date: request.date,
          time: request.time,
          title: request.typeLabel || requestTypeLabel(request.type),
          status: request.status || '受付済み',
          meta: request.message || '内容未入力',
          note: memberRequestGuide(request.status),
          raw: request
          }));
          return lessons.concat(requests).sort((a, b) => historySortKey(b).localeCompare(historySortKey(a)));
          }

          function renderHistory(profile) {
          const allItems = buildHistoryItems(profile);
          const lessonCount = allItems.filter((item) => item.kind === 'lesson').length;
          const requestCount = allItems.filter((item) => item.kind === 'request').length;
          const repeatCount = allItems.filter((item) => item.kind === 'request' && repeatModeForRequest(item.raw)).length;
          $('historyLessonCount').textContent = String(lessonCount);
          $('historyRequestCount').textContent = String(requestCount);
          $('historyRepeatCount').textContent = String(repeatCount);

          document.querySelectorAll('#historyFilterBar [data-history-filter]').forEach((button) => {
          const active = button.dataset.historyFilter === state.historyFilter;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', active ? 'true' : 'false');
          });

          const filtered = allItems
          .filter((item) => state.historyFilter === 'all' || item.kind === state.historyFilter)
          .slice(0, 12);
          state.repeatMap = new Map();

          if (!filtered.length) {
          $('historyList').innerHTML = '<div class="empty">表示できる履歴はまだありません。</div>';
          return;
          }

          $('historyList').innerHTML = filtered.map((item, index) => {
          const repeatMode = item.kind === 'request' ? repeatModeForRequest(item.raw) : '';
          const repeatKey = repeatMode ? `repeat-${index}` : '';
          if (repeatKey) state.repeatMap.set(repeatKey, item.raw);
          const typeBadge = item.kind === 'lesson'
            ? '<span class="badge green">授業</span>'
            : '<span class="badge orange">連絡</span>';
          const statusBadge = item.kind === 'lesson'
            ? lessonStatusBadge(item.status)
            : requestBadge(item.status);
          return `
            <div class="history-item">
              <div class="history-head">
                <div>
                  <div class="history-title">${escapeHtml(item.title)}：${escapeHtml(formatDate(item.date))} ${escapeHtml(formatTime(item.time))}</div>
                  <div class="history-meta">${escapeHtml(item.meta || '')}</div>
                </div>
                <div>${typeBadge} ${statusBadge}</div>
              </div>
              ${item.note ? `<div class="history-note">${escapeHtml(item.note)}</div>` : ''}
              ${repeatKey ? `<div class="history-actions"><button class="btn small" type="button" data-repeat-request-key="${repeatKey}">前回と同じ内容で連絡</button></div>` : ''}
            </div>
          `;
          }).join('');
          }

          function openRepeatRequest(request) {
          const mode = repeatModeForRequest(request);
          if (!mode) {
          showToast('この履歴は前回と同じ機能の対象外です');
          return;
          }
          const profile = state.profile || makeDemoProfile($('phoneInput').value, $('studentNoInput').value);
          const params = new URLSearchParams();
          params.set('mode', mode);
          params.set('repeat', '1');
          params.set('phone', profile.guardian.phone || $('phoneInput').value.trim());
          params.set('student_no', profile.student.no || $('studentNoInput').value.trim());
          params.set('student_name', profile.student.name || '');
          params.set('guardian_name', profile.guardian.name || '');
          params.set('previous_date', String(request.date || '').slice(0, 10));
          params.set('previous_time', formatTime(request.time || ''));
          params.set('previous_text', String(request.message || '').slice(0, 500));
          params.set('previous_type', mode);
          window.location.href = `${state.config.pagesBaseUrl}index.html?${params.toString()}`;
          }

          '''
              member = insert_before_match(
                  member,
                  r'(?m)^[ \t]*function renderSiblings\(siblings\) \{',
                  history_functions,
                  "member履歴関数",
              )

              member_events = r'''
          $('historyFilterBar').addEventListener('click', (event) => {
          const button = event.target.closest('[data-history-filter]');
          if (!button) return;
          state.historyFilter = button.dataset.historyFilter || 'all';
          renderHistory(state.profile || makeDemoProfile($('phoneInput').value, $('studentNoInput').value));
          });
          $('historyList').addEventListener('click', (event) => {
          const button = event.target.closest('[data-repeat-request-key]');
          if (!button) return;
          const request = state.repeatMap.get(button.dataset.repeatRequestKey);
          if (request) openRepeatRequest(request);
          });
          '''
              member = sub_once(
                  member,
                  r'(function bindEvents\(\) \{\s*)',
                  r'\1' + member_events,
                  "member履歴イベント",
                  re.S,
              )

              member = sub_once(
                  member,
                  r'(<li>必要なら欠席連絡・振替希望へ進む</li>\s*)'
                  r'(<li>確認文面をLINEでコピー</li>)',
                  r'\1<li>履歴から「前回と同じ」を選ぶ</li>\n              \2',
                  "member確認フロー",
                  re.S,
              )

              if member == member_original:
                  raise RuntimeError("member.htmlに変更がありません")
              member_path.write_text(member, encoding="utf-8", newline="\n")

          # ----------------------------------------------------------
          # index.html
          # ----------------------------------------------------------
          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index_original = index

          if "STEP SCHOOL-NEXT-7 / index.html" not in index:
              required_index = [
                  '<div class="badge">STEP SCHOOL-6-R2 / index.html</div>',
                  'version: "STEP SCHOOL-6-R2"',
                  'id="absencePhone"',
                  'id="absenceStudentNo"',
                  'id="absenceStudentName"',
                  'id="absenceGuardianName"',
                  'id="absenceDate"',
                  'id="absenceTime"',
                  'id="absenceText"',
                  'id="makeupPhone"',
                  'id="makeupStudentNo"',
                  'id="makeupStudentName"',
                  'id="makeupGuardianName"',
                  'id="makeupDate"',
                  'id="makeupTime"',
                  'id="makeupText"',
                  'function setMode(mode){',
                  'async function init(){',
                  'fillTimeSelect("absenceTime", "17:00");',
                  'fillTimeSelect("makeupTime", "17:00");',
              ]
              missing = [marker for marker in required_index if marker not in index]
              if missing:
                  raise RuntimeError("index現行マーカー不足: " + " / ".join(missing))

              index = sub_once(
                  index,
                  r'<div class="badge">STEP SCHOOL-6-R2 / index\.html</div>',
                  '<div class="badge">STEP SCHOOL-NEXT-7 / index.html</div>',
                  "indexバージョン",
              )
              index = sub_once(
                  index,
                  r'version: "STEP SCHOOL-6-R2"',
                  'version: "STEP SCHOOL-NEXT-7"',
                  "index設定バージョン",
              )

              index_css = r'''
          /* SCHOOL-NEXT-7: 前回と同じ入力引継ぎ */
          .repeat-notice{display:none;margin-bottom:18px;padding:15px 16px;border:1px solid #fed7aa;border-radius:18px;background:linear-gradient(135deg,#fff7ed,#fffbeb);color:#9a3412;box-shadow:0 12px 28px rgba(154,52,18,.08);}
          .repeat-notice.show{display:block;}
          .repeat-notice strong{display:block;font-size:16px;margin-bottom:5px;}
          .repeat-notice span{display:block;font-size:12px;font-weight:800;line-height:1.75;}
          .repeat-date-required{border-color:#f97316 !important;box-shadow:0 0 0 4px rgba(249,115,22,.12) !important;}

          '''
              index = insert_before_match(
                  index,
                  r'(?m)^[ \t]*\.toast\.show\{',
                  index_css,
                  "index NEXT-7 CSS",
              )

              repeat_html = r'''
          <section class="repeat-notice" id="repeatNotice" aria-live="polite">
          <strong>前回の内容を反映しました</strong>
          <span id="repeatNoticeText">生徒・保護者情報、時間、連絡内容を反映しています。日付は安全のためコピーしていません。新しい日付を選んでから送信してください。</span>
          </section>

          '''
              index = insert_before_match(
                  index,
                  r'(?m)^[ \t]*<section class="card modeBlock" id="trialBlock">',
                  repeat_html,
                  "index前回内容通知",
              )

              index = sub_once(
                  index,
                  r'(lastMessage:\s*""\s*)',
                  r'\1,\n    entryFromMember: false,\n    repeatApplied: false',
                  "index引継ぎstate",
              )

              entry_functions = r'''
          function safeEntryParam(params, name, maxLength){
          return clean(params.get(name) || '').slice(0, Number(maxLength || 200));
          }

          function setSelectValueIfExists(id, value){
          const select = $(id);
          if (!select || !value) return;
          const normalized = hhmm(value);
          if ([...select.options].some((option) => option.value === normalized)) {
          select.value = normalized;
          }
          }

          function applyMemberEntryParams(){
          const params = new URLSearchParams(location.search);
          const requestedMode = safeEntryParam(params, 'mode', 20);
          const mode = ['trial','absence','makeup'].includes(requestedMode) ? requestedMode : '';
          const phone = safeEntryParam(params, 'phone', 40);
          const studentNo = safeEntryParam(params, 'student_no', 80);
          const studentName = safeEntryParam(params, 'student_name', 100);
          const guardianName = safeEntryParam(params, 'guardian_name', 100);
          const repeat = params.get('repeat') === '1' && ['absence','makeup'].includes(mode);

          if (!mode && !phone && !studentNo && !studentName && !guardianName) return false;
          state.entryFromMember = true;
          if (mode) setMode(mode);

          if (mode === 'absence') {
          $('absencePhone').value = phone;
          $('absenceStudentNo').value = studentNo;
          $('absenceStudentName').value = studentName;
          $('absenceGuardianName').value = guardianName;
          } else if (mode === 'makeup') {
          $('makeupPhone').value = phone;
          $('makeupStudentNo').value = studentNo;
          $('makeupStudentName').value = studentName;
          $('makeupGuardianName').value = guardianName;
          } else {
          $('phone').value = phone;
          $('studentName').value = studentName;
          $('guardianName').value = guardianName;
          }

          if (repeat) {
          const prefix = mode === 'absence' ? 'absence' : 'makeup';
          const previousDate = safeEntryParam(params, 'previous_date', 20);
          const previousTime = safeEntryParam(params, 'previous_time', 20);
          const previousText = safeEntryParam(params, 'previous_text', 500);
          $(prefix + 'Date').value = '';
          $(prefix + 'Date').classList.add('repeat-date-required');
          setSelectValueIfExists(prefix + 'Time', previousTime);
          $(prefix + 'Text').value = previousText;
          state.repeatApplied = true;
          $('repeatNotice').classList.add('show');
          $('repeatNoticeText').textContent = `前回（${previousDate || '日付不明'}）の時間と連絡内容を反映しました。日付はコピーしていません。新しい日付を必ず選んでください。`;
          showToast('前回の内容を反映しました。日付を選び直してください');
          }

          updateSummary();
          setTimeout(() => {
          const targetId = mode === 'absence' ? 'absenceBlock' : mode === 'makeup' ? 'makeupBlock' : 'trialBlock';
          scrollToId(targetId);
          }, 120);
          return true;
          }

          '''
              index = insert_before_match(
                  index,
                  r'(?m)^[ \t]*function setMode\(mode\)\{',
                  entry_functions,
                  "index引継ぎ関数",
              )

              index = sub_once(
                  index,
                  r'(\$\("trialDate"\)\.addEventListener\("change", \(\) => \{)',
                  r'$("absenceDate").addEventListener("change", () => $("absenceDate").classList.remove("repeat-date-required"));\n'
                  r'    $("makeupDate").addEventListener("change", () => $("makeupDate").classList.remove("repeat-date-required"));\n\n'
                  r'    \1',
                  "index日付注意解除",
              )

              index = sub_once(
                  index,
                  r'(fillTimeSelect\("makeupTime", "17:00"\);\s*\n)'
                  r'(\s*updateDateLabel\(\);)',
                  r'\1    applyMemberEntryParams();\n\2',
                  "index初期引継ぎ",
              )

              index = sub_once(
                  index,
                  r'''try \{
          \s*await loadConfig\(\);
          \s*const first = await loadSlots\(\);
          \s*if \(!first \|\| !first\.is_available \|\| !state\.slots\.length\) \{
          \s*await findOpenDay\(\{ auto:true \}\);
          \s*\}
          \s*\} catch \(e\) \{''',
                  '''try {
          await loadConfig();
          if (state.mode === "trial") {
          const first = await loadSlots();
          if (!first || !first.is_available || !state.slots.length) {
          await findOpenDay({ auto:true });
          }
          }
          } catch (e) {''',
                  "index非体験時の不要枠取得防止",
                  re.S,
              )

              if index == index_original:
                  raise RuntimeError("index.htmlに変更がありません")
              index_path.write_text(index, encoding="utf-8", newline="\n")

          print("SCHOOL-NEXT-7 patch complete")
          PY

      - name: 4. HTML・JavaScript・ID・履歴・前回入力検査
        if: steps.preflight.outputs.mode == 'apply'
        id: validate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${STATE_DIR}"

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from datetime import datetime, timezone, timedelta
          import hashlib
          import json
          import os
          import re
          import subprocess

          files = {
              "member": {
                  "before": Path(os.environ["RUNNER_TEMP"]) / "member-before-school-next-7.html",
                  "after": Path("member.html"),
              },
              "index": {
                  "before": Path(os.environ["RUNNER_TEMP"]) / "index-before-school-next-7.html",
                  "after": Path("index.html"),
              },
          }
          results = []

          def add(key, label, status, detail, blocking=False):
              results.append({
                  "key": key,
                  "label": label,
                  "status": status,
                  "detail": detail,
                  "blocking": bool(blocking and status == "NG"),
              })

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
                  self.scripts = []
                  self.in_script = False
                  self.external = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if data.get("id"):
                      self.ids.append(data["id"])
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = bool(data.get("src"))
                      self.parts = []

              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external:
                          self.scripts.append("".join(self.parts))
                      self.in_script = False
                      self.external = False
                      self.parts = []

          payload_files = {}
          for name, paths in files.items():
              before_text = paths["before"].read_text(encoding="utf-8")
              after_text = paths["after"].read_text(encoding="utf-8")
              before_parser = Inspector()
              after_parser = Inspector()
              before_parser.feed(before_text)
              before_parser.close()
              after_parser.feed(after_text)
              after_parser.close()

              missing_ids = sorted(set(before_parser.ids) - set(after_parser.ids))
              duplicate_ids = sorted({
                  value for value in after_parser.ids
                  if after_parser.ids.count(value) > 1
              })
              add(
                  f"{name}_existing_ids",
                  f"{name}既存HTML ID維持",
                  "NG" if missing_ids else "OK",
                  "削除: " + ", ".join(missing_ids) if missing_ids else f"既存ID {len(set(before_parser.ids))}件を維持",
                  bool(missing_ids),
              )
              add(
                  f"{name}_duplicate_ids",
                  f"{name} HTML ID重複",
                  "NG" if duplicate_ids else "OK",
                  "重複: " + ", ".join(duplicate_ids) if duplicate_ids else f"ID {len(after_parser.ids)}件、重複なし",
                  bool(duplicate_ids),
              )

              script_errors = []
              for script_index, script in enumerate(after_parser.scripts, 1):
                  if not script.strip():
                      continue
                  temp = Path("dpro-next") / f".school-next-7-{name}-{script_index}.js"
                  temp.write_text(script, encoding="utf-8")
                  proc = subprocess.run(
                      ["node", "--check", str(temp)],
                      capture_output=True,
                      text=True,
                  )
                  temp.unlink(missing_ok=True)
                  if proc.returncode:
                      script_errors.append((proc.stderr or proc.stdout)[-1800:])
              add(
                  f"{name}_javascript",
                  f"{name} JavaScript構文",
                  "NG" if script_errors else "OK",
                  " / ".join(script_errors) if script_errors else f"インラインscript {len(after_parser.scripts)}件 PASS",
                  bool(script_errors),
              )

              api_pattern = re.compile(r'["\'](/api/[a-zA-Z0-9_./-]+)["\']')
              before_api = sorted(set(api_pattern.findall(before_text)))
              after_api = sorted(set(api_pattern.findall(after_text)))
              api_changed = before_api != after_api
              add(
                  f"{name}_api",
                  f"{name}既存API維持",
                  "NG" if api_changed else "OK",
                  f"before={before_api} / after={after_api}" if api_changed else f"既存API {len(after_api)}件、追加・削除なし",
                  api_changed,
              )

              before_fetch = before_text.count("fetch(")
              after_fetch = after_text.count("fetch(")
              fetch_changed = before_fetch != after_fetch
              add(
                  f"{name}_network",
                  f"{name}追加通信なし",
                  "NG" if fetch_changed else "OK",
                  f"before={before_fetch}, after={after_fetch}" if fetch_changed else f"fetch呼出数 {after_fetch}を維持",
                  fetch_changed,
              )

              payload_files[name] = {
                  "before_sha256": hashlib.sha256(paths["before"].read_bytes()).hexdigest(),
                  "after_sha256": hashlib.sha256(paths["after"].read_bytes()).hexdigest(),
                  "bytes": paths["after"].stat().st_size,
              }

          member_text = files["member"]["after"].read_text(encoding="utf-8")
          index_text = files["index"]["after"].read_text(encoding="utf-8")

          member_markers = [
              '<div class="version">STEP SCHOOL-NEXT-7 / member.html</div>',
              'const VERSION = "STEP SCHOOL-NEXT-7";',
              'id="historySection"',
              'id="historyLessonCount"',
              'id="historyRequestCount"',
              'id="historyRepeatCount"',
              'id="historyFilterBar"',
              'id="historyList"',
              'function buildHistoryItems(profile) {',
              'function renderHistory(profile) {',
              'function openRepeatRequest(request) {',
              "params.set('repeat', '1');",
              "String(request.message || '').slice(0, 500)",
              "日付は誤送信防止のためコピーせず",
          ]
          member_missing = [marker for marker in member_markers if marker not in member_text]
          add(
              "member_history",
              "会員履歴・前回と同じ",
              "NG" if member_missing else "OK",
              "不足: " + " / ".join(member_missing) if member_missing else f"必須マーカー {len(member_markers)}件",
              bool(member_missing),
          )

          index_markers = [
              '<div class="badge">STEP SCHOOL-NEXT-7 / index.html</div>',
              'version: "STEP SCHOOL-NEXT-7"',
              'id="repeatNotice"',
              'id="repeatNoticeText"',
              'function safeEntryParam(params, name, maxLength){',
              'function applyMemberEntryParams(){',
              "params.get('repeat') === '1'",
              "$(prefix + 'Date').value = '';",
              "classList.add('repeat-date-required')",
              'if (state.mode === "trial") {',
          ]
          index_missing = [marker for marker in index_markers if marker not in index_text]
          add(
              "index_repeat",
              "入力引継ぎ・日付安全ガード",
              "NG" if index_missing else "OK",
              "不足: " + " / ".join(index_missing) if index_missing else f"必須マーカー {len(index_markers)}件",
              bool(index_missing),
          )

          trial_repeat = (
              "repeatModeForRequest" in member_text
              and re.search(r"return 'trial'", member_text) is not None
          )
          add(
              "trial_repeat_guard",
              "体験予約の前回と同じ除外",
              "NG" if trial_repeat else "OK",
              "欠席・振替だけを対象" if not trial_repeat else "体験予約の繰返し処理を検出",
              trial_repeat,
          )

          auto_submit_markers = [
              "sendAbsence();",
              "sendMakeup();",
              "submitTrial();",
          ]
          entry_function = re.search(
              r'function applyMemberEntryParams\(\)\{.*?\n\s*\}',
              index_text,
              re.S,
          )
          auto_submit = False
          if entry_function:
              auto_submit = any(marker in entry_function.group(0) for marker in auto_submit_markers)
          add(
              "auto_submit_guard",
              "前回内容の自動送信防止",
              "NG" if auto_submit else "OK",
              "入力反映だけで送信しない" if not auto_submit else "自動送信処理を検出",
              auto_submit,
          )

          history_limit_ok = ".slice(0, 12)" in member_text
          add(
              "history_limit",
              "履歴初期表示上限",
              "OK" if history_limit_ok else "NG",
              "最大12件" if history_limit_ok else "12件上限がありません",
              not history_limit_ok,
          )

          changed = subprocess.run(
              ["git", "diff", "--name-only"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout.splitlines()
          unexpected_files = [
              name for name in changed
              if name not in ["member.html", "index.html"]
          ]
          add(
              "scope",
              "対象ファイル限定",
              "NG" if unexpected_files else "OK",
              "意図しない変更: " + ", ".join(unexpected_files) if unexpected_files else "本体変更はmember.html・index.htmlのみ",
              bool(unexpected_files),
          )

          add("worker", "Worker変更", "OK", "変更なし")
          add("supabase", "Supabase変更", "OK", "変更なし・SQL不要")
          add("history_storage", "新規履歴テーブル", "OK", "追加せず既存プロフィールデータを利用")
          add("automatic_line", "一括自動LINE配信", "OK", "追加なし")

          counts = {
              status: sum(1 for row in results if row["status"] == status)
              for status in ["OK", "注意", "NG"]
          }
          blocking = sum(1 for row in results if row["blocking"])
          payload = {
              "step": "SCHOOL-NEXT-7",
              "checked_at_jst": datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds"),
              "files": payload_files,
              "counts": counts,
              "blocking_ng": blocking,
              "results": results,
          }
          Path("dpro-next/school-next-7-validation.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"member_after_sha256={payload_files['member']['after_sha256']}\n")
              fh.write(f"index_after_sha256={payload_files['index']['after_sha256']}\n")
              fh.write(f"ok_count={counts['OK']}\n")
              fh.write(f"warning_count={counts['注意']}\n")
              fh.write(f"ng_count={counts['NG']}\n")

          if blocking:
              raise SystemExit(f"blocking NG: {blocking}")
          PY

