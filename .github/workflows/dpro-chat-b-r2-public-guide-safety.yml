name: DPRO CHAT B R2 SCHOOL Public Guide Safety

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository guard
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "dpromstk2000-lab/dpro-school-line"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimal R2 fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('guide-center.html'); s=p.read_text(encoding='utf-8')
          def rep(a,b):
              global s
              if a not in s: raise SystemExit('expected copy not found: '+a[:120])
              s=s.replace(a,b)
          repls=[
          ('<p class="eyebrow">DPRO TUTORIAL / SCHOOL / GUIDE CENTER / R4</p>','<p class="eyebrow">DPRO 学習塾・習い事 LINE / 操作ガイド</p>'),
          ('学習塾・習い事LINEのFirst10を、Start・Resume・Replayから安全に確認できます。Tutorialは表示案内だけを行い、予約・欠席・振替・管理操作を自動実行しません。','学習塾・習い事LINEの最初の10項目を、最初から・続きから・もう一度見る、の操作で安全に確認できます。ガイドは表示案内だけを行い、予約・欠席・振替・管理操作を自動実行しません。'),
          ('<div class="meta"><strong>STANDARD</strong><span>V1.1 LOCKED</span></div>','<div class="meta"><strong>操作ガイド</strong><span>安全な案内</span></div>'),
          ('<div class="meta"><strong>FIRST10</strong><span id="first10Meta">10 steps</span></div>','<div class="meta"><strong>最初の10項目</strong><span id="first10Meta">10項目</span></div>'),
          ('<div class="meta"><strong>BUSINESS MUTATION</strong><span>0 required</span></div>','<div class="meta"><strong>自動操作</strong><span>行いません</span></div>'),
          ('<h2 id="actionsTitle">Tutorialを開く</h2>','<h2 id="actionsTitle">操作ガイドを開く</h2>'),
          ('StartはStep 1から開始、Resumeは保存済みの続き、ReplayはTutorial状態だけをリセットしてStep 1から再開します。','最初から開始すると1番目から、続きから再開すると保存済みの位置から確認できます。もう一度見る場合も業務データは変更しません。'),
          ('data-guide-action="start" disabled>Start</button>','data-guide-action="start" disabled>最初から開始</button>'),
          ('data-guide-action="resume" disabled>Resume</button>','data-guide-action="resume" disabled>続きから再開</button>'),
          ('data-guide-action="replay" disabled>Replay</button>','data-guide-action="replay" disabled>もう一度見る</button>'),
          ('<div class="status-item"><small>保存キー</small><b id="guideStorage">Tutorial専用</b></div>','<div class="status-item"><small>進行情報</small><b id="guideStorage">操作ガイド専用</b></div>'),
          ('<div class="ready" id="guideReady" data-guide-ready="false">Tutorial runtimeを確認しています。</div>','<div class="ready" id="guideReady" data-guide-ready="false">操作ガイドを準備しています。</div>'),
          ('<h2 id="first10Title">First10</h2>','<h2 id="first10Title">最初の10項目</h2>'),
          ('Guide Centerの10項目はR3 runtimeのcanonical First10と1対1で照合されます。','操作ガイドの10項目を安全に確認します。'),
          ('<a class="link-btn" href="./owner.html">Owner PCへ戻る</a>','<a class="link-btn" href="./owner.html">オーナーPCへ戻る</a>'),
          ('<div class="foot">DPRO TUTORIAL / SCHOOL / GUIDE CENTER / R4 / business mutation 0</div>','<div class="foot">DPRO 学習塾・習い事 LINE / 操作ガイド</div>'),
          ("if(mode==='start')return '未開始 / Start可能';","if(mode==='start')return '未開始 / 開始できます';"),
          ("if(s.complete)return '完了 / Replay可能';","if(s.complete)return '完了 / もう一度確認できます';"),
          ("if(s.skipped)return 'スキップ / Replay可能';","if(s.skipped)return 'スキップ / もう一度確認できます';"),
          ("if(s.closed)return '中断 / Resume可能';","if(s.closed)return '中断 / 続きから再開できます';"),
          ("return '進行中 / Resume可能';","return '進行中 / 続きから再開できます';"),
          ("stepEl.textContent=s.currentStepKey||'school.first10.01';","const pos=(api.steps||[]).findIndex(x=>x.key===s.currentStepKey); stepEl.textContent=pos>=0?`${pos+1} / ${api.first10Count}`:'1 / 10';"),
          ('storageEl.textContent=api.stateKey();',"storageEl.textContent='操作ガイド専用';"),
          ('first10Meta.textContent=`${api.first10Count} steps`;', 'first10Meta.textContent=`${api.first10Count}項目`;'),
          ("ready.textContent=aligned?'Guide Centerはcanonical First10（10件）と一致しています。':'Guide CenterとTutorial runtimeのFirst10が一致しません。';","ready.textContent=aligned?'操作ガイドの10項目を確認しました。':'操作ガイドの項目を確認できませんでした。';"),
          ("ready.textContent='Tutorial runtimeを確認できませんでした。';","ready.textContent='操作ガイドを確認できませんでした。';")
          ]
          for a,b in repls: rep(a,b)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Static safety QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('guide-center.html').read_text(encoding='utf-8')
          for x in ['DPRO TUTORIAL / SCHOOL / GUIDE CENTER / R4','V1.1 LOCKED','BUSINESS MUTATION','Tutorialを開く','StartはStep 1','>Start</button>','>Resume</button>','>Replay</button>','R3 runtime','canonical First10','business mutation 0','Tutorial runtimeを確認']:
              assert x not in s, x
          for x in ['最初から開始','続きから再開','もう一度見る','オーナーPCへ戻る','操作ガイド専用','10項目']:
              assert x in s, x
          assert 'READY_MARKER' in s and 'DPRO_TUTORIAL_SCHOOL' in s and 'data-step-key="school.first10.01"' in s
          PY
          git diff --check

      - name: Commit forward-only fix
        shell: bash
        run: |
          git config user.name "DPRO CHAT B R2"
          git config user.email "actions@users.noreply.github.com"
          git rm ".github/workflows/dpro-chat-b-r2-public-guide-safety.yml"
          git add guide-center.html
          git commit -m "DPRO CHAT B R2: public guide and demo safety"
          git push
