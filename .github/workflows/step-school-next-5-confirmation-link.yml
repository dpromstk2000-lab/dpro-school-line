name: "STEP SCHOOL-NEXT-5 | 保護者確認・顧客連携"
run-name: "SCHOOL-NEXT-5 guardian confirmation by ${{ github.actor }}"

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/step-school-next-5-confirmation-link.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: school-next-5-confirmation-link
  cancel-in-progress: false

env:
  STEP_NAME: SCHOOL-NEXT-5
  WORKFLOW_FILE: .github/workflows/step-school-next-5-confirmation-link.yml
  STATE_DIR: dpro-next
  CURRENT_STEP_FILE: dpro-next/current-step.yml
  OWNER_FILE: owner.html
  MEMBER_FILE: member.html
  EXPECTED_CURRENT_STEP: SCHOOL-NEXT-5
  DUPLICATE_COMPLETED_STEP: SCHOOL-NEXT-6
  NEXT_STEP: SCHOOL-NEXT-6
  BASELINE_TAG: backup-school-next-before-5-20260724
  OWNER_URL: https://dpromstk2000-lab.github.io/dpro-school-line/owner.html
  MEMBER_URL: https://dpromstk2000-lab.github.io/dpro-school-line/member.html
  API_BASE: https://dpro-school-line-api.dpromstk2000.workers.dev
  EXPECTED_WORKER_VERSION: STEP-SCHOOL-NEXT-1-R1-WORKER-SECURITY-20260723

jobs:
  guardian-confirmation:
    name: 保護者確認・顧客連携
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. リポジトリ取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 前STEP完了・重複実行防止・変更前保護
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "${GITHUB_REF_NAME}" = "main"
          test -f "${WORKFLOW_FILE}"
          test -f "${OWNER_FILE}"
          test -f "${MEMBER_FILE}"
          test -f config.js
          test -f "${CURRENT_STEP_FILE}"

          CURRENT_STEP="$(grep -E '^current_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs)"
          LAST_COMPLETED="$(grep -E '^last_completed_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs)"

          if [ "${CURRENT_STEP}" = "${DUPLICATE_COMPLETED_STEP}" ] \
            && [ "${LAST_COMPLETED}" = "${STEP_NAME}" ] \
            && grep -q 'STEP SCHOOL-NEXT-5 / owner.html' "${OWNER_FILE}" \
            && grep -q 'STEP SCHOOL-NEXT-5 / member.html' "${MEMBER_FILE}"; then
            echo "mode=duplicate" >> "${GITHUB_OUTPUT}"
            echo "::notice::SCHOOL-NEXT-5は完了済みです。再アップロードされたYMLだけを削除します。"
            exit 0
          fi

          if [ "${CURRENT_STEP}" != "${EXPECTED_CURRENT_STEP}" ]; then
            echo "::error::current_step=${CURRENT_STEP}, expected=${EXPECTED_CURRENT_STEP}"
            exit 1
          fi

          if [ "${LAST_COMPLETED}" != "SCHOOL-NEXT-4" ]; then
            echo "::error::前STEPが未完了です。last_completed_step=${LAST_COMPLETED}"
            exit 1
          fi

          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true); puts "YAML syntax OK"' "${WORKFLOW_FILE}"

          BEFORE_OWNER_SHA256="$(sha256sum "${OWNER_FILE}" | awk '{print $1}')"
          BEFORE_MEMBER_SHA256="$(sha256sum "${MEMBER_FILE}" | awk '{print $1}')"
          BEFORE_GIT_SHA="$(git rev-parse HEAD)"

          echo "mode=apply" >> "${GITHUB_OUTPUT}"
          echo "before_owner_sha256=${BEFORE_OWNER_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "before_member_sha256=${BEFORE_MEMBER_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "before_git_sha=${BEFORE_GIT_SHA}" >> "${GITHUB_OUTPUT}"

          cp "${OWNER_FILE}" "${RUNNER_TEMP}/owner-before-school-next-5.html"
          cp "${MEMBER_FILE}" "${RUNNER_TEMP}/member-before-school-next-5.html"
          cp "${CURRENT_STEP_FILE}" "${RUNNER_TEMP}/current-step-before-school-next-5.yml"

          if git rev-parse "refs/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            echo "::notice::既存バックアップタグを維持: ${BASELINE_TAG}"
          elif git ls-remote --exit-code --tags origin "refs/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${BASELINE_TAG}:refs/tags/${BASELINE_TAG}"
          else
            git tag -a "${BASELINE_TAG}" "${BEFORE_GIT_SHA}" -m "DPRO 学習塾 LINE / SCHOOL-NEXT-5 変更前正常版"
            git push origin "refs/tags/${BASELINE_TAG}"
          fi

      - name: 2B. 完了後に再アップロードされたYMLを整理
        if: steps.preflight.outputs.mode == 'duplicate'
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "${WORKFLOW_FILE}"

          stage_path(){
            local path="$1"
            if [ -e "${path}" ] || git ls-files --error-unmatch "${path}" >/dev/null 2>&1; then
              git add -A -- "${path}"
            fi
          }

          stage_path "${WORKFLOW_FILE}"

          if git diff --cached --quiet; then
            echo "::notice::削除対象はありません。"
            exit 0
          fi

          git commit -m "chore(school-next): remove duplicate NEXT-5 workflow upload"
          git push origin main

      - name: 3. owner・memberへ確認連携機能を追加
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}の一致数が1ではありません: {count}")
              return source.replace(old, new, 1)

          def insert_before_once(source, marker, addition, label):
              count = source.count(marker)
              if count != 1:
                  raise RuntimeError(f"{label}の基準位置が1件ではありません: {count}")
              return source.replace(marker, addition + marker, 1)

          def insert_regex_once(source, pattern, addition, label):
              matches = list(re.finditer(pattern, source))
              if len(matches) != 1:
                  raise RuntimeError(f"{label}の基準位置が1件ではありません: {len(matches)}")
              pos = matches[0].start()
              return source[:pos] + addition + source[pos:]

          # ------------------------------------------------------------
          # owner.html
          # ------------------------------------------------------------
          owner_path = Path("owner.html")
          owner = owner_path.read_text(encoding="utf-8")
          owner_original = owner

          if "STEP SCHOOL-NEXT-5 / owner.html" not in owner:
              required_owner = [
                  '<div class="version">STEP SCHOOL-NEXT-4 / owner.html</div>',
                  '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-4 / owner.html</p>',
                  "const VERSION = 'STEP SCHOOL-NEXT-4';",
                  '<div class="progress-board" id="progressBoard">',
                  "        progressStage: 'all',",
                  "        renderProgressBoard();",
                  "function progressStageForItem(item){",
                  "function unifiedFilteredItems(){",
                  "function renderUnifiedReception(){",
                  "$('progressBoard').addEventListener('click', (e) => {",
                  "$('unifiedFilterBar').addEventListener('click', (e) => {",
                  '<li>進捗ボードで受付・授業の滞留を確認</li>',
              ]
              missing = [marker for marker in required_owner if marker not in owner]
              if missing:
                  raise RuntimeError("owner.htmlの現行マーカー不足: " + " / ".join(missing))

              owner = replace_once(
                  owner,
                  '<div class="version">STEP SCHOOL-NEXT-4 / owner.html</div>',
                  '<div class="version">STEP SCHOOL-NEXT-5 / owner.html</div>',
                  "owner画面バージョン",
              )
              owner = replace_once(
                  owner,
                  '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-4 / owner.html</p>',
                  '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-5 / owner.html</p>',
                  "ownerフッターバージョン",
              )
              owner = replace_once(
                  owner,
                  "const VERSION = 'STEP SCHOOL-NEXT-4';",
                  "const VERSION = 'STEP SCHOOL-NEXT-5';",
                  "owner JavaScriptバージョン",
              )

              owner_css = r'''
          /* SCHOOL-NEXT-5: 保護者確認・顧客連携 */
          .confirmation-board{margin:0 0 16px;padding:16px;border:1px solid #c7d2fe;border-radius:18px;background:linear-gradient(135deg,#eef2ff,#f0fdfa);}
          .confirmation-board-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:13px;}
          .confirmation-board-title{display:block;font-size:17px;font-weight:950;color:#0f172a;margin-bottom:4px;}
          .confirmation-board-copy{display:block;color:#64748b;font-size:12px;line-height:1.65;font-weight:750;}
          .confirmation-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;}
          .confirmation-stage{appearance:none;text-align:left;border:1px solid #dbe5f2;border-radius:15px;background:#fff;color:#0f172a;padding:12px;min-height:104px;box-shadow:none;transition:.15s ease;}
          .confirmation-stage:hover{transform:translateY(-1px);box-shadow:0 9px 20px rgba(15,23,42,.08);}
          .confirmation-stage.active{outline:3px solid rgba(79,70,229,.16);border-color:#818cf8;background:#eef2ff;}
          .confirmation-stage strong{display:block;font-size:28px;line-height:1;font-weight:950;letter-spacing:-.04em;margin-bottom:8px;}
          .confirmation-stage b{display:block;font-size:13px;line-height:1.4;margin-bottom:4px;}
          .confirmation-stage small{display:block;color:#64748b;font-size:11px;line-height:1.5;font-weight:750;}
          .confirmation-stage[data-confirmation-stage="pending_request"]{border-top:4px solid #f97316;}
          .confirmation-stage[data-confirmation-stage="lesson_notice"]{border-top:4px solid #2563eb;}
          .confirmation-stage[data-confirmation-stage="active"]{border-top:4px solid #7c3aed;}
          .confirmation-stage[data-confirmation-stage="completed"]{border-top:4px solid #10b981;}
          .confirmation-board-summary{margin-top:11px;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid #e2e8f0;color:#475569;font-size:12px;font-weight:850;line-height:1.65;}
          .confirmation-check{margin-top:10px;padding:9px 11px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;color:#475569;font-size:12px;font-weight:800;line-height:1.6;}
          @media(max-width:900px){.confirmation-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
          @media(max-width:560px){.confirmation-board-head{flex-direction:column;}.confirmation-board-head .btn{width:100%;}.confirmation-grid{grid-template-columns:1fr;}}

          '''
              owner = insert_regex_once(
                  owner,
                  r'(?m)^[ \t]*/\* SCHOOL-NEXT-4: 業務進捗・ステータス見える化 \*/',
                  owner_css,
                  "owner NEXT-5 CSS",
              )

              owner_board = r'''
          <div class="confirmation-board" id="confirmationBoard">
          <div class="confirmation-board-head">
          <div>
          <span class="confirmation-board-title">保護者確認・連絡ボード</span>
          <span class="confirmation-board-copy">受付内容、授業予定、当日状況、対応済みを確認します。カードを押すと下の統合一覧を絞り込みます。</span>
          </div>
          <button class="btn secondary small" id="clearConfirmationStageBtn" type="button">全確認を表示</button>
          </div>
          <div class="confirmation-grid">
          <button class="confirmation-stage" type="button" data-confirmation-stage="pending_request" aria-pressed="false">
          <strong id="confirmationPendingCount">0</strong><b>要返信</b><small>体験・欠席・振替の未対応</small>
          </button>
          <button class="confirmation-stage" type="button" data-confirmation-stage="lesson_notice" aria-pressed="false">
          <strong id="confirmationLessonCount">0</strong><b>予定連絡</b><small>保護者へ確認する授業予定</small>
          </button>
          <button class="confirmation-stage" type="button" data-confirmation-stage="active" aria-pressed="false">
          <strong id="confirmationActiveCount">0</strong><b>当日確認</b><small>来校・授業中・欠席</small>
          </button>
          <button class="confirmation-stage" type="button" data-confirmation-stage="completed" aria-pressed="false">
          <strong id="confirmationCompletedCount">0</strong><b>対応済み</b><small>返信済み・授業完了</small>
          </button>
          </div>
          <div class="confirmation-board-summary" id="confirmationBoardSummary">情報を更新すると、保護者確認の件数を表示します。</div>
          </div>

          '''
              owner = insert_before_once(
                  owner,
                  '<div class="progress-board" id="progressBoard">',
                  owner_board,
                  "owner確認ボードHTML",
              )

              owner = replace_once(
                  owner,
                  "        progressStage: 'all',\n        dashboard: makeEmptyDashboard(),",
                  "        progressStage: 'all',\n"
                  "        confirmationStage: 'all',\n"
                  "        dashboard: makeEmptyDashboard(),",
                  "owner確認state",
              )
              owner = replace_once(
                  owner,
                  "        renderTasks();\n        renderProgressBoard();",
                  "        renderTasks();\n"
                  "        renderConfirmationBoard();\n"
                  "        renderProgressBoard();",
                  "owner確認ボード描画",
              )

              owner_functions = r'''
          function confirmationStageForItem(item){
          const progress = progressStageForItem(item);
          if(item && item.kind === 'request') return boolDone(item.status) ? 'completed' : 'pending_request';
          if(progress === 'scheduled') return 'lesson_notice';
          if(progress === 'checked_in' || progress === 'in_progress' || progress === 'absent') return 'active';
          return 'completed';
          }

          function confirmationStageLabel(stage){
          return {
          pending_request:'要返信',
          lesson_notice:'予定連絡',
          active:'当日確認',
          completed:'対応済み',
          all:'全確認'
          }[stage] || '全確認';
          }

          function confirmationStageBadgeClass(stage){
          return {
          pending_request:'orange',
          lesson_notice:'blue',
          active:'purple',
          completed:'green'
          }[stage] || 'gray';
          }

          function confirmationCheckText(item){
          if(!item) return '生徒・保護者・日時を確認';
          if(item.kind === 'lesson') return '確認項目：日時・担当・教室・保護者連絡先';
          if(isTrialType(item.type)) return '確認項目：体験日時・コース・担当・保護者連絡先';
          if(isAbsenceType(item.type)) return '確認項目：欠席日・授業時間・理由・振替要否';
          if(isMakeupType(item.type)) return '確認項目：第1希望・第2希望・空き枠・確定日時';
          return '確認項目：受付内容・対象日時・保護者連絡先';
          }

          function confirmationCounts(items){
          const counts = { pending_request:0, lesson_notice:0, active:0, completed:0 };
          (items || []).forEach((item) => {
          const stage = confirmationStageForItem(item);
          if(Object.prototype.hasOwnProperty.call(counts, stage)) counts[stage] += 1;
          });
          return counts;
          }

          function renderConfirmationBoard(){
          const board = $('confirmationBoard');
          if(!board) return;
          const items = getUnifiedItems();
          const counts = confirmationCounts(items);
          const ids = {
          pending_request:'confirmationPendingCount',
          lesson_notice:'confirmationLessonCount',
          active:'confirmationActiveCount',
          completed:'confirmationCompletedCount'
          };
          Object.keys(ids).forEach((stage) => {
          const element = $(ids[stage]);
          if(element) element.textContent = String(counts[stage] || 0);
          });
          document.querySelectorAll('#confirmationBoard [data-confirmation-stage]').forEach((button) => {
          const active = button.dataset.confirmationStage === (state.confirmationStage || 'all');
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', active ? 'true' : 'false');
          });
          const summary = $('confirmationBoardSummary');
          if(summary){
          const selected = state.confirmationStage && state.confirmationStage !== 'all'
          ? ` / 表示中：${confirmationStageLabel(state.confirmationStage)}`
          : '';
          summary.textContent = `要返信 ${counts.pending_request}件 / 予定連絡 ${counts.lesson_notice}件 / 当日確認 ${counts.active}件 / 対応済み ${counts.completed}件${selected}`;
          }
          }

          function setConfirmationStage(stage){
          state.confirmationStage = stage || 'all';
          state.progressStage = 'all';
          state.unifiedFilter = 'all';
          document.querySelectorAll('#unifiedFilterBar [data-unified-filter]').forEach((button) => {
          button.classList.toggle('active', button.dataset.unifiedFilter === 'all');
          });
          renderConfirmationBoard();
          renderProgressBoard();
          renderUnifiedReception();
          }

          '''
              owner = insert_before_once(
                  owner,
                  "function progressStageForItem(item){",
                  owner_functions,
                  "owner確認関数",
              )

              old_set_progress = '''function setProgressStage(stage){
          state.progressStage = stage || 'all';
          state.unifiedFilter = 'all';
          document.querySelectorAll('#unifiedFilterBar [data-unified-filter]').forEach((button) => {
            button.classList.toggle('active', button.dataset.unifiedFilter === 'all');
          });
          renderProgressBoard();
          renderUnifiedReception();
          }'''
              new_set_progress = '''function setProgressStage(stage){
          state.progressStage = stage || 'all';
          state.confirmationStage = 'all';
          state.unifiedFilter = 'all';
          document.querySelectorAll('#unifiedFilterBar [data-unified-filter]').forEach((button) => {
            button.classList.toggle('active', button.dataset.unifiedFilter === 'all');
          });
          renderConfirmationBoard();
          renderProgressBoard();
          renderUnifiedReception();
          }'''
              owner = replace_once(
                  owner,
                  old_set_progress,
                  new_set_progress,
                  "owner進捗・確認連携",
              )

              old_unified_filter = '''function unifiedFilteredItems(){
          const filter = state.unifiedFilter || 'all';
          const query = String(state.unifiedQuery || '').trim();
          const progressStage = state.progressStage || 'all';
          return getUnifiedItems().filter((item) => {
          if(filter === 'request' && item.kind !== 'request') return false;
          if(filter === 'lesson' && item.kind !== 'lesson') return false;
          if(filter === 'pending' && boolDone(item.status)) return false;
          if(filter === 'done' && !boolDone(item.status)) return false;
          if(progressStage !== 'all' && progressStageForItem(item) !== progressStage) return false;
          return unifiedMatchesQuery(item, query);
          });
          }'''
              new_unified_filter = '''function unifiedFilteredItems(){
          const filter = state.unifiedFilter || 'all';
          const query = String(state.unifiedQuery || '').trim();
          const progressStage = state.progressStage || 'all';
          const confirmationStage = state.confirmationStage || 'all';
          return getUnifiedItems().filter((item) => {
          if(filter === 'request' && item.kind !== 'request') return false;
          if(filter === 'lesson' && item.kind !== 'lesson') return false;
          if(filter === 'pending' && boolDone(item.status)) return false;
          if(filter === 'done' && !boolDone(item.status)) return false;
          if(progressStage !== 'all' && progressStageForItem(item) !== progressStage) return false;
          if(confirmationStage !== 'all' && confirmationStageForItem(item) !== confirmationStage) return false;
          return unifiedMatchesQuery(item, query);
          });
          }'''
              owner = replace_once(
                  owner,
                  old_unified_filter,
                  new_unified_filter,
                  "owner確認絞り込み",
              )

              unified_start = owner.index("function renderUnifiedReception(){")
              unified_end = owner.index("      function renderRequests(){", unified_start)
              unified = owner[unified_start:unified_end]

              unified = replace_once(
                  unified,
                  '        <span class="badge ${progressStageBadgeClass(progressStageForItem(item))}">進捗：${escapeHtml(progressStageLabel(progressStageForItem(item)))}</span>',
                  '        <span class="badge ${progressStageBadgeClass(progressStageForItem(item))}">進捗：${escapeHtml(progressStageLabel(progressStageForItem(item)))}</span>\n'
                  '        <span class="badge ${confirmationStageBadgeClass(confirmationStageForItem(item))}">確認：${escapeHtml(confirmationStageLabel(confirmationStageForItem(item)))}</span>',
                  "owner統合確認バッジ",
              )
              unified = replace_once(
                  unified,
                  "      ${item.memo ? `<div class=\"item-note\">${escapeHtml(item.memo)}</div>` : ''}\n"
                  "    </div>\n"
                  "    <div class=\"item-actions\">",
                  "      ${item.memo ? `<div class=\"item-note\">${escapeHtml(item.memo)}</div>` : ''}\n"
                  "      <div class=\"confirmation-check\">${escapeHtml(confirmationCheckText(item))}</div>\n"
                  "    </div>\n"
                  "    <div class=\"item-actions\">",
                  "owner統合確認項目",
              )
              unified = replace_once(
                  unified,
                  '      <button class="btn navy small" data-action="show-message" data-key="${msgKey}" type="button">文面を見る</button>',
                  '      <button class="btn navy small" data-action="show-message" data-key="${msgKey}" type="button">文面を見る</button>\n'
                  '      <button class="btn small" data-action="copy-message" data-key="${msgKey}" type="button">文面コピー</button>\n'
                  '      ${item.phone && item.studentNo ? `<a class="btn secondary small" href="./member.html?phone=${encodeURIComponent(item.phone)}&student_no=${encodeURIComponent(item.studentNo)}&auto=1" target="_blank" rel="noopener">会員画面確認</a>` : \'\'}',
                  "owner統合顧客導線",
              )
              owner = owner[:unified_start] + unified + owner[unified_end:]

              confirmation_events = r'''
          $('confirmationBoard').addEventListener('click', (e) => {
          const button = e.target.closest('[data-confirmation-stage]');
          if(!button) return;
          setConfirmationStage(button.dataset.confirmationStage || 'all');
          scrollToNextTarget('unifiedReceptionList');
          });
          $('clearConfirmationStageBtn').addEventListener('click', () => {
          setConfirmationStage('all');
          });
          '''
              owner = insert_before_once(
                  owner,
                  "$('progressBoard').addEventListener('click', (e) => {",
                  confirmation_events,
                  "owner確認イベント",
              )

              old_unified_event = '''$('unifiedFilterBar').addEventListener('click', (e) => {
          const button = e.target.closest('[data-unified-filter]');
          if(!button) return;
          state.unifiedFilter = button.dataset.unifiedFilter || 'all';
          state.progressStage = 'all';
          document.querySelectorAll('#unifiedFilterBar [data-unified-filter]').forEach((item) => item.classList.toggle('active', item === button));
          renderProgressBoard();
          renderUnifiedReception();
          });'''
              new_unified_event = '''$('unifiedFilterBar').addEventListener('click', (e) => {
          const button = e.target.closest('[data-unified-filter]');
          if(!button) return;
          state.unifiedFilter = button.dataset.unifiedFilter || 'all';
          state.progressStage = 'all';
          state.confirmationStage = 'all';
          document.querySelectorAll('#unifiedFilterBar [data-unified-filter]').forEach((item) => item.classList.toggle('active', item === button));
          renderConfirmationBoard();
          renderProgressBoard();
          renderUnifiedReception();
          });'''
              owner = replace_once(
                  owner,
                  old_unified_event,
                  new_unified_event,
                  "owner既存フィルター連携",
              )
              owner = replace_once(
                  owner,
                  '<li>進捗ボードで受付・授業の滞留を確認</li>\n'
                  '            <li>文面を確認・コピーしてLINEで送信</li>',
                  '<li>進捗ボードで受付・授業の滞留を確認</li>\n'
                  '            <li>保護者確認ボードで返信・予定連絡を確認</li>\n'
                  '            <li>文面を確認・コピーしてLINEで送信</li>',
                  "owner運用フロー",
              )

              if owner == owner_original:
                  raise RuntimeError("owner.htmlに変更がありません。")
              owner_path.write_text(owner, encoding="utf-8", newline="\n")

          # ------------------------------------------------------------
          # member.html
          # ------------------------------------------------------------
          member_path = Path("member.html")
          member = member_path.read_text(encoding="utf-8")
          member_original = member

          if "STEP SCHOOL-NEXT-5 / member.html" not in member:
              required_member = [
                  '<div class="version">STEP SCHOOL-7 / member.html</div>',
                  '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-7 / member.html</p>',
                  "const VERSION = 'STEP SCHOOL-7';",
                  '<div class="card" id="profileSection">',
                  "        renderStudentInfo(p);",
                  "      function paymentBadgeClass(status) {",
                  "      function renderRequests(requests) {",
                  "      function bindEvents() {",
                  "        $('loadBtn').addEventListener('click', loadProfile);",
              ]
              missing = [marker for marker in required_member if marker not in member]
              if missing:
                  raise RuntimeError("member.htmlの現行マーカー不足: " + " / ".join(missing))

              member = replace_once(
                  member,
                  '<div class="version">STEP SCHOOL-7 / member.html</div>',
                  '<div class="version">STEP SCHOOL-NEXT-5 / member.html</div>',
                  "member画面バージョン",
              )
              member = replace_once(
                  member,
                  '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-7 / member.html</p>',
                  '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-5 / member.html</p>',
                  "memberフッターバージョン",
              )
              member = replace_once(
                  member,
                  "const VERSION = 'STEP SCHOOL-7';",
                  "const VERSION = 'STEP SCHOOL-NEXT-5';",
                  "member JavaScriptバージョン",
              )
              member = replace_once(
                  member,
                  '<p class="lead">保護者がLINEから、生徒証・次回授業・欠席/振替依頼・振替残数・チケット残数を確認できます。電話番号と生徒番号で確認します。</p>',
                  '<p class="lead">保護者がLINEから、生徒証・次回授業・欠席/振替依頼・教室の確認状況を確認できます。電話番号と生徒番号で安全に表示します。</p>',
                  "memberリード文",
              )

              member_css = r'''
          /* SCHOOL-NEXT-5: 教室確認・顧客連携 */
          .contact-status-card{border-color:#c7d2fe;background:linear-gradient(135deg,rgba(238,242,255,.96),rgba(240,253,250,.96));}
          .contact-status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
          .contact-status-item{background:#fff;border:1px solid #dbe5f2;border-radius:17px;padding:15px;min-height:96px;}
          .contact-status-item strong{display:block;font-size:29px;line-height:1;font-weight:950;margin-bottom:8px;}
          .contact-status-item b{display:block;font-size:13px;margin-bottom:4px;}
          .contact-status-item small{display:block;color:#64748b;font-size:11px;font-weight:750;line-height:1.5;}
          .contact-status-summary{margin-top:12px;padding:11px 13px;border-radius:13px;background:#fff;border:1px solid #dbe5f2;color:#475569;font-size:12px;font-weight:800;line-height:1.7;}
          .request-guide{margin-top:10px;padding:9px 11px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;color:#475569;font-size:12px;font-weight:780;line-height:1.65;}
          @media(max-width:700px){.contact-status-grid{grid-template-columns:1fr;}}

          '''
              member = insert_regex_once(
                  member,
                  r'(?m)^[ \t]*\.student-card \{',
                  member_css,
                  "member NEXT-5 CSS",
              )

              member_card = r'''
          <div class="card contact-status-card" id="contactStatusSection">
          <div class="section-title"><span class="num">2</span><h2>教室確認・連絡状況</h2></div>
          <p class="hint">欠席・振替依頼の確認状況と、今後の授業予定をまとめて表示します。</p>
          <div class="contact-status-grid">
            <div class="contact-status-item">
              <strong id="memberPendingCount">0</strong><b>教室確認中</b><small>受付済み・返信待ち</small>
            </div>
            <div class="contact-status-item">
              <strong id="memberCompletedCount">0</strong><b>対応済み</b><small>教室で確認・処理済み</small>
            </div>
            <div class="contact-status-item">
              <strong id="memberLessonCount">0</strong><b>今後の授業</b><small>授業予定に反映済み</small>
            </div>
          </div>
          <div class="contact-status-summary" id="memberContactSummary">生徒証を表示すると、最新の確認状況を表示します。</div>
          <div class="actions">
            <button class="btn secondary" id="refreshMemberStatusBtn" type="button">確認状況を更新</button>
          </div>
          </div>

          '''
              member = insert_before_once(
                  member,
                  '<div class="card" id="profileSection">',
                  member_card,
                  "member確認状況HTML",
              )

              member = replace_once(
                  member,
                  "        renderStudentInfo(p);\n        renderLessons(p.lessons || []);",
                  "        renderContactStatus(p);\n"
                  "        renderStudentInfo(p);\n"
                  "        renderLessons(p.lessons || []);",
                  "member確認状況描画",
              )

              member_functions = r'''
          function memberRequestDone(status) {
          const s = String(status || '').toLowerCase();
          return ['完了','済','対応済み','done','completed','replied','handled','closed'].some((x) => s.includes(x));
          }

          function memberRequestGuide(status) {
          return memberRequestDone(status)
          ? '教室で確認・対応済みです。確定した授業は上の授業予定に表示されます。'
          : '教室確認中です。確定内容はLINE返信または授業予定へ反映されます。';
          }

          function memberLessonCountable(status) {
          const s = String(status || '').toLowerCase();
          return !['取消','キャンセル','cancel'].some((x) => s.includes(x));
          }

          function renderContactStatus(p) {
          const requests = p.requests || [];
          const lessons = p.lessons || [];
          const pending = requests.filter((r) => !memberRequestDone(r.status)).length;
          const completed = requests.filter((r) => memberRequestDone(r.status)).length;
          const lessonCount = lessons.filter((l) => memberLessonCountable(l.status)).length;
          $('memberPendingCount').textContent = String(pending);
          $('memberCompletedCount').textContent = String(completed);
          $('memberLessonCount').textContent = String(lessonCount);
          const source = state.usedFallback ? 'デモ表示' : '教室データ';
          $('memberContactSummary').textContent = `${source} / 教室確認中 ${pending}件 / 対応済み ${completed}件 / 今後の授業 ${lessonCount}件 / ${new Date().toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' })}更新`;
          }

          '''
              member = insert_before_once(
                  member,
                  "      function paymentBadgeClass(status) {",
                  member_functions,
                  "member確認状況関数",
              )

              request_start = member.index("      function renderRequests(requests) {")
              request_end = member.index("      function renderSiblings(siblings) {", request_start)
              request_block = member[request_start:request_end]
              request_block = replace_once(
                  request_block,
                  "              ${requestBadge(r.status)}\n"
                  "            </div>\n"
                  "          </div>",
                  "              ${requestBadge(r.status)}\n"
                  "            </div>\n"
                  "            <div class=\"request-guide\">${escapeHtml(memberRequestGuide(r.status))}</div>\n"
                  "          </div>",
                  "member依頼確認説明",
              )
              member = member[:request_start] + request_block + member[request_end:]

              member = insert_before_once(
                  member,
                  "        $('loadBtn').addEventListener('click', loadProfile);",
                  "        $('refreshMemberStatusBtn').addEventListener('click', loadProfile);\n",
                  "member更新イベント",
              )

              if member == member_original:
                  raise RuntimeError("member.htmlに変更がありません。")
              member_path.write_text(member, encoding="utf-8", newline="\n")

          print("SCHOOL-NEXT-5 patch complete")
          PY

      - name: 4. HTML・JavaScript・ID・顧客連携検査
        if: steps.preflight.outputs.mode == 'apply'
        id: validate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${STATE_DIR}"

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from datetime import datetime, timezone, timedelta
          import hashlib
          import json
          import os
          import re
          import subprocess

          files = {
              "owner": {
                  "before": Path(os.environ["RUNNER_TEMP"]) / "owner-before-school-next-5.html",
                  "after": Path("owner.html"),
              },
              "member": {
                  "before": Path(os.environ["RUNNER_TEMP"]) / "member-before-school-next-5.html",
                  "after": Path("member.html"),
              },
          }
          results = []

          def add(key, label, status, detail, blocking=False):
              results.append({
                  "key": key,
                  "label": label,
                  "status": status,
                  "detail": detail,
                  "blocking": bool(blocking and status == "NG"),
              })

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
                  self.scripts = []
                  self.in_script = False
                  self.external = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if data.get("id"):
                      self.ids.append(data["id"])
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = bool(data.get("src"))
                      self.parts = []

              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external:
                          self.scripts.append("".join(self.parts))
                      self.in_script = False
                      self.external = False
                      self.parts = []

          payload_files = {}
          for name, paths in files.items():
              before_text = paths["before"].read_text(encoding="utf-8")
              after_text = paths["after"].read_text(encoding="utf-8")
              bp = Inspector()
              ap = Inspector()
              bp.feed(before_text)
              bp.close()
              ap.feed(after_text)
              ap.close()

              missing_ids = sorted(set(bp.ids) - set(ap.ids))
              duplicates = sorted({value for value in ap.ids if ap.ids.count(value) > 1})
              add(
                  f"{name}_existing_ids",
                  f"{name}既存HTML ID維持",
                  "NG" if missing_ids else "OK",
                  "削除: " + ", ".join(missing_ids) if missing_ids else f"既存ID {len(set(bp.ids))}件を維持",
                  bool(missing_ids),
              )
              add(
                  f"{name}_duplicate_ids",
                  f"{name} HTML ID重複",
                  "NG" if duplicates else "OK",
                  "重複: " + ", ".join(duplicates) if duplicates else f"ID {len(ap.ids)}件、重複なし",
                  bool(duplicates),
              )

              script_errors = []
              for index, script in enumerate(ap.scripts, 1):
                  if not script.strip():
                      continue
                  temp = Path("dpro-next") / f".school-next-5-{name}-{index}.js"
                  temp.write_text(script, encoding="utf-8")
                  proc = subprocess.run(["node", "--check", str(temp)], capture_output=True, text=True)
                  temp.unlink(missing_ok=True)
                  if proc.returncode:
                      script_errors.append((proc.stderr or proc.stdout)[-1800:])
              add(
                  f"{name}_javascript",
                  f"{name} JavaScript構文",
                  "NG" if script_errors else "OK",
                  " / ".join(script_errors) if script_errors else f"インラインscript {len(ap.scripts)}件 PASS",
                  bool(script_errors),
              )

              api_pattern = re.compile(r"['\"](/api/[a-zA-Z0-9_./-]+)['\"]")
              before_api = sorted(set(api_pattern.findall(before_text)))
              after_api = sorted(set(api_pattern.findall(after_text)))
              api_changed = before_api != after_api
              add(
                  f"{name}_api",
                  f"{name}既存API維持",
                  "NG" if api_changed else "OK",
                  f"before={before_api} / after={after_api}" if api_changed else f"既存API {len(after_api)}件、追加・削除なし",
                  api_changed,
              )

              before_fetch = before_text.count("fetch(")
              after_fetch = after_text.count("fetch(")
              fetch_changed = before_fetch != after_fetch
              add(
                  f"{name}_network",
                  f"{name}追加通信なし",
                  "NG" if fetch_changed else "OK",
                  f"before={before_fetch}, after={after_fetch}" if fetch_changed else f"fetch呼出数 {after_fetch}を維持",
                  fetch_changed,
              )

              payload_files[name] = {
                  "before_sha256": hashlib.sha256(paths["before"].read_bytes()).hexdigest(),
                  "after_sha256": hashlib.sha256(paths["after"].read_bytes()).hexdigest(),
                  "bytes": paths["after"].stat().st_size,
              }

          owner_text = files["owner"]["after"].read_text(encoding="utf-8")
          member_text = files["member"]["after"].read_text(encoding="utf-8")

          owner_markers = [
              '<div class="version">STEP SCHOOL-NEXT-5 / owner.html</div>',
              "const VERSION = 'STEP SCHOOL-NEXT-5';",
              'id="confirmationBoard"',
              'id="clearConfirmationStageBtn"',
              'id="confirmationPendingCount"',
              'id="confirmationLessonCount"',
              'id="confirmationActiveCount"',
              'id="confirmationCompletedCount"',
              "confirmationStageForItem",
              "confirmationCheckText",
              "renderConfirmationBoard",
              "setConfirmationStage",
              "confirmationStage !== 'all'",
              "確認：${escapeHtml(confirmationStageLabel(confirmationStageForItem(item)))}",
              "会員画面確認",
              "auto=1",
              'data-action="copy-message"',
              'id="progressBoard"',
              'id="unifiedReceptionList"',
              'id="clearAdminBtn"',
          ]
          owner_missing = [marker for marker in owner_markers if marker not in owner_text]
          add(
              "owner_features",
              "owner確認・顧客連携機能",
              "NG" if owner_missing else "OK",
              "不足: " + " / ".join(owner_missing) if owner_missing else f"必須マーカー {len(owner_markers)}件",
              bool(owner_missing),
          )

          member_markers = [
              '<div class="version">STEP SCHOOL-NEXT-5 / member.html</div>',
              "const VERSION = 'STEP SCHOOL-NEXT-5';",
              'id="contactStatusSection"',
              'id="memberPendingCount"',
              'id="memberCompletedCount"',
              'id="memberLessonCount"',
              'id="memberContactSummary"',
              'id="refreshMemberStatusBtn"',
              "memberRequestDone",
              "memberRequestGuide",
              "renderContactStatus",
              "教室確認中です。",
              'id="requestList"',
              'id="lessonList"',
          ]
          member_missing = [marker for marker in member_markers if marker not in member_text]
          add(
              "member_features",
              "member確認状況機能",
              "NG" if member_missing else "OK",
              "不足: " + " / ".join(member_missing) if member_missing else f"必須マーカー {len(member_markers)}件",
              bool(member_missing),
          )

          admin_leaks = [
              marker
              for marker in ["admin_code", "adminCodeInput", "X-Admin-Code", "DEMO_ADMIN_CODE"]
              if marker in member_text
          ]
          add(
              "member_admin_leak",
              "会員画面への管理情報混入",
              "NG" if admin_leaks else "OK",
              "検出: " + ", ".join(admin_leaks) if admin_leaks else "管理コード・管理ヘッダー混入なし",
              bool(admin_leaks),
          )

          changed = subprocess.run(
              ["git", "diff", "--name-only"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout.splitlines()
          unexpected = [
              name for name in changed
              if name not in ["owner.html", "member.html"]
          ]
          add(
              "scope",
              "対象ファイル限定",
              "NG" if unexpected else "OK",
              "意図しない変更: " + ", ".join(unexpected) if unexpected else "本体変更はowner.html・member.htmlのみ",
              bool(unexpected),
          )

          add("worker", "Worker変更", "OK", "変更なし")
          add("supabase", "Supabase変更", "OK", "変更なし・SQL不要")
          add("approval_data", "新規承認データ", "OK", "追加せず既存状態を表示変換")
          add("automatic_line", "一括自動LINE配信", "OK", "追加なし・個別確認を維持")

          counts = {
              name: sum(1 for row in results if row["status"] == name)
              for name in ["OK", "注意", "NG"]
          }
          blocking = sum(1 for row in results if row["blocking"])
          payload = {
              "step": "SCHOOL-NEXT-5",
              "checked_at_jst": datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds"),
              "files": payload_files,
              "counts": counts,
              "blocking_ng": blocking,
              "results": results,
          }
          Path("dpro-next/school-next-5-validation.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"owner_after_sha256={payload_files['owner']['after_sha256']}\n")
              fh.write(f"member_after_sha256={payload_files['member']['after_sha256']}\n")
              fh.write(f"ok_count={counts['OK']}\n")
              fh.write(f"warning_count={counts['注意']}\n")
              fh.write(f"ng_count={counts['NG']}\n")

          if blocking:
              raise SystemExit(f"blocking NG: {blocking}")
          PY

      - name: 5. Worker・Supabase接続確認
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
          HEALTH="${RUNNER_TEMP}/school-next-5-health.json"

          STATUS="$(curl -sS -L --retry 2 --max-time 25 \
            -A "${UA}" \
            -H "Accept: application/json,text/plain,*/*" \
            -H "Cache-Control: no-cache" \
            -o "${HEALTH}" -w '%{http_code}' \
            "${API_BASE}/api/health?next_check=school-next-5-${GITHUB_RUN_ID}")"

          if [ "${STATUS}" != "200" ]; then
            echo "::error::Worker health HTTP ${STATUS}"
            cat "${HEALTH}" || true
            exit 1
          fi

          python3 - "${HEALTH}" "${EXPECTED_WORKER_VERSION}" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = sys.argv[2]
          if data.get("version") != expected:
              raise SystemExit(f"Worker version mismatch: {data.get('version')} != {expected}")
          if data.get("db_ok") is not True:
              raise SystemExit("db_ok is not true")
          print("Worker / Supabase OK")
          PY

      - name: 6. NEXT-5を仮Commit・Push
        if: steps.preflight.outputs.mode == 'apply'
        id: apply
        shell: bash
        env:
          BEFORE_OWNER_SHA256: ${{ steps.preflight.outputs.before_owner_sha256 }}
          BEFORE_MEMBER_SHA256: ${{ steps.preflight.outputs.before_member_sha256 }}
          BEFORE_GIT_SHA: ${{ steps.preflight.outputs.before_git_sha }}
          OWNER_AFTER_SHA256: ${{ steps.validate.outputs.owner_after_sha256 }}
          MEMBER_AFTER_SHA256: ${{ steps.validate.outputs.member_after_sha256 }}
          OK_COUNT: ${{ steps.validate.outputs.ok_count }}
          WARNING_COUNT: ${{ steps.validate.outputs.warning_count }}
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import os

          out = Path("dpro-next")
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")
          record = f'''step: "SCHOOL-NEXT-5"
          result: "PUBLIC_VERIFY_PENDING"
          applied_at_jst: "{now}"
          target_files:
            - "owner.html"
            - "member.html"
          changes:
            - "保護者確認・連絡ボード"
            - "要返信・予定連絡・当日確認・対応済みの4分類"
            - "受付・授業ごとの確認項目"
            - "統合一覧から文面コピー"
            - "統合一覧から対象生徒の会員画面を直接確認"
            - "会員画面へ教室確認中・対応済み・今後の授業件数"
            - "依頼状況の保護者向け説明"
          owner_before_sha256: "{os.environ.get('BEFORE_OWNER_SHA256','')}"
          owner_after_sha256: "{os.environ.get('OWNER_AFTER_SHA256','')}"
          member_before_sha256: "{os.environ.get('BEFORE_MEMBER_SHA256','')}"
          member_after_sha256: "{os.environ.get('MEMBER_AFTER_SHA256','')}"
          baseline_commit: "{os.environ.get('BEFORE_GIT_SHA','')}"
          backup_tag: "backup-school-next-before-5-20260724"
          worker_changed: false
          supabase_changed: false
          sql_required: false
          api_changed: false
          added_network_request: false
          new_approval_table: false
          validation_ok: {os.environ.get('OK_COUNT','0')}
          validation_warning: {os.environ.get('WARNING_COUNT','0')}
          next_step_after_public_verify: "SCHOOL-NEXT-6"
          '''
          record = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in record.splitlines()
          ) + "\n"
          (out / "school-next-5-change-record.yml").write_text(record, encoding="utf-8")
          PY

          git add owner.html member.html \
            "${STATE_DIR}/school-next-5-validation.json" \
            "${STATE_DIR}/school-next-5-change-record.yml"

          git commit -m "feat(school-next): apply NEXT-5 guardian confirmation"
          git push origin main

      - name: 7. GitHub Pages公開反映確認
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
          OWNER_PAGE="${RUNNER_TEMP}/school-next-5-owner.html"
          MEMBER_PAGE="${RUNNER_TEMP}/school-next-5-member.html"
          PASS=0

          for attempt in $(seq 1 24); do
            OWNER_STATUS="$(curl -sS -L --max-time 25 \
              -A "${UA}" -H "Accept: text/html" -H "Cache-Control: no-cache" \
              -o "${OWNER_PAGE}" -w '%{http_code}' \
              "${OWNER_URL}?next_check=school-next-5-${GITHUB_RUN_ID}-${attempt}")" || OWNER_STATUS="000"

            MEMBER_STATUS="$(curl -sS -L --max-time 25 \
              -A "${UA}" -H "Accept: text/html" -H "Cache-Control: no-cache" \
              -o "${MEMBER_PAGE}" -w '%{http_code}' \
              "${MEMBER_URL}?next_check=school-next-5-${GITHUB_RUN_ID}-${attempt}")" || MEMBER_STATUS="000"

            if [ "${OWNER_STATUS}" = "200" ] \
              && [ "${MEMBER_STATUS}" = "200" ] \
              && grep -q 'STEP SCHOOL-NEXT-5 / owner.html' "${OWNER_PAGE}" \
              && grep -q 'id="confirmationBoard"' "${OWNER_PAGE}" \
              && grep -q '会員画面確認' "${OWNER_PAGE}" \
              && grep -q 'STEP SCHOOL-NEXT-5 / member.html' "${MEMBER_PAGE}" \
              && grep -q 'id="contactStatusSection"' "${MEMBER_PAGE}" \
              && grep -q '教室確認・連絡状況' "${MEMBER_PAGE}"; then
              PASS=1
              break
            fi
            sleep 5
          done

          if [ "${PASS}" != "1" ]; then
            echo "::error::GitHub PagesへSCHOOL-NEXT-5が反映されませんでした。"
            exit 1
          fi

      - name: 8. 完成台帳更新・YML削除・自動Commit
        if: steps.preflight.outputs.mode == 'apply' && success()
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          out = Path("dpro-next")
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")

          current_path = out / "current-step.yml"
          current = current_path.read_text(encoding="utf-8")
          current = re.sub(r'^current_step:.*$', 'current_step: "SCHOOL-NEXT-6"', current, flags=re.M)
          current = re.sub(r'^last_completed_step:.*$', 'last_completed_step: "SCHOOL-NEXT-5"', current, flags=re.M)
          current = re.sub(r'^last_result:.*$', 'last_result: "OK"', current, flags=re.M)
          current = re.sub(r'^updated_at_jst:.*$', f'updated_at_jst: "{now}"', current, flags=re.M)
          current = re.sub(r'^worker_changed:.*$', 'worker_changed: false', current, flags=re.M)
          current = re.sub(r'^supabase_changed:.*$', 'supabase_changed: false', current, flags=re.M)
          current = re.sub(r'^api_changed:.*$', 'api_changed: false', current, flags=re.M)
          current_path.write_text(current, encoding="utf-8")

          record_path = out / "school-next-5-change-record.yml"
          record = record_path.read_text(encoding="utf-8")
          record = record.replace('result: "PUBLIC_VERIFY_PENDING"', 'result: "OK"')
          record += (
              f'completed_at_jst: "{now}"\n'
              f'public_owner_url: "https://dpromstk2000-lab.github.io/dpro-school-line/owner.html"\n'
              f'public_member_url: "https://dpromstk2000-lab.github.io/dpro-school-line/member.html"\n'
              f'public_verify: "PASS"\n'
              f'current_step: "SCHOOL-NEXT-6"\n'
              f'last_completed_step: "SCHOOL-NEXT-5"\n'
              f'next_step: "SCHOOL-NEXT-6"\n'
          )
          record_path.write_text(record, encoding="utf-8")
          PY

          rm -f "${WORKFLOW_FILE}"

          stage_path(){
            local path="$1"
            if [ -e "${path}" ] || git ls-files --error-unmatch "${path}" >/dev/null 2>&1; then
              git add -A -- "${path}"
            fi
          }

          stage_path "${CURRENT_STEP_FILE}"
          stage_path "${STATE_DIR}/school-next-5-change-record.yml"
          stage_path "${WORKFLOW_FILE}"

          git commit -m "feat(school-next): complete NEXT-5 guardian confirmation"
          git push origin main

          {
            echo "## SCHOOL-NEXT-5 完了"
            echo ""
            echo "- 保護者確認・連絡ボード: PASS"
            echo "- LINE会員確認状況: PASS"
            echo "- 公開owner/member: PASS"
            echo "- Worker変更: なし"
            echo "- Supabase変更: なし"
            echo "- API変更: なし"
            echo "- 次のSTEP: SCHOOL-NEXT-6"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 9. 失敗時ロールバック・R1台帳
        if: failure() && steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main || true

          CURRENT_AFTER="$(grep -E '^current_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs || true)"
          LAST_AFTER="$(grep -E '^last_completed_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs || true)"

          if [ "${CURRENT_AFTER}" = "SCHOOL-NEXT-6" ] && [ "${LAST_AFTER}" = "SCHOOL-NEXT-5" ]; then
            echo "::notice::NEXT-5は既に完了しています。台帳を書き戻さず終了します。"
            exit 0
          fi

          if [ -f "${RUNNER_TEMP}/owner-before-school-next-5.html" ]; then
            cp "${RUNNER_TEMP}/owner-before-school-next-5.html" owner.html
          fi
          if [ -f "${RUNNER_TEMP}/member-before-school-next-5.html" ]; then
            cp "${RUNNER_TEMP}/member-before-school-next-5.html" member.html
          fi
          if [ -f "${RUNNER_TEMP}/current-step-before-school-next-5.yml" ]; then
            cp "${RUNNER_TEMP}/current-step-before-school-next-5.yml" "${CURRENT_STEP_FILE}"
          fi

          rm -f "${STATE_DIR}/school-next-5-change-record.yml"

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          out = Path("dpro-next")
          out.mkdir(exist_ok=True)
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")

          current_path = out / "current-step.yml"
          current = current_path.read_text(encoding="utf-8")
          current = re.sub(r'^current_step:.*$', 'current_step: "SCHOOL-NEXT-5-R1_REQUIRED"', current, flags=re.M)
          current = re.sub(r'^last_completed_step:.*$', 'last_completed_step: "SCHOOL-NEXT-4"', current, flags=re.M)
          current = re.sub(r'^last_result:.*$', 'last_result: "NG"', current, flags=re.M)
          current = re.sub(r'^updated_at_jst:.*$', f'updated_at_jst: "{now}"', current, flags=re.M)
          current_path.write_text(current, encoding="utf-8")

          failure = f'''step: "SCHOOL-NEXT-5"
          result: "NG"
          checked_at_jst: "{now}"
          rollback: "owner.html・member.html・current-stepを変更前へ復元"
          worker_changed: false
          supabase_changed: false
          api_changed: false
          next_step: "SCHOOL-NEXT-5-R1_REQUIRED"
          '''
          failure = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in failure.splitlines()
          ) + "\n"
          (out / "school-next-5-failure-record.yml").write_text(failure, encoding="utf-8")
          PY

          stage_path(){
            local path="$1"
            if [ -e "${path}" ] || git ls-files --error-unmatch "${path}" >/dev/null 2>&1; then
              git add -A -- "${path}"
            fi
          }

          stage_path owner.html
          stage_path member.html
          stage_path "${CURRENT_STEP_FILE}"
          stage_path "${STATE_DIR}/school-next-5-change-record.yml"
          stage_path "${STATE_DIR}/school-next-5-failure-record.yml"
          stage_path "${STATE_DIR}/school-next-5-validation.json"

          if ! git diff --cached --quiet; then
            git commit -m "chore(school-next): rollback NEXT-5 and record failure"
            git push origin main
          fi
