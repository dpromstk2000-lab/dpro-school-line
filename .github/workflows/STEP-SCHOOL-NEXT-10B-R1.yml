name: "STEP SCHOOL-NEXT-10B-R1 | COMPLETE後処理修正"
run-name: "SCHOOL-NEXT-10B-R1 completion cleanup fix by ${{ github.actor }}"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/STEP-SCHOOL-NEXT-10B-R1.yml"

permissions:
  contents: write

concurrency:
  group: school-next-10b-r1-final-completion
  cancel-in-progress: false

jobs:
  final-completion:
    name: "SCHOOL-NEXT-10B-R1 最終完成判定"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WORKFLOW_PATH: ".github/workflows/STEP-SCHOOL-NEXT-10B-R1.yml"
      ORIGINAL_WORKFLOW_PATH: ".github/workflows/STEP-SCHOOL-NEXT-10B.yml"
      CURRENT_STEP_FILE: "dpro-next/current-step.yml"
      STEP9_RECORD: "dpro-next/school-next-9-change-record.yml"
      FINAL_RECORD: "dpro-next/school-next-final-completion.yml"
      FAILURE_RECORD: "dpro-next/school-next-10b-failure.yml"
      BEFORE_TAG: "backup-school-next-before-10b-r1-20260724"
      EXPECTED_CURRENT_STEP_BLOB_SHA: "8e45bcd4d6171374168918c22cf2f64681b5b731"
      EXPECTED_STEP9_BLOB_SHA: "ba9d63636b91b4991d3b51c855c4ad493c865467"
      FINAL_VERSION: "SCHOOL-NEXT-10-COMPLETE-20260724"
      SCHOOL_BASE_URL: "https://dpromstk2000-lab.github.io/dpro-school-line"
      WORKER_URL: "https://dpro-school-line-api.dpromstk2000.workers.dev"
      PRODUCT_URL: "https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/school.html"
      CATALOG_URL: "https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems.html"
      PDF_URL: "https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/pdfs/dpro-school-line-next-operation-guide.pdf"
      PNG_URL: "https://dpromstk2000-lab.github.io/dpro-line-systems-site/assets/pdfs/dpro-school-line-next-operation-guide.png"
      SITE_COMPLETION_RAW: "https://raw.githubusercontent.com/dpromstk2000-lab/dpro-line-systems-site/main/dpro-next/school-next-10a-completion.yml"
      QR_REPORT_RAW: "https://raw.githubusercontent.com/dpromstk2000-lab/dpro-line-systems-site/main/assets/school-next/operation-sheet-qr-check.json"
      PDF_RAW: "https://raw.githubusercontent.com/dpromstk2000-lab/dpro-line-systems-site/main/assets/pdfs/dpro-school-line-next-operation-guide.pdf"
      PNG_RAW: "https://raw.githubusercontent.com/dpromstk2000-lab/dpro-line-systems-site/main/assets/pdfs/dpro-school-line-next-operation-guide.png"

    steps:
      - name: "1. 学習塾リポジトリ取得"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "2. 前STEP・基準状態・重複実行確認"
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in "$WORKFLOW_PATH" "$CURRENT_STEP_FILE" "$STEP9_RECORD"; do
            [[ -f "$file" ]] || { echo "::error file=$file::必須ファイルがありません。"; exit 1; }
          done

          if grep -q 'current_step: "COMPLETE"' "$CURRENT_STEP_FILE" && [[ -f "$FINAL_RECORD" ]]; then
            echo "mode=duplicate" >> "$GITHUB_OUTPUT"
            echo "::notice::SCHOOL-NEXT-10Bは完了済みです。再アップロードされたYMLのみ削除します。"
            exit 0
          fi

          [[ "$(git hash-object "$CURRENT_STEP_FILE")" == "$EXPECTED_CURRENT_STEP_BLOB_SHA" ]] || { echo "::error file=$CURRENT_STEP_FILE::基準版不一致"; exit 1; }
          [[ "$(git hash-object "$STEP9_RECORD")" == "$EXPECTED_STEP9_BLOB_SHA" ]] || { echo "::error file=$STEP9_RECORD::STEP9台帳不一致"; exit 1; }
          grep -q 'current_step: "SCHOOL-NEXT-10B-R1_REQUIRED"' "$CURRENT_STEP_FILE" || { echo "::error::current_stepがSCHOOL-NEXT-10B-R1_REQUIREDではありません。"; exit 1; }
          grep -q 'last_completed_step: "SCHOOL-NEXT-9"' "$CURRENT_STEP_FILE" || exit 1
          grep -q 'last_result: "NG"' "$CURRENT_STEP_FILE" || exit 1
          grep -q 'result: "OK"' "$STEP9_RECORD" || { echo "::error::SCHOOL-NEXT-9がOKではありません。"; exit 1; }
          grep -q 'validation_ok: 32' "$STEP9_RECORD" || { echo "::error::STEP9のOK件数が32ではありません。"; exit 1; }
          grep -q 'validation_attention: 0' "$STEP9_RECORD" || { echo "::error::STEP9に注意項目があります。"; exit 1; }

          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD)
          before_sha="$(git rev-parse HEAD)"
          if [[ "${#changed[@]}" -eq 1 && "${changed[0]}" == "$WORKFLOW_PATH" ]]; then
            before_sha="$(git rev-parse HEAD^)"
          fi
          echo "BEFORE_SHA=$before_sha" >> "$GITHUB_ENV"
          echo "mode=apply" >> "$GITHUB_OUTPUT"

      - name: "2B. 完了済みYMLの自動削除"
        if: steps.preflight.outputs.mode == 'duplicate'
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$WORKFLOW_PATH" "$ORIGINAL_WORKFLOW_PATH" "$FAILURE_RECORD"

          stage_optional() {
            local path="$1"
            if [[ -e "$path" ]] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -A -- "$path"
            fi
          }

          stage_optional "$WORKFLOW_PATH"
          stage_optional "$ORIGINAL_WORKFLOW_PATH"
          stage_optional "$FAILURE_RECORD"

          if git diff --cached --quiet; then
            echo "::notice::削除対象はありません。"
            exit 0
          fi

          git commit -m "chore(school-next): remove duplicate SCHOOL-NEXT-10B-R1 workflow [skip ci]"
          git push origin main

      - name: "3. 変更前バックアップタグ"
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail
          if git rev-parse "$BEFORE_TAG" >/dev/null 2>&1; then
            [[ "$(git rev-list -n 1 "$BEFORE_TAG")" == "$BEFORE_SHA" ]] || { echo "::error::既存タグの参照先が異なります。"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/$BEFORE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$BEFORE_TAG:refs/tags/$BEFORE_TAG"
            [[ "$(git rev-list -n 1 "$BEFORE_TAG")" == "$BEFORE_SHA" ]] || exit 1
          else
            git tag -a "$BEFORE_TAG" "$BEFORE_SHA" -m "before SCHOOL-NEXT-10B COMPLETE"
            git push origin "refs/tags/$BEFORE_TAG"
          fi

      - name: "4. YML・HTML・JavaScript・ID最終構文検査"
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' "$WORKFLOW_PATH"
          for file in index.html member.html owner.html owner-ipad.html system-check.html; do
            [[ -f "$file" ]] || { echo "::error file=$file::画面ファイルがありません。"; exit 1; }
          done
          node --check config.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.scripts=[]; self.in_script=False; self.buf=[]
              def handle_starttag(self, tag, attrs):
                  data=dict(attrs)
                  if data.get('id'): self.ids.append(data['id'])
                  if tag=='script' and not data.get('src'): self.in_script=True; self.buf=[]
              def handle_endtag(self, tag):
                  if tag=='script' and self.in_script:
                      self.scripts.append(''.join(self.buf)); self.in_script=False
              def handle_data(self, data):
                  if self.in_script: self.buf.append(data)

          for name in ['index.html','member.html','owner.html','owner-ipad.html','system-check.html']:
              parser=Checker(); parser.feed(Path(name).read_text(encoding='utf-8'))
              dup=sorted({item for item in parser.ids if parser.ids.count(item)>1})
              if dup: raise SystemExit(f'{name}: duplicate ids {dup}')
              for idx,script in enumerate(parser.scripts,1):
                  (Path('/tmp')/f'{Path(name).stem}-{idx}.js').write_text(script,encoding='utf-8')
          print('HTML parse and ID check PASS')
          PY
          for js in /tmp/index-*.js /tmp/member-*.js /tmp/owner-*.js /tmp/owner-ipad-*.js /tmp/system-check-*.js; do
            [[ -e "$js" ]] || continue
            node --check "$js"
          done

      - name: "5. 公開画面・製品サイト・操作体験シート・Worker最終検査"
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils >/dev/null
          mkdir -p /tmp/school-next-10b

          fetch() {
            local url="$1" out="$2" status
            status="$(curl -sS -L --max-time 45 -A 'Mozilla/5.0 Chrome/150' -H 'Cache-Control: no-cache' -o "$out" -w '%{http_code}' "$url?verify=$GITHUB_RUN_ID-$(date +%s%N)" || true)"
            [[ "$status" == 200 ]] || { echo "::error::$url HTTP $status"; exit 1; }
          }

          fetch "$SCHOOL_BASE_URL/index.html" /tmp/school-next-10b/index.html
          fetch "$SCHOOL_BASE_URL/member.html" /tmp/school-next-10b/member.html
          fetch "$SCHOOL_BASE_URL/owner.html" /tmp/school-next-10b/owner.html
          fetch "$SCHOOL_BASE_URL/owner-ipad.html" /tmp/school-next-10b/ipad.html
          fetch "$SCHOOL_BASE_URL/system-check.html" /tmp/school-next-10b/system-check.html
          fetch "$PRODUCT_URL" /tmp/school-next-10b/product.html
          fetch "$CATALOG_URL" /tmp/school-next-10b/catalog.html
          fetch "$PDF_URL" /tmp/school-next-10b/public.pdf
          fetch "$PNG_URL" /tmp/school-next-10b/public.png

          curl -fsSL --max-time 40 "$SITE_COMPLETION_RAW" -o /tmp/school-next-10b/site-completion.yml
          curl -fsSL --max-time 40 "$QR_REPORT_RAW" -o /tmp/school-next-10b/qr-report.json
          curl -fsSL --max-time 45 "$PDF_RAW" -o /tmp/school-next-10b/raw.pdf
          curl -fsSL --max-time 45 "$PNG_RAW" -o /tmp/school-next-10b/raw.png

          grep -q 'STEP SCHOOL-NEXT-9 / system-check.html' /tmp/school-next-10b/system-check.html
          grep -q 'DPRO NEXT最終一括検査' /tmp/school-next-10b/system-check.html
          grep -q 'STEP SCHOOL-NEXT-10A / DPRO NEXT COMPLETE' /tmp/school-next-10b/product.html
          grep -q '操作体験シートPDF' /tmp/school-next-10b/product.html
          grep -q 'SCHOOL NEXT-10完成' /tmp/school-next-10b/catalog.html
          grep -q 'result: "OK"' /tmp/school-next-10b/site-completion.yml
          grep -q 'public_verify: "PASS"' /tmp/school-next-10b/site-completion.yml
          grep -q 'pdf_pages: 1' /tmp/school-next-10b/site-completion.yml
          grep -q 'qr_codes_checked: 6' /tmp/school-next-10b/site-completion.yml
          grep -q 'qr_result: "PASS"' /tmp/school-next-10b/site-completion.yml

          [[ "$(sha256sum /tmp/school-next-10b/public.pdf | awk '{print $1}')" == "$(sha256sum /tmp/school-next-10b/raw.pdf | awk '{print $1}')" ]] || { echo "::error::公開PDFとリポジトリPDFが一致しません。"; exit 1; }
          [[ "$(sha256sum /tmp/school-next-10b/public.png | awk '{print $1}')" == "$(sha256sum /tmp/school-next-10b/raw.png | awk '{print $1}')" ]] || { echo "::error::公開PNGとリポジトリPNGが一致しません。"; exit 1; }
          [[ "$(pdfinfo /tmp/school-next-10b/public.pdf | awk '/^Pages:/{print $2}')" == 1 ]] || { echo "::error::操作体験シートが1ページではありません。"; exit 1; }

          python3 - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(Path('/tmp/school-next-10b/qr-report.json').read_text(encoding='utf-8'))
          results=report.get('results',{})
          if len(results)!=6: raise SystemExit(f'QR件数が6ではありません: {len(results)}')
          failed=[key for key,item in results.items() if not item.get('pass') or item.get('decoded')!=item.get('expected')]
          if failed: raise SystemExit('QR URL不一致: '+','.join(failed))
          print('QR 6/6 URL match PASS')
          PY

          health_status="$(curl -sS -L --max-time 35 -o /tmp/school-next-10b/health.json -w '%{http_code}' "$WORKER_URL/api/health")"
          [[ "$health_status" == 200 ]] || { echo "::error::Worker health HTTP $health_status"; exit 1; }
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/school-next-10b/health.json',encoding='utf-8'))
          if not data.get('ok'): raise SystemExit('Worker health ok=false')
          print('Worker health PASS')
          PY

          invalid_status="$(curl -sS -L --max-time 35 -o /tmp/school-next-10b/invalid.json -w '%{http_code}' "$WORKER_URL/api/admin/dashboard?shop_code=dpro_school_demo&admin_code=0000")"
          [[ "$invalid_status" == 401 || "$invalid_status" == 403 ]] || { echo "::error::無効管理コードが拒否されませんでした: HTTP $invalid_status"; exit 1; }
          member_status="$(curl -sS -L --max-time 35 -o /tmp/school-next-10b/member-api.json -w '%{http_code}' "$WORKER_URL/api/member/profile?shop_code=dpro_school_demo&phone=090-9999-0000&student_no=SCHOOL-DEMO-999")"
          [[ "$member_status" == 200 ]] || { echo "::error::LINE会員プロフィール HTTP $member_status"; exit 1; }

      - name: "6. COMPLETE完成台帳を生成"
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path('/tmp/school_next_10b_complete.py').write_bytes(base64.b64decode(""))
          PY
          python3 /tmp/school_next_10b_complete.py

      - name: "7. 完成台帳・変更範囲検査"
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true); YAML.load_file(ARGV[1], aliases: true)' "$CURRENT_STEP_FILE" "$FINAL_RECORD"
          grep -q 'current_step: "COMPLETE"' "$CURRENT_STEP_FILE"
          grep -q 'last_completed_step: "SCHOOL-NEXT-10"' "$CURRENT_STEP_FILE"
          grep -q 'final_version: "SCHOOL-NEXT-10-COMPLETE-20260724"' "$CURRENT_STEP_FILE"
          grep -q 'result: "OK"' "$FINAL_RECORD"
          grep -q 'SCHOOL-NEXT-10B: "OK"' "$FINAL_RECORD"
          grep -q 'qr_codes_checked: 6' "$FINAL_RECORD"
          grep -q 'system_check_ok: 32' "$FINAL_RECORD"
          grep -q 'sales_ready: true' "$FINAL_RECORD"
          grep -q 'public_demo_ready: true' "$FINAL_RECORD"
          grep -q 'owner_operation_ready: true' "$FINAL_RECORD"
          mapfile -t changed < <(git diff --name-only)
          for file in "${changed[@]}"; do
            case "$file" in "$CURRENT_STEP_FILE"|"$FINAL_RECORD") ;; *) echo "::error file=$file::想定外の変更です。"; exit 1 ;; esac
          done
          git diff --check

      - name: "8. COMPLETE台帳をCommit・Push"
        if: steps.preflight.outputs.mode == 'apply'
        id: apply
        shell: bash
        run: |
          set -Eeuo pipefail
          git add "$CURRENT_STEP_FILE" "$FINAL_RECORD"
          git commit -m "feat(school-next): mark SCHOOL-NEXT-10 COMPLETE via R1"
          applied_commit="$(git rev-parse HEAD)"
          echo "applied_commit=$applied_commit" >> "$GITHUB_OUTPUT"
          git push origin main

      - name: "9. リポジトリ側COMPLETE反映確認"
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail
          raw_current="https://raw.githubusercontent.com/dpromstk2000-lab/dpro-school-line/main/dpro-next/current-step.yml"
          raw_final="https://raw.githubusercontent.com/dpromstk2000-lab/dpro-school-line/main/dpro-next/school-next-final-completion.yml"
          pass=0
          for attempt in $(seq 1 20); do
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$raw_current?verify=$GITHUB_RUN_ID-$attempt" -o /tmp/current-final.yml || true
            curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$raw_final?verify=$GITHUB_RUN_ID-$attempt" -o /tmp/completion-final.yml || true
            if grep -q 'current_step: "COMPLETE"' /tmp/current-final.yml 2>/dev/null && grep -q 'last_completed_step: "SCHOOL-NEXT-10"' /tmp/current-final.yml 2>/dev/null && grep -q 'final_version: "SCHOOL-NEXT-10-COMPLETE-20260724"' /tmp/completion-final.yml 2>/dev/null && grep -q 'result: "OK"' /tmp/completion-final.yml 2>/dev/null; then
              pass=1; break
            fi
            sleep 3
          done
          [[ "$pass" == 1 ]] || { echo "::error::GitHub側のCOMPLETE反映を確認できませんでした。"; exit 1; }
          [[ "$(git ls-remote origin refs/heads/main | awk '{print $1}')" == "${{ steps.apply.outputs.applied_commit }}" ]] || { echo "::error::main先頭が完成Commitと一致しません。"; exit 1; }

      - name: "10. YML自身削除・最終Commit"
        if: steps.preflight.outputs.mode == 'apply' && success()
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -f "$WORKFLOW_PATH" "$ORIGINAL_WORKFLOW_PATH" "$FAILURE_RECORD"

          stage_optional() {
            local path="$1"
            if [[ -e "$path" ]] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -A -- "$path"
            fi
          }

          stage_optional "$WORKFLOW_PATH"
          stage_optional "$ORIGINAL_WORKFLOW_PATH"
          stage_optional "$FAILURE_RECORD"

          if ! git diff --cached --quiet; then
            git commit -m "chore(school-next): finalize SCHOOL-NEXT-10B-R1 workflow [skip ci]"
            git push origin main
          fi

          {
            echo "## DPRO 学習塾 LINE — COMPLETE"
            echo ""
            echo "- current_step: COMPLETE"
            echo "- final_version: $FINAL_VERSION"
            echo "- 全STEP: OK"
            echo "- system-check: 32 OK / 0注意 / 0NG"
            echo "- 製品サイト: PASS"
            echo "- A4縦1ページ操作体験シート: PASS"
            echo "- QR 6/6 URL一致: PASS"
            echo "- Worker・Supabase・API変更: なし"
            echo "- 販売可能・公開デモ可能・オーナー操作可能"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "11. 失敗時ロールバック・R2台帳"
        if: failure() && steps.preflight.outputs.mode == 'apply'
        shell: bash
        env:
          APPLIED_COMMIT: ${{ steps.apply.outputs.applied_commit }}
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main || true

          if [[ -n "${APPLIED_COMMIT:-}" ]] \
            && git cat-file -e "$APPLIED_COMMIT^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$APPLIED_COMMIT" HEAD; then
            git revert --no-edit "$APPLIED_COMMIT" || true
          fi

          mkdir -p dpro-next
          failed_at="$(TZ=Asia/Tokyo date --iso-8601=seconds)"
          cat > "$FAILURE_RECORD" <<EOF
          step: "SCHOOL-NEXT-10B-R1"
          result: "NG"
          failed_at_jst: "$failed_at"
          rollback_tag: "$BEFORE_TAG"
          applied_commit: "${APPLIED_COMMIT:-none}"
          current_step_after_failure: "SCHOOL-NEXT-10B-R2_REQUIRED"
          worker_changed: false
          supabase_changed: false
          sql_required: false
          api_changed: false
          EOF
          sed -i 's/^          //' "$FAILURE_RECORD"

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          path = Path("dpro-next/current-step.yml")
          text = path.read_text(encoding="utf-8")
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")

          text = re.sub(
              r'^current_step:.*$',
              'current_step: "SCHOOL-NEXT-10B-R2_REQUIRED"',
              text,
              count=1,
              flags=re.M,
          )
          text = re.sub(
              r'^last_result:.*$',
              'last_result: "NG"',
              text,
              count=1,
              flags=re.M,
          )
          if re.search(r'^updated_at_jst:', text, flags=re.M):
              text = re.sub(
                  r'^updated_at_jst:.*$',
                  f'updated_at_jst: "{now}"',
                  text,
                  count=1,
                  flags=re.M,
              )
          else:
              text += f'updated_at_jst: "{now}"\n'

          path.write_text(text, encoding="utf-8", newline="\n")
          PY

          git add -A -- "$CURRENT_STEP_FILE" "$FAILURE_RECORD"
          if ! git diff --cached --quiet; then
            git commit -m "chore(school-next): rollback SCHOOL-NEXT-10B-R1 and record failure"
          fi
          git push origin main || true
