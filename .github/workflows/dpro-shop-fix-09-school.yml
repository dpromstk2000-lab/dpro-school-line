name: "DPRO SHOP Fix 09 SCHOOL"
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/dpro-shop-fix-09-school.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "dpro-shop-fix-09-school"
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify audited source SHA
        shell: bash
        run: |
          set -euo pipefail
          check() {
            path="$1"; expected="$2"
            test -f "$path" || { echo "Missing target: $path"; exit 31; }
            got="$(git hash-object "$path")"
            echo "$path  $got"
            test "$got" = "$expected" || { echo "SOURCE SHA MISMATCH: $path expected=$expected got=$got"; exit 32; }
          }
          check 'owner.html' '0956a31a6ce751cfa4fff1e4c2dbc105c78fe393'
          check 'owner-ipad.html' '19a455eadf2248355c09affd472fd98185f4fb31'

      - name: Apply narrow confirmed fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          
          def read(path):
              return Path(path).read_text(encoding="utf-8")
          
          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")
          
          def replace_once(text, old, new, label):
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 exact match, found {n}")
              return text.replace(old,new,1)
          
          def sub_once(text, pattern, repl, label, flags=0):
              new,n=re.subn(pattern,repl,text,count=1,flags=flags)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 regex match, found {n}")
              return new
          
          p='owner.html'; t=read(p)
          # Guard after demo/fallback check so demo branch is preserved.
          t=replace_once(t,
          '''          if(state.usedFallback || String(item.id).startsWith('demo')) throw new Error('デモ表示中のためAPI更新は行いません。');\n          await adminPost('/api/admin/lessons/status',''',
          '''          if(state.usedFallback || String(item.id).startsWith('demo')) throw new Error('デモ表示中のためAPI更新は行いません。');\n          if(['completed','absent'].includes(status)&&!confirm(`授業状態を「${statusLabel}」へ変更しますか？`))return;\n          await adminPost('/api/admin/lessons/status',''', 'SCHOOL lesson guard')
          # Task/request: place confirmation immediately before request after fallback check.
          t=replace_once(t,
          '''          await adminPost('/api/admin/tasks/status', { task_id:item.id, id:item.id, status:'done', task_status:'done' });''',
          '''          if(!confirm('このタスクを対応済みにしますか？'))return;\n          await adminPost('/api/admin/tasks/status', { task_id:item.id, id:item.id, status:'done', task_status:'done' });''','SCHOOL task guard')
          t=replace_once(t,
          '''          await adminPost('/api/admin/requests/status', { request_id:item.id, id:item.id, status:'replied', request_status:'replied' });''',
          '''          if(!confirm('この受付を対応済みにしますか？'))return;\n          await adminPost('/api/admin/requests/status', { request_id:item.id, id:item.id, status:'replied', request_status:'replied' });''','SCHOOL request guard')
          write(p,t)
          p='owner-ipad.html'; t=read(p)
          # iPad uses double quotes for this endpoint. Guard the exact single request call.
          t=replace_once(t,
          '''await adminPost("/api/admin/requests/status", { request_id:item.id, id:item.id, status:"replied", request_status:"replied" });''',
          '''if(!confirm("この受付を対応済みにしますか？"))return;
          await adminPost("/api/admin/requests/status", { request_id:item.id, id:item.id, status:"replied", request_status:"replied" });''','SCHOOL ipad request guard')
          write(p,t)
          PY

      - name: Validate source diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git diff -- "owner.html" "owner-ipad.html"
          if git diff --quiet -- "owner.html" "owner-ipad.html"; then
            echo "No source change was produced."
            exit 41
          fi

      - name: Commit fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "owner.html" "owner-ipad.html"
          git diff --cached --check
          git commit -m "Fix school terminal-state guards"
          git push origin HEAD:main
