      - name: 8. 完成台帳更新・YML削除・自動Commit
        if: steps.preflight.outputs.mode == 'apply' && success()
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          out = Path("dpro-next")
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")

          current_path = out / "current-step.yml"
          current = current_path.read_text(encoding="utf-8")
          current = re.sub(r'^current_step:.*$', 'current_step: "SCHOOL-NEXT-7"', current, flags=re.M)
          current = re.sub(r'^last_completed_step:.*$', 'last_completed_step: "SCHOOL-NEXT-6"', current, flags=re.M)
          current = re.sub(r'^last_result:.*$', 'last_result: "OK"', current, flags=re.M)
          current = re.sub(r'^updated_at_jst:.*$', f'updated_at_jst: "{now}"', current, flags=re.M)
          current = re.sub(r'^worker_changed:.*$', 'worker_changed: false', current, flags=re.M)
          current = re.sub(r'^supabase_changed:.*$', 'supabase_changed: false', current, flags=re.M)
          current = re.sub(r'^api_changed:.*$', 'api_changed: false', current, flags=re.M)
          current_path.write_text(current, encoding="utf-8")

          record_path = out / "school-next-6-change-record.yml"
          record = record_path.read_text(encoding="utf-8")
          record = record.replace('result: "PUBLIC_VERIFY_PENDING"', 'result: "OK"')
          record += (
              f'completed_at_jst: "{now}"\n'
              f'public_ipad_url: "https://dpromstk2000-lab.github.io/dpro-school-line/owner-ipad.html"\n'
              f'public_member_url: "https://dpromstk2000-lab.github.io/dpro-school-line/member.html"\n'
              f'public_verify: "PASS"\n'
              f'current_step: "SCHOOL-NEXT-7"\n'
              f'last_completed_step: "SCHOOL-NEXT-6"\n'
              f'next_step: "SCHOOL-NEXT-7"\n'
          )
          record_path.write_text(record, encoding="utf-8")
          PY

          rm -f "${WORKFLOW_FILE}"

          stage_path(){
            local path="$1"
            if [ -e "${path}" ] || git ls-files --error-unmatch "${path}" >/dev/null 2>&1; then
              git add -A -- "${path}"
            fi
          }

          stage_path "${CURRENT_STEP_FILE}"
          stage_path "${STATE_DIR}/school-next-6-change-record.yml"
          stage_path "${WORKFLOW_FILE}"

          git commit -m "feat(school-next): complete NEXT-6 field iPad"
          git push origin main

          {
            echo "## SCHOOL-NEXT-6 完了"
            echo ""
            echo "- iPad現場モード: PASS"
            echo "- 管理・準備モード: PASS"
            echo "- member番号修正: PASS"
            echo "- 公開owner-ipad/member: PASS"
            echo "- Worker変更: なし"
            echo "- Supabase変更: なし"
            echo "- API変更: なし"
            echo "- 次のSTEP: SCHOOL-NEXT-7"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 9. 失敗時ロールバック・R1台帳
        if: failure() && steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main || true

          CURRENT_AFTER="$(grep -E '^current_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs || true)"
          LAST_AFTER="$(grep -E '^last_completed_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs || true)"

          if [ "${CURRENT_AFTER}" = "SCHOOL-NEXT-7" ] && [ "${LAST_AFTER}" = "SCHOOL-NEXT-6" ]; then
            echo "::notice::NEXT-6は既に完了しています。台帳を書き戻さず終了します。"
            exit 0
          fi

          if [ -f "${RUNNER_TEMP}/owner-ipad-before-school-next-6.html" ]; then
            cp "${RUNNER_TEMP}/owner-ipad-before-school-next-6.html" owner-ipad.html
          fi
          if [ -f "${RUNNER_TEMP}/member-before-school-next-6.html" ]; then
            cp "${RUNNER_TEMP}/member-before-school-next-6.html" member.html
          fi
          if [ -f "${RUNNER_TEMP}/current-step-before-school-next-6.yml" ]; then
            cp "${RUNNER_TEMP}/current-step-before-school-next-6.yml" "${CURRENT_STEP_FILE}"
          fi

          rm -f "${STATE_DIR}/school-next-6-change-record.yml"

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          out = Path("dpro-next")
          out.mkdir(exist_ok=True)
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds")

          current_path = out / "current-step.yml"
          current = current_path.read_text(encoding="utf-8")
          current = re.sub(r'^current_step:.*$', 'current_step: "SCHOOL-NEXT-6-R1_REQUIRED"', current, flags=re.M)
          current = re.sub(r'^last_completed_step:.*$', 'last_completed_step: "SCHOOL-NEXT-5"', current, flags=re.M)
          current = re.sub(r'^last_result:.*$', 'last_result: "NG"', current, flags=re.M)
          current = re.sub(r'^updated_at_jst:.*$', f'updated_at_jst: "{now}"', current, flags=re.M)
          current_path.write_text(current, encoding="utf-8")

          failure = f'''step: "SCHOOL-NEXT-6"
          result: "NG"
          checked_at_jst: "{now}"
          rollback: "owner-ipad.html・member.html・current-stepを変更前へ復元"
          worker_changed: false
          supabase_changed: false
          api_changed: false
          next_step: "SCHOOL-NEXT-6-R1_REQUIRED"
          '''
          failure = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in failure.splitlines()
          ) + "\n"
          (out / "school-next-6-failure-record.yml").write_text(failure, encoding="utf-8")
          PY

          stage_path(){
            local path="$1"
            if [ -e "${path}" ] || git ls-files --error-unmatch "${path}" >/dev/null 2>&1; then
              git add -A -- "${path}"
            fi
          }

          stage_path owner-ipad.html
          stage_path member.html
          stage_path "${CURRENT_STEP_FILE}"
          stage_path "${STATE_DIR}/school-next-6-change-record.yml"
          stage_path "${STATE_DIR}/school-next-6-failure-record.yml"
          stage_path "${STATE_DIR}/school-next-6-validation.json"

          if ! git diff --cached --quiet; then
            git commit -m "chore(school-next): rollback NEXT-6 and record failure"
            git push origin main
          fi
