name: "STEP SCHOOL-NEXT-6 | iPad・現場スタッフ画面最適化"
run-name: "SCHOOL-NEXT-6 field iPad by ${{ github.actor }}"

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/step-school-next-6-field-ipad.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: school-next-6-field-ipad
  cancel-in-progress: false

env:
  STEP_NAME: SCHOOL-NEXT-6
  WORKFLOW_FILE: .github/workflows/step-school-next-6-field-ipad.yml
  STATE_DIR: dpro-next
  CURRENT_STEP_FILE: dpro-next/current-step.yml
  IPAD_FILE: owner-ipad.html
  MEMBER_FILE: member.html
  EXPECTED_CURRENT_STEP: SCHOOL-NEXT-6
  DUPLICATE_COMPLETED_STEP: SCHOOL-NEXT-7
  NEXT_STEP: SCHOOL-NEXT-7
  BASELINE_TAG: backup-school-next-before-6-20260724
  IPAD_URL: https://dpromstk2000-lab.github.io/dpro-school-line/owner-ipad.html
  MEMBER_URL: https://dpromstk2000-lab.github.io/dpro-school-line/member.html
  API_BASE: https://dpro-school-line-api.dpromstk2000.workers.dev
  EXPECTED_WORKER_VERSION: STEP-SCHOOL-NEXT-1-R1-WORKER-SECURITY-20260723

jobs:
  field-ipad:
    name: iPad・現場スタッフ画面最適化
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. リポジトリ取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 前STEP完了・重複実行防止・変更前保護
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "${GITHUB_REF_NAME}" = "main"
          test -f "${WORKFLOW_FILE}"
          test -f "${IPAD_FILE}"
          test -f "${MEMBER_FILE}"
          test -f config.js
          test -f "${CURRENT_STEP_FILE}"

          CURRENT_STEP="$(grep -E '^current_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs)"
          LAST_COMPLETED="$(grep -E '^last_completed_step:' "${CURRENT_STEP_FILE}" | head -1 | cut -d: -f2- | tr -d '"' | xargs)"

          if [ "${CURRENT_STEP}" = "${DUPLICATE_COMPLETED_STEP}" ] \
            && [ "${LAST_COMPLETED}" = "${STEP_NAME}" ] \
            && grep -q 'STEP SCHOOL-NEXT-6 / owner-ipad.html' "${IPAD_FILE}" \
            && grep -q 'STEP SCHOOL-NEXT-6 / member.html' "${MEMBER_FILE}"; then
            echo "mode=duplicate" >> "${GITHUB_OUTPUT}"
            echo "::notice::SCHOOL-NEXT-6は完了済みです。再アップロードされたYMLだけを削除します。"
            exit 0
          fi

          if [ "${CURRENT_STEP}" != "${EXPECTED_CURRENT_STEP}" ]; then
            echo "::error::current_step=${CURRENT_STEP}, expected=${EXPECTED_CURRENT_STEP}"
            exit 1
          fi

          if [ "${LAST_COMPLETED}" != "SCHOOL-NEXT-5" ]; then
            echo "::error::前STEPが未完了です。last_completed_step=${LAST_COMPLETED}"
            exit 1
          fi

          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true); puts "YAML syntax OK"' "${WORKFLOW_FILE}"

          BEFORE_IPAD_SHA256="$(sha256sum "${IPAD_FILE}" | awk '{print $1}')"
          BEFORE_MEMBER_SHA256="$(sha256sum "${MEMBER_FILE}" | awk '{print $1}')"
          BEFORE_GIT_SHA="$(git rev-parse HEAD)"

          echo "mode=apply" >> "${GITHUB_OUTPUT}"
          echo "before_ipad_sha256=${BEFORE_IPAD_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "before_member_sha256=${BEFORE_MEMBER_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "before_git_sha=${BEFORE_GIT_SHA}" >> "${GITHUB_OUTPUT}"

          cp "${IPAD_FILE}" "${RUNNER_TEMP}/owner-ipad-before-school-next-6.html"
          cp "${MEMBER_FILE}" "${RUNNER_TEMP}/member-before-school-next-6.html"
          cp "${CURRENT_STEP_FILE}" "${RUNNER_TEMP}/current-step-before-school-next-6.yml"

          if git rev-parse "refs/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            echo "::notice::既存バックアップタグを維持: ${BASELINE_TAG}"
          elif git ls-remote --exit-code --tags origin "refs/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${BASELINE_TAG}:refs/tags/${BASELINE_TAG}"
          else
            git tag -a "${BASELINE_TAG}" "${BEFORE_GIT_SHA}" -m "DPRO 学習塾 LINE / SCHOOL-NEXT-6 変更前正常版"
            git push origin "refs/tags/${BASELINE_TAG}"
          fi

      - name: 2B. 完了後に再アップロードされたYMLを整理
        if: steps.preflight.outputs.mode == 'duplicate'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "${WORKFLOW_FILE}"

          stage_path(){
            local path="$1"
            if [ -e "${path}" ] || git ls-files --error-unmatch "${path}" >/dev/null 2>&1; then
              git add -A -- "${path}"
            fi
          }

          stage_path "${WORKFLOW_FILE}"

          if git diff --cached --quiet; then
            echo "::notice::削除対象はありません。"
            exit 0
          fi

          git commit -m "chore(school-next): remove duplicate NEXT-6 workflow upload"
          git push origin main

      - name: 3. iPad現場モード・会員番号表示を最適化
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f"{label}の一致数が1ではありません: {count}")
              return updated

          def insert_before_match(text, pattern, addition, label, flags=0):
              match = re.search(pattern, text, flags)
              if not match:
                  raise RuntimeError(f"{label}の基準位置がありません")
              return text[:match.start()] + addition + text[match.start():]

          # ----------------------------------------------------------
          # owner-ipad.html
          # ----------------------------------------------------------
          ipad_path = Path("owner-ipad.html")
          ipad = ipad_path.read_text(encoding="utf-8")
          original_ipad = ipad

          if "STEP SCHOOL-NEXT-6 / owner-ipad.html" not in ipad:
              required = [
                  "STEP SCHOOL-9-R1 / owner-ipad.html",
                  'id="statsGrid"',
                  'id="lessonList"',
                  'id="requestList"',
                  'id="clearAdminBtn"',
                  'id="messagePreview"',
                  'function renderStats(){',
                  'function renderLessons(){',
                  'function getFilteredRequests(){',
                  'function renderAll(){',
                  'async function updateLessonStatus(item, status){',
                  'async function completeRequest(item){',
                  'function bindEvents(){',
                  'function init(){',
              ]
              missing = [marker for marker in required if marker not in ipad]
              if missing:
                  raise RuntimeError("owner-ipad現行マーカー不足: " + " / ".join(missing))

              ipad = sub_once(
                  ipad,
                  r'<title>DPRO 学習塾・習い事 LINE｜受付・講師iPad画面｜STEP SCHOOL-9-R1</title>',
                  '<title>DPRO 学習塾・習い事 LINE｜受付・講師現場画面｜STEP SCHOOL-NEXT-6</title>',
                  "iPadタイトル",
              )
              ipad = sub_once(
                  ipad,
                  r'<div class="version">STEP SCHOOL-9-R1 / owner-ipad\.html</div>',
                  '<div class="version">STEP SCHOOL-NEXT-6 / owner-ipad.html</div>',
                  "iPadバージョン",
              )
              ipad = sub_once(
                  ipad,
                  r'<div class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-9-R1 / owner-ipad\.html</div>',
                  '<div class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-6 / owner-ipad.html</div>',
                  "iPadフッターバージョン",
              )
              ipad = sub_once(
                  ipad,
                  r'const VERSION = "STEP SCHOOL-9";',
                  'const VERSION = "STEP SCHOOL-NEXT-6";',
                  "iPad JavaScriptバージョン",
              )
              ipad = sub_once(
                  ipad,
                  r'<p class="lead">受付・講師がiPadで使う画面です。.*?</p>',
                  '<p class="lead">受付・講師がiPadで使う現場画面です。通常は授業進行と要返信だけを表示し、管理コード・デモ準備・検索は必要な時だけ管理・準備モードで開きます。</p>',
                  "iPadリード文",
                  re.S,
              )

              css = r'''
          /* SCHOOL-NEXT-6: iPad・現場スタッフ最適化 */
          .field-mode-bar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin:0 0 18px;padding:14px 16px;border:1px solid #c7d2fe;border-radius:18px;background:linear-gradient(135deg,#eef2ff,#ecfdf5);box-shadow:0 12px 28px rgba(15,23,42,.08);}
          .field-mode-copy strong{display:block;font-size:16px;margin-bottom:4px;}
          .field-mode-copy span{display:block;color:#64748b;font-size:12px;font-weight:800;line-height:1.6;}
          .mode-switch{display:flex;gap:8px;flex-wrap:wrap;}
          .mode-btn{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:14px;padding:12px 15px;min-height:48px;font-weight:950;box-shadow:none;}
          .mode-btn.active{background:#0f172a;color:#fff;border-color:#0f172a;}
          .field-quick-board{margin-bottom:18px;padding:16px;border:1px solid #bfdbfe;border-radius:20px;background:linear-gradient(135deg,#eff6ff,#f0fdf4);}
          .field-quick-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px;}
          .field-quick-head strong{display:block;font-size:18px;margin-bottom:4px;}
          .field-quick-head span{display:block;color:#64748b;font-size:12px;font-weight:800;line-height:1.6;}
          .field-quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
          .field-quick-card{appearance:none;text-align:left;border:1px solid #dbe5f2;border-top:4px solid #2563eb;border-radius:16px;background:#fff;color:#0f172a;padding:13px;min-height:105px;box-shadow:none;}
          .field-quick-card[data-field-filter="active"]{border-top-color:#f97316;}
          .field-quick-card[data-field-filter="pending_requests"]{border-top-color:#ef4444;}
          .field-quick-card[data-field-filter="all"]{border-top-color:#10b981;}
          .field-quick-card.active{outline:3px solid rgba(37,99,235,.18);background:#eff6ff;}
          .field-quick-card strong{display:block;font-size:29px;line-height:1;margin-bottom:8px;}
          .field-quick-card b{display:block;font-size:13px;margin-bottom:4px;}
          .field-quick-card small{display:block;color:#64748b;font-size:11px;font-weight:800;line-height:1.5;}
          .field-quick-summary{margin-top:11px;padding:10px 12px;border-radius:13px;background:#fff;border:1px solid #dbe5f2;color:#475569;font-size:12px;font-weight:850;line-height:1.65;}
          .field-dock{position:sticky;bottom:8px;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0 10px;padding:10px;border-radius:18px;background:rgba(15,23,42,.94);box-shadow:0 16px 36px rgba(15,23,42,.25);backdrop-filter:blur(14px);}
          .field-dock .btn{min-height:56px;margin:0;box-shadow:none;}
          body.field-mode .management-only{display:none !important;}
          body.field-mode .grid{grid-template-columns:1.25fr .55fr;}
          body.management-mode .management-only{display:block;}
          .lesson-card.action-busy,.request-card.action-busy{opacity:.72;pointer-events:none;}
          @media(max-width:980px){
          .field-quick-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
          body.field-mode .grid{grid-template-columns:1fr;}
          }
          @media(max-width:680px){
          .field-mode-bar,.field-quick-head{flex-direction:column;}
          .mode-switch,.mode-btn{width:100%;}
          .field-quick-grid{grid-template-columns:1fr 1fr;}
          .field-dock{grid-template-columns:1fr;}
          }

          '''
              ipad = insert_before_match(
                  ipad,
                  r'(?m)^[ \t]*\.quick-board\{',
                  css,
                  "iPad NEXT-6 CSS",
              )

              mode_html = r'''
          <div class="field-mode-bar" id="fieldModeBar">
          <div class="field-mode-copy">
          <strong>画面モード</strong>
          <span>通常は現場モードを使用します。管理コード・デモ準備・生徒検索は管理・準備モードで表示します。</span>
          </div>
          <div class="mode-switch">
          <button class="mode-btn active" id="fieldModeBtn" type="button" aria-pressed="true">現場モード</button>
          <button class="mode-btn" id="managementModeBtn" type="button" aria-pressed="false">管理・準備モード</button>
          </div>
          </div>

          '''
              ipad = sub_once(
                  ipad,
                  r'(</header>\s*)(<main class="grid">)',
                  r'\1' + mode_html + r'\2',
                  "iPadモード切替HTML",
                  re.S,
              )

              quick_html = r'''
          <div class="field-quick-board" id="fieldQuickBoard">
          <div class="field-quick-head">
            <div>
              <strong>今すぐ対応</strong>
              <span>大きなカードを押すと、必要な授業または要返信だけを表示します。</span>
            </div>
            <button class="btn secondary small" id="clearFieldFilterBtn" type="button">全件表示</button>
          </div>
          <div class="field-quick-grid">
            <button class="field-quick-card" type="button" data-field-filter="scheduled" aria-pressed="false">
              <strong id="fieldScheduledCount">0</strong><b>開始前</b><small>予定・来校待ち</small>
            </button>
            <button class="field-quick-card" type="button" data-field-filter="active" aria-pressed="false">
              <strong id="fieldActiveCount">0</strong><b>授業対応中</b><small>出席・授業中</small>
            </button>
            <button class="field-quick-card" type="button" data-field-filter="pending_requests" aria-pressed="false">
              <strong id="fieldPendingCount">0</strong><b>要返信</b><small>欠席・振替・体験</small>
            </button>
            <button class="field-quick-card active" type="button" data-field-filter="all" aria-pressed="true">
              <strong id="fieldAllCount">0</strong><b>全件</b><small>今日の授業と受付</small>
            </button>
          </div>
          <div class="field-quick-summary" id="fieldQuickSummary">画面を更新すると、現場対応件数を表示します。</div>
          </div>

          '''
              ipad = insert_before_match(
                  ipad,
                  r'(?s)<div class="card">\s*<div class="section-title"><span class="num">2</span><h2>本日の授業予定</h2>',
                  quick_html,
                  "iPad今すぐ対応HTML",
              )

              for num, title in [
                  ("A", "管理コード"),
                  ("B", "営業前確認"),
                  ("C", "生徒検索"),
                  ("E", "iPad運用の流れ"),
              ]:
                  pattern = (
                      r'<div class="card">\s*'
                      r'(<div class="section-title"><span class="num">'
                      + re.escape(num)
                      + r'</span><h2>'
                      + re.escape(title)
                      + r'</h2>)'
                  )
                  ipad = sub_once(
                      ipad,
                      pattern,
                      r'<div class="card management-only">\n          \1',
                      f"{title}管理モード化",
                      re.S,
                  )

              dock_html = r'''
          <div class="field-dock" id="fieldDock">
          <button class="btn" id="dockRefreshBtn" type="button">情報を更新</button>
          <button class="btn green" id="dockTodayBtn" type="button">今日の授業</button>
          <button class="btn orange" id="dockPendingBtn" type="button">要返信を表示</button>
          </div>

          '''
              ipad = insert_before_match(
                  ipad,
                  r'(?m)^[ \t]*<div class="footer-note">DPRO 学習塾・習い事 LINE',
                  dock_html,
                  "iPad現場ドック",
              )

              ipad = sub_once(
                  ipad,
                  r'(selectedTab:\s*"pending",\s*\n\s*)(itemMap:\s*new Map\(\),)',
                  r'\1lessonFilter: "all",\n    fieldMode: "field",\n    actionBusy: false,\n    \2',
                  "iPad現場state",
              )

              field_functions = r'''
          function lessonFieldGroup(status){
          const s = String(status || "").toLowerCase();
          if(/checked|出席|in_progress|授業中/.test(s)) return "active";
          if(/completed|done|完了|absent|欠席|cancel|取消/.test(s)) return "closed";
          return "scheduled";
          }
          function getFieldCounts(){
          const lessons = state.dashboard.lessons || [];
          const requests = state.dashboard.requests || [];
          return {
          scheduled:lessons.filter((item) => lessonFieldGroup(item.status) === "scheduled").length,
          active:lessons.filter((item) => lessonFieldGroup(item.status) === "active").length,
          pending:requests.filter((item) => !boolDone(item.status)).length,
          all:lessons.length + requests.length
          };
          }
          function getFieldLessons(){
          const lessons = state.dashboard.lessons || [];
          if(state.lessonFilter === "scheduled") return lessons.filter((item) => lessonFieldGroup(item.status) === "scheduled");
          if(state.lessonFilter === "active") return lessons.filter((item) => lessonFieldGroup(item.status) === "active");
          if(state.lessonFilter === "pending_requests") return [];
          return lessons;
          }
          function renderFieldQuickBoard(){
          const counts = getFieldCounts();
          $("fieldScheduledCount").textContent = String(counts.scheduled);
          $("fieldActiveCount").textContent = String(counts.active);
          $("fieldPendingCount").textContent = String(counts.pending);
          $("fieldAllCount").textContent = String(counts.all);
          document.querySelectorAll("#fieldQuickBoard [data-field-filter]").forEach((button) => {
          const active = button.dataset.fieldFilter === state.lessonFilter;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", active ? "true" : "false");
          });
          const label = {
          scheduled:"開始前",
          active:"授業対応中",
          pending_requests:"要返信",
          all:"全件"
          }[state.lessonFilter] || "全件";
          $("fieldQuickSummary").textContent = `開始前 ${counts.scheduled}件 / 授業対応中 ${counts.active}件 / 要返信 ${counts.pending}件 / 表示：${label}`;
          }
          function setFieldFilter(filter, scrollTarget){
          state.lessonFilter = filter || "all";
          if(state.lessonFilter === "pending_requests") state.selectedTab = "pending";
          renderAll();
          if(scrollTarget){
          const target = $(scrollTarget);
          if(target) target.scrollIntoView({ behavior:"smooth", block:"start" });
          }
          }
          function setFieldMode(mode, persist){
          state.fieldMode = mode === "management" ? "management" : "field";
          document.body.classList.toggle("field-mode", state.fieldMode === "field");
          document.body.classList.toggle("management-mode", state.fieldMode === "management");
          $("fieldModeBtn").classList.toggle("active", state.fieldMode === "field");
          $("managementModeBtn").classList.toggle("active", state.fieldMode === "management");
          $("fieldModeBtn").setAttribute("aria-pressed", state.fieldMode === "field" ? "true" : "false");
          $("managementModeBtn").setAttribute("aria-pressed", state.fieldMode === "management" ? "true" : "false");
          if(persist !== false) localStorage.setItem("dpro_school_ipad_mode", state.fieldMode);
          }
          function setActionBusy(busy){
          state.actionBusy = Boolean(busy);
          document.querySelectorAll("[data-action]").forEach((button) => {
          button.disabled = state.actionBusy;
          });
          document.querySelectorAll(".lesson-card,.request-card").forEach((card) => {
          card.classList.toggle("action-busy", state.actionBusy);
          });
          }
          function syncLessonActionButtons(){
          document.querySelectorAll(".lesson-card").forEach((card) => {
          const current = statusLabel(card.dataset.currentStatus || "");
          card.querySelectorAll('[data-action="lesson-status"]').forEach((button) => {
          button.disabled = current === statusLabel(button.dataset.status || "");
          });
          });
          }

          '''
              ipad = insert_before_match(
                  ipad,
                  r'(?m)^[ \t]*function renderStats\(\)\{',
                  field_functions,
                  "iPad現場関数",
              )

              ipad = sub_once(
                  ipad,
                  r'const items = state\.dashboard\.lessons \|\| \[\];',
                  'const items = getFieldLessons();',
                  "iPad授業絞り込み",
              )
              ipad = sub_once(
                  ipad,
                  r'<div class="lesson-card\$\{cls\}">',
                  '<div class="lesson-card${cls}" data-current-status="${escapeHtml(item.status || "予定")}">',
                  "iPad授業現在状態",
              )
              ipad = sub_once(
                  ipad,
                  r'(<button class="btn green big" data-action="lesson-status" data-status="completed" data-key="\$\{key\}" type="button">完了</button>)',
                  r'\1\n            <button class="btn red big" data-action="lesson-status" data-status="absent" data-key="${key}" type="button">欠席</button>',
                  "iPad欠席ボタン",
              )
              ipad = sub_once(
                  ipad,
                  r'(\}\)\.join\(""\);\s*\n)(\s*\}\s*\n\s*function getFilteredRequests\(\)\{)',
                  r'\1    syncLessonActionButtons();\n\2',
                  "iPad授業ボタン同期",
                  re.S,
              )

              ipad = sub_once(
                  ipad,
                  r'function getFilteredRequests\(\)\{.*?\n\s*\}',
                  '''function getFilteredRequests(){
          const items = state.dashboard.requests || [];
          if(state.lessonFilter === "scheduled" || state.lessonFilter === "active") return [];
          if(state.lessonFilter === "pending_requests") return items.filter((item) => !boolDone(item.status));
          const tab = state.selectedTab;
          if(tab === "pending") return items.filter((item) => !boolDone(item.status));
          if(tab === "absence") return items.filter((item) => isAbsenceType(item.type));
          if(tab === "makeup") return items.filter((item) => isMakeupType(item.type));
          return items;
          }''',
                  "iPad受付絞り込み",
                  re.S,
              )

              ipad = sub_once(
                  ipad,
                  r'function renderAll\(\)\{\s*resetMap\(\);\s*renderStats\(\);',
                  'function renderAll(){\n    resetMap();\n    renderFieldQuickBoard();\n    renderStats();',
                  "iPad現場ボード描画",
                  re.S,
              )

              update_lesson = r'''async function updateLessonStatus(item, status){
          if(state.actionBusy) return;
          const statusName = statusLabel(status);
          setActionBusy(true);
          setStatus("mainStatus", "授業状態を更新しています。", "");
          try{
          if(state.usedFallback || String(item.id).startsWith("demo")){
          item.status = statusName;
          renderAll();
          setStatus("mainStatus", `デモ表示上で「${statusName}」にしました。実データは変更していません。`, "warn");
          return;
          }
          await adminPost("/api/admin/lessons/status", { lesson_id:item.id, id:item.id, status, lesson_status:status });
          setStatus("mainStatus", `授業状態を「${statusName}」に更新しました。`, "ok");
          await loadDashboard();
          } catch(e){
          setStatus("mainStatus", `授業状態を更新できませんでした。データは変更していません：${e.message}`, "err");
          } finally {
          setActionBusy(false);
          }
          }
          '''
              ipad = sub_once(
                  ipad,
                  r'async function updateLessonStatus\(item, status\)\{.*?(?=\s*async function completeRequest\(item\)\{)',
                  update_lesson,
                  "iPad授業更新安全化",
                  re.S,
              )

              complete_request = r'''async function completeRequest(item){
          if(state.actionBusy) return;
          setActionBusy(true);
          setStatus("mainStatus", "受付を対応済みにしています。", "");
          try{
          if(state.usedFallback || String(item.id).startsWith("demo")){
          item.status = "対応済み";
          renderAll();
          setStatus("mainStatus", "デモ表示上で対応済みにしました。実データは変更していません。", "warn");
          return;
          }
          await adminPost("/api/admin/requests/status", { request_id:item.id, id:item.id, status:"replied", request_status:"replied" });
          setStatus("mainStatus", "受付を対応済みにしました。", "ok");
          await loadDashboard();
          } catch(e){
          setStatus("mainStatus", `受付を更新できませんでした。データは変更していません：${e.message}`, "err");
          } finally {
          setActionBusy(false);
          }
          }
          '''
              ipad = sub_once(
                  ipad,
                  r'async function completeRequest\(item\)\{.*?(?=\s*async function searchStudents\(\)\{)',
                  complete_request,
                  "iPad受付更新安全化",
                  re.S,
              )

              events = r'''
          $("fieldModeBtn").addEventListener("click", () => setFieldMode("field"));
          $("managementModeBtn").addEventListener("click", () => setFieldMode("management"));
          $("fieldQuickBoard").addEventListener("click", (e) => {
          const button = e.target.closest("[data-field-filter]");
          if(!button) return;
          const filter = button.dataset.fieldFilter || "all";
          setFieldFilter(filter, filter === "pending_requests" ? "requestList" : "lessonList");
          });
          $("clearFieldFilterBtn").addEventListener("click", () => setFieldFilter("all"));
          $("dockRefreshBtn").addEventListener("click", loadDashboard);
          $("dockTodayBtn").addEventListener("click", () => {
          $("dayInput").value = todayYmd();
          setFieldFilter("all");
          loadDashboard();
          });
          $("dockPendingBtn").addEventListener("click", () => setFieldFilter("pending_requests", "requestList"));
          '''
              ipad = sub_once(
                  ipad,
                  r'function bindEvents\(\)\{\s*',
                  'function bindEvents(){\n' + events,
                  "iPad現場イベント",
                  re.S,
              )

              ipad = sub_once(
                  ipad,
                  r'(const saved = localStorage\.getItem\("dpro_school_admin_code"\) \|\| "";\s*\n\s*\$\("adminCodeInput"\)\.value = saved;)',
                  r'\1\n    const savedMode = localStorage.getItem("dpro_school_ipad_mode") || "field";\n    setFieldMode(savedMode, false);',
                  "iPad初期モード",
                  re.S,
              )

              if ipad == original_ipad:
                  raise RuntimeError("owner-ipad.htmlに変更がありません")
              ipad_path.write_text(ipad, encoding="utf-8", newline="\n")

          # ----------------------------------------------------------
          # member.html：前STEPで残った見出し番号重複を修正
          # ----------------------------------------------------------
          member_path = Path("member.html")
          member = member_path.read_text(encoding="utf-8")
          original_member = member

          if "STEP SCHOOL-NEXT-6 / member.html" not in member:
              required_member = [
                  "STEP SCHOOL-NEXT-5 / member.html",
                  "教室確認・連絡状況",
                  '<span class="num">2</span><h2>生徒情報</h2>',
                  '<span class="num">3</span><h2>次回授業・授業予定</h2>',
                  '<span class="num">4</span><h2>欠席・振替依頼状況</h2>',
              ]
              missing = [marker for marker in required_member if marker not in member]
              if missing:
                  raise RuntimeError("member現行マーカー不足: " + " / ".join(missing))

              member = sub_once(
                  member,
                  r'<div class="version">STEP SCHOOL-NEXT-5 / member\.html</div>',
                  '<div class="version">STEP SCHOOL-NEXT-6 / member.html</div>',
                  "memberバージョン",
              )
              member = sub_once(
                  member,
                  r'<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-5 / member\.html</p>',
                  '<p class="footer-note">DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-6 / member.html</p>',
                  "memberフッターバージョン",
              )
              member = sub_once(
                  member,
                  r'const VERSION = [\'"]STEP SCHOOL-NEXT-5[\'"];',
                  'const VERSION = "STEP SCHOOL-NEXT-6";',
                  "member JavaScriptバージョン",
              )
              member = sub_once(
                  member,
                  r'<span class="num">2</span><h2>生徒情報</h2>',
                  '<span class="num">3</span><h2>生徒情報</h2>',
                  "member生徒情報番号",
              )
              member = sub_once(
                  member,
                  r'<span class="num">3</span><h2>次回授業・授業予定</h2>',
                  '<span class="num">4</span><h2>次回授業・授業予定</h2>',
                  "member授業予定番号",
              )
              member = sub_once(
                  member,
                  r'<span class="num">4</span><h2>欠席・振替依頼状況</h2>',
                  '<span class="num">5</span><h2>欠席・振替依頼状況</h2>',
                  "member依頼状況番号",
              )

              if member == original_member:
                  raise RuntimeError("member.htmlに変更がありません")
              member_path.write_text(member, encoding="utf-8", newline="\n")

          print("SCHOOL-NEXT-6 patch complete")
          PY

      - name: 4. HTML・JavaScript・ID・現場操作検査
        if: steps.preflight.outputs.mode == 'apply'
        id: validate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${STATE_DIR}"

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from datetime import datetime, timezone, timedelta
          import hashlib
          import json
          import os
          import re
          import subprocess

          files = {
              "ipad": {
                  "before": Path(os.environ["RUNNER_TEMP"]) / "owner-ipad-before-school-next-6.html",
                  "after": Path("owner-ipad.html"),
              },
              "member": {
                  "before": Path(os.environ["RUNNER_TEMP"]) / "member-before-school-next-6.html",
                  "after": Path("member.html"),
              },
          }
          results = []

          def add(key, label, status, detail, blocking=False):
              results.append({
                  "key": key,
                  "label": label,
                  "status": status,
                  "detail": detail,
                  "blocking": bool(blocking and status == "NG"),
              })

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
                  self.scripts = []
                  self.in_script = False
                  self.external = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if data.get("id"):
                      self.ids.append(data["id"])
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = bool(data.get("src"))
                      self.parts = []

              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external:
                          self.scripts.append("".join(self.parts))
                      self.in_script = False
                      self.external = False
                      self.parts = []

          payload_files = {}
          for name, paths in files.items():
              before_text = paths["before"].read_text(encoding="utf-8")
              after_text = paths["after"].read_text(encoding="utf-8")
              bp = Inspector()
              ap = Inspector()
              bp.feed(before_text)
              bp.close()
              ap.feed(after_text)
              ap.close()

              missing_ids = sorted(set(bp.ids) - set(ap.ids))
              duplicates = sorted({value for value in ap.ids if ap.ids.count(value) > 1})
              add(
                  f"{name}_existing_ids",
                  f"{name}既存HTML ID維持",
                  "NG" if missing_ids else "OK",
                  "削除: " + ", ".join(missing_ids) if missing_ids else f"既存ID {len(set(bp.ids))}件を維持",
                  bool(missing_ids),
              )
              add(
                  f"{name}_duplicate_ids",
                  f"{name} HTML ID重複",
                  "NG" if duplicates else "OK",
                  "重複: " + ", ".join(duplicates) if duplicates else f"ID {len(ap.ids)}件、重複なし",
                  bool(duplicates),
              )

              script_errors = []
              for index, script in enumerate(ap.scripts, 1):
                  if not script.strip():
                      continue
                  temp = Path("dpro-next") / f".school-next-6-{name}-{index}.js"
                  temp.write_text(script, encoding="utf-8")
                  proc = subprocess.run(["node", "--check", str(temp)], capture_output=True, text=True)
                  temp.unlink(missing_ok=True)
                  if proc.returncode:
                      script_errors.append((proc.stderr or proc.stdout)[-1800:])
              add(
                  f"{name}_javascript",
                  f"{name} JavaScript構文",
                  "NG" if script_errors else "OK",
                  " / ".join(script_errors) if script_errors else f"インラインscript {len(ap.scripts)}件 PASS",
                  bool(script_errors),
              )

              api_pattern = re.compile(r'["\'](/api/[a-zA-Z0-9_./-]+)["\']')
              before_api = sorted(set(api_pattern.findall(before_text)))
              after_api = sorted(set(api_pattern.findall(after_text)))
              api_changed = before_api != after_api
              add(
                  f"{name}_api",
                  f"{name}既存API維持",
                  "NG" if api_changed else "OK",
                  f"before={before_api} / after={after_api}" if api_changed else f"既存API {len(after_api)}件、追加・削除なし",
                  api_changed,
              )

              before_fetch = before_text.count("fetch(")
              after_fetch = after_text.count("fetch(")
              fetch_changed = before_fetch != after_fetch
              add(
                  f"{name}_network",
                  f"{name}追加通信なし",
                  "NG" if fetch_changed else "OK",
                  f"before={before_fetch}, after={after_fetch}" if fetch_changed else f"fetch呼出数 {after_fetch}を維持",
                  fetch_changed,
              )

              payload_files[name] = {
                  "before_sha256": hashlib.sha256(paths["before"].read_bytes()).hexdigest(),
                  "after_sha256": hashlib.sha256(paths["after"].read_bytes()).hexdigest(),
                  "bytes": paths["after"].stat().st_size,
              }

          ipad_text = files["ipad"]["after"].read_text(encoding="utf-8")
          member_text = files["member"]["after"].read_text(encoding="utf-8")

          ipad_markers = [
              '<div class="version">STEP SCHOOL-NEXT-6 / owner-ipad.html</div>',
              'const VERSION = "STEP SCHOOL-NEXT-6";',
              'id="fieldModeBar"',
              'id="fieldModeBtn"',
              'id="managementModeBtn"',
              'id="fieldQuickBoard"',
              'id="fieldScheduledCount"',
              'id="fieldActiveCount"',
              'id="fieldPendingCount"',
              'id="fieldAllCount"',
              'id="fieldDock"',
              'id="dockRefreshBtn"',
              'id="dockTodayBtn"',
              'id="dockPendingBtn"',
              'data-status="absent"',
              'function renderFieldQuickBoard(){',
              'function setFieldMode(mode, persist){',
              'function setActionBusy(busy){',
              'function syncLessonActionButtons(){',
              'データは変更していません',
              'class="card management-only"',
              'id="clearAdminBtn"',
          ]
          missing_ipad = [marker for marker in ipad_markers if marker not in ipad_text]
          add(
              "ipad_features",
              "iPad現場最適化機能",
              "NG" if missing_ipad else "OK",
              "不足: " + " / ".join(missing_ipad) if missing_ipad else f"必須マーカー {len(ipad_markers)}件",
              bool(missing_ipad),
          )

          member_markers = [
              '<div class="version">STEP SCHOOL-NEXT-6 / member.html</div>',
              '<span class="num">2</span><h2>教室確認・連絡状況</h2>',
              '<span class="num">3</span><h2>生徒情報</h2>',
              '<span class="num">4</span><h2>次回授業・授業予定</h2>',
              '<span class="num">5</span><h2>欠席・振替依頼状況</h2>',
          ]
          missing_member = [marker for marker in member_markers if marker not in member_text]
          add(
              "member_numbers",
              "member見出し番号",
              "NG" if missing_member else "OK",
              "不足: " + " / ".join(missing_member) if missing_member else "2・3・4・5へ連番化",
              bool(missing_member),
          )

          staff_exists = Path("staff.html").exists()
          add(
              "staff_auth",
              "スタッフ専用ページ安全判断",
              "NG" if staff_exists else "OK",
              "専用認証なしのstaff.htmlは作成せず、iPad現場モードを採用" if not staff_exists else "想定外のstaff.htmlを検出",
              staff_exists,
          )

          false_success = (
              '画面上では「${statusName}」にしました。API更新確認' in ipad_text
              or '画面上では対応済みにしました。API更新確認' in ipad_text
          )
          add(
              "false_success_guard",
              "API失敗時の誤成功表示防止",
              "NG" if false_success else "OK",
              "実API失敗時はデータを変更せずエラー表示" if not false_success else "旧誤成功処理が残っています",
              false_success,
          )

          changed = subprocess.run(
              ["git", "diff", "--name-only"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout.splitlines()
          unexpected_files = [
              name for name in changed
              if name not in ["owner-ipad.html", "member.html"]
          ]
          add(
              "scope",
              "対象ファイル限定",
              "NG" if unexpected_files else "OK",
              "意図しない変更: " + ", ".join(unexpected_files) if unexpected_files else "本体変更はowner-ipad.html・member.htmlのみ",
              bool(unexpected_files),
          )

          add("worker", "Worker変更", "OK", "変更なし")
          add("supabase", "Supabase変更", "OK", "変更なし・SQL不要")
          add("staff_page", "staff.html追加", "OK", "追加なし")
          add("automatic_line", "一括自動LINE配信", "OK", "追加なし")

          counts = {
              status: sum(1 for row in results if row["status"] == status)
              for status in ["OK", "注意", "NG"]
          }
          blocking = sum(1 for row in results if row["blocking"])
          payload = {
              "step": "SCHOOL-NEXT-6",
              "checked_at_jst": datetime.now(timezone(timedelta(hours=9))).isoformat(timespec="seconds"),
              "files": payload_files,
              "counts": counts,
              "blocking_ng": blocking,
              "results": results,
          }
          Path("dpro-next/school-next-6-validation.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"ipad_after_sha256={payload_files['ipad']['after_sha256']}\n")
              fh.write(f"member_after_sha256={payload_files['member']['after_sha256']}\n")
              fh.write(f"ok_count={counts['OK']}\n")
              fh.write(f"warning_count={counts['注意']}\n")
              fh.write(f"ng_count={counts['NG']}\n")

          if blocking:
              raise SystemExit(f"blocking NG: {blocking}")
          PY

      - name: 5. Worker・Supabase接続確認
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail

          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36"
          HEALTH="${RUNNER_TEMP}/school-next-6-health.json"

          STATUS="$(curl -sS -L --retry 2 --max-time 25 \
            -A "${UA}" \
            -H "Accept: application/json,text/plain,*/*" \
            -H "Cache-Control: no-cache" \
            -o "${HEALTH}" -w '%{http_code}' \
            "${API_BASE}/api/health?next_check=school-next-6-${GITHUB_RUN_ID}")"

          if [ "${STATUS}" != "200" ]; then
            echo "::error::Worker health HTTP ${STATUS}"
            cat "${HEALTH}" || true
            exit 1
          fi

          python3 - "${HEALTH}" "${EXPECTED_WORKER_VERSION}" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = sys.argv[2]
          if data.get("version") != expected:
              raise SystemExit(f"Worker version mismatch: {data.get('version')} != {expected}")
          if data.get("db_ok") is not True:
              raise SystemExit("db_ok is not true")
          print("Worker / Supabase OK")
          PY

      - name: 6. NEXT-6を仮Commit・Push
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        env:
          BEFORE_IPAD_SHA256: ${{ steps.preflight.outputs.before_ipad_sha256 }}
          BEFORE_MEMBER_SHA256: ${{ steps.preflight.outputs.before_member_sha256 }}
          BEFORE_GIT_SHA: ${{ steps.preflight.outputs.before_git_sha }}
          IPAD_AFTER_SHA256: ${{ steps.validate.outputs.ipad_after_sha256 }}
