              -o "${MEMBER_PAGE}" -w '%{http_code}' \
              "${MEMBER_URL}?next_check=school-next-6-${GITHUB_RUN_ID}-${attempt}")" || MEMBER_STATUS="000"

            if [ "${IPAD_STATUS}" = "200" ] \
              && [ "${MEMBER_STATUS}" = "200" ] \
              && grep -q 'STEP SCHOOL-NEXT-6 / owner-ipad.html' "${IPAD_PAGE}" \
              && grep -q 'id="fieldModeBar"' "${IPAD_PAGE}" \
              && grep -q 'id="fieldQuickBoard"' "${IPAD_PAGE}" \
              && grep -q 'id="fieldDock"' "${IPAD_PAGE}" \
              && grep -q 'STEP SCHOOL-NEXT-6 / member.html' "${MEMBER_PAGE}" \
              && grep -q '<span class="num">5</span><h2>欠席・振替依頼状況</h2>' "${MEMBER_PAGE}"; then
