# DPRO SCHOOL R3 LIVE QA WORKFLOW FIX V1.3 / 2026-08-29
name: SCHOOL Tutorial R3 LIVE QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/school-r3-live-qa.yml"

permissions:
  contents: write

concurrency:
  group: school-tutorial-r3-live-qa
  cancel-in-progress: false

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_BASE: https://dpromstk2000-lab.github.io/dpro-school-line/
      WORKFLOW_PATH: .github/workflows/school-r3-live-qa.yml
      QA_RESULT: tutorial-qa/school-r3-live-qa.json
      EXPECTED_CONFIG_SHA256: 603acb4bd0b5f180834256d518c2b5a08d7af99af8ade5ed2e87c51d04908383
      EXPECTED_JS_SHA256: ad26289a9274937806c25d2f7612dcbd4c04290a3f5688101b8f32b9411cd434
      EXPECTED_CSS_SHA256: 68bf0b4095a6561197423ad74f89584bac1ae4810a96ab89a543bbb4ecc2b7e5
      EXPECTED_OWNER_IPAD_SHA256: 9366615e72e3bf4d2bbcbdc7dd14b320ca0ef09c2cf74931333ec349aa5332dd
    steps:
      - name: Checkout newest SCHOOL main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R3 implementation payload
        shell: bash
        run: |
          set -euo pipefail
          test -s config.js
          test -s dpro-tutorial-school-v1.js
          test -s dpro-tutorial-school-v1.css
          test -s owner-ipad.html
          test "$(sha256sum config.js | awk '{print $1}')" = "$EXPECTED_CONFIG_SHA256"
          test "$(sha256sum dpro-tutorial-school-v1.js | awk '{print $1}')" = "$EXPECTED_JS_SHA256"
          test "$(sha256sum dpro-tutorial-school-v1.css | awk '{print $1}')" = "$EXPECTED_CSS_SHA256"
          test "$(sha256sum owner-ipad.html | awk '{print $1}')" = "$EXPECTED_OWNER_IPAD_SHA256"
          test "$(grep -o "key:'school.first10" dpro-tutorial-school-v1.js | wc -l)" -eq 10
          ! grep -Eq '\bfetch\s*\(' dpro-tutorial-school-v1.js
          ! grep -Eq '\.click\s*\(' dpro-tutorial-school-v1.js
          grep -q 'DPRO TUTORIAL / SCHOOL / STANDARD V1.1 / R3 loader' config.js
          grep -q 'DPRO TUTORIAL SCHOOL / STANDARD V1.1 / R3 FIX V1.1' dpro-tutorial-school-v1.js
          grep -q 'DPRO TUTORIAL R3 / 320px overflow containment' owner-ipad.html
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/qa-upload-head.txt
          printf '%s\n' "$(git log -1 --format=%H -- config.js dpro-tutorial-school-v1.js dpro-tutorial-school-v1.css owner-ipad.html)" > /tmp/r3-implementation-head.txt

      - name: Wait for GitHub Pages R3 assets
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            cb="qa=$(date +%s)-$i"
            if curl -fsS -o /tmp/school-r3-config.js "${PUBLIC_BASE}config.js?${cb}" \
              && curl -fsS -o /tmp/school-r3-tutorial.js "${PUBLIC_BASE}dpro-tutorial-school-v1.js?${cb}" \
              && curl -fsS -o /tmp/school-r3-tutorial.css "${PUBLIC_BASE}dpro-tutorial-school-v1.css?${cb}" \
              && grep -q 'DPRO TUTORIAL / SCHOOL / STANDARD V1.1 / R3 loader' /tmp/school-r3-config.js \
              && grep -q "TUTORIAL_ID='school-first10-v1'" /tmp/school-r3-tutorial.js \
              && curl -fsS -o /tmp/school-r3-owner-ipad.html "${PUBLIC_BASE}owner-ipad.html?${cb}" \
              && grep -q 'DPRO TUTORIAL SCHOOL / STANDARD V1.1 / R3' /tmp/school-r3-tutorial.css \
              && grep -q 'DPRO TUTORIAL R3 / 320px overflow containment' /tmp/school-r3-owner-ipad.html; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1

      - name: Setup Node and Chromium
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run exact-width R3 LIVE QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutorial-qa
          rm -f "$QA_RESULT"
          cat > ./school-r3-live-qa.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base = process.env.PUBLIC_BASE;
          const resultPath = process.env.QA_RESULT;
          const viewports = [
            {name:'1440', width:1440, height:1000, input:'mouse'},
            {name:'1024', width:1024, height:768, input:'pointer'},
            {name:'390', width:390, height:844, input:'touch-pointer'},
            {name:'320', width:320, height:720, input:'touch-pointer'}
          ];
          const result = {
            schema:'DPRO_TUTORIAL_SCHOOL_R3_LIVE_QA_V1_0',
            publicBase:base,
            qaUploadHead:fs.readFileSync('/tmp/qa-upload-head.txt','utf8').trim(),
            r3ImplementationHead:fs.readFileSync('/tmp/r3-implementation-head.txt','utf8').trim(),
            exactViewports:viewports,
            first10Expected:10,
            widths:[],
            unsafeWrites:[],
            failures:[],
            businessMutation:0,
            standard:'V1.1_LOCKED'
          };
          const browser = await chromium.launch({headless:true});

          function fail(vp, message){ result.failures.push(`${vp}: ${message}`); }
          async function waitRuntime(page){
            await page.waitForFunction(() => window.DPRO_TUTORIAL_SCHOOL && window.DPRO_TUTORIAL_SCHOOL.first10Count === 10, null, {timeout:15000});
          }
          async function pageMetrics(page){
            return page.evaluate(() => ({
              href:location.href,
              innerWidth:window.innerWidth,
              innerHeight:window.innerHeight,
              documentScrollWidth:document.documentElement.scrollWidth,
              bodyScrollWidth:document.body.scrollWidth,
              first10Count:window.DPRO_TUTORIAL_SCHOOL?.first10Count ?? null
            }));
          }
          async function stepInfo(page){
            return page.evaluate(() => {
              const api=window.DPRO_TUTORIAL_SCHOOL;
              const card=document.querySelector('[data-dpro-tutorial-card]');
              const hi=document.querySelector('[data-dpro-tutorial-highlight]');
              const title=document.querySelector('[data-dpro-tutorial-title]')?.textContent?.trim()||'';
              const cr=card?.getBoundingClientRect();
              const hr=hi?.getBoundingClientRect();
              const hs=hi?getComputedStyle(hi):null;
              return {
                title,
                status:api?.status?.()||null,
                card:cr?{left:cr.left,top:cr.top,right:cr.right,bottom:cr.bottom,width:cr.width,height:cr.height,hidden:card.hidden}:null,
                highlight:hr?{left:hr.left,top:hr.top,right:hr.right,bottom:hr.bottom,width:hr.width,height:hr.height,display:hs.display}:null,
                activeAction:document.activeElement?.getAttribute?.('data-dpro-tutorial-action')||null,
                activeTag:document.activeElement?.tagName||null
              };
            });
          }
          function inViewport(rect, width, height){
            if(!rect)return false;
            const left=rect.left ?? rect.x;
            const top=rect.top ?? rect.y;
            const right=rect.right ?? (left + rect.width);
            const bottom=rect.bottom ?? (top + rect.height);
            return left >= -1 && top >= -1 && right <= width + 1 && bottom <= height + 1;
          }
          async function assertStep(page, vp, expectedStep, bucket){
            const info=await stepInfo(page);
            const st=info.status;
            if(!st || st.first10Count!==10) fail(vp,`First10 count at step ${expectedStep}`);
            const actual=st?.state?.currentStepKey||'';
            if(actual!==`school.first10.${String(expectedStep).padStart(2,'0')}`) fail(vp,`step ${expectedStep} key mismatch: ${actual}`);
            if(!st?.currentTargetSelector) fail(vp,`step ${expectedStep} target did not resolve`);
            if(!inViewport(info.card, bucket.viewport.width, bucket.viewport.height)) fail(vp,`step ${expectedStep} card unreachable`);
            if(!info.highlight || info.highlight.display==='none' || info.highlight.width<=0 || info.highlight.height<=0) fail(vp,`step ${expectedStep} highlight missing`);
            bucket.steps.push({step:expectedStep,title:info.title,target:st?.currentTargetSelector,card:info.card,highlight:info.highlight});
            return info;
          }
          async function dragQA(page, spec, bucket){
            const handle=page.locator('[data-dpro-tutorial-drag-handle]');
            const card=page.locator('[data-dpro-tutorial-card]');
            const body=page.locator('[data-dpro-tutorial-purpose]');
            const hb=await handle.boundingBox();
            if(!hb){fail(spec.name,'drag handle missing');return;}
            const before=await card.boundingBox();
            if(spec.input==='touch-pointer'){
              const x=hb.x+hb.width/2, y=hb.y+hb.height/2;
              await handle.dispatchEvent('pointerdown',{pointerId:41,pointerType:'touch',isPrimary:true,button:0,buttons:1,clientX:x,clientY:y});
              await page.locator('body').dispatchEvent('pointermove',{pointerId:41,pointerType:'touch',isPrimary:true,button:0,buttons:1,clientX:20,clientY:20});
              await page.locator('body').dispatchEvent('pointerup',{pointerId:41,pointerType:'touch',isPrimary:true,button:0,buttons:0,clientX:20,clientY:20});
            } else {
              await page.mouse.move(hb.x+hb.width/2,hb.y+hb.height/2);
              await page.mouse.down();
              await page.mouse.move(Math.max(5,hb.x-120),Math.max(5,hb.y-120),{steps:4});
              await page.mouse.up();
            }
            const after=await card.boundingBox();
            if(!after || (Math.abs(after.x-before.x)<2 && Math.abs(after.y-before.y)<2)) fail(spec.name,`${spec.input} handle drag did not move card`);
            if(!inViewport(after,spec.width,spec.height)) fail(spec.name,'card outside viewport after handle drag');

            const bodyBox=await body.boundingBox();
            if(bodyBox){
              const pos0=await card.boundingBox();
              const x=bodyBox.x+Math.min(20,bodyBox.width/2), y=bodyBox.y+Math.min(20,bodyBox.height/2);
              await body.dispatchEvent('pointerdown',{pointerId:52,pointerType:'mouse',isPrimary:true,button:0,buttons:1,clientX:x,clientY:y});
              await page.locator('body').dispatchEvent('pointermove',{pointerId:52,pointerType:'mouse',isPrimary:true,buttons:1,clientX:x-80,clientY:y-80});
              await page.locator('body').dispatchEvent('pointerup',{pointerId:52,pointerType:'mouse',isPrimary:true,buttons:0,clientX:x-80,clientY:y-80});
              const pos1=await card.boundingBox();
              if(pos0&&pos1&&(Math.abs(pos1.x-pos0.x)>1||Math.abs(pos1.y-pos0.y)>1)) fail(spec.name,'card body incorrectly started drag; handle-only violated');
            }

            const hb2=await handle.boundingBox();
            if(hb2){
              await handle.dispatchEvent('pointerdown',{pointerId:63,pointerType:'touch',isPrimary:true,button:0,buttons:1,clientX:hb2.x+5,clientY:hb2.y+5});
              await page.locator('body').dispatchEvent('pointermove',{pointerId:63,pointerType:'touch',isPrimary:true,buttons:1,clientX:spec.width+900,clientY:spec.height+900});
              await page.locator('body').dispatchEvent('pointerup',{pointerId:63,pointerType:'touch',isPrimary:true,buttons:0,clientX:spec.width+900,clientY:spec.height+900});
              const clamp=await card.boundingBox();
              if(!inViewport(clamp,spec.width,spec.height)) fail(spec.name,'viewport clamp failed');
              bucket.drag={input:spec.input,before,after,clamped:clamp,handleOnly:true};
            }
          }
          async function routeMetrics(page, bucket, label){
            const m=await pageMetrics(page);bucket.routes[label]=m;
            if(m.innerWidth!==bucket.viewport.width) fail(bucket.viewport.name,`${label} innerWidth ${m.innerWidth}`);
            if(m.documentScrollWidth>m.innerWidth) fail(bucket.viewport.name,`${label} document overflow ${m.documentScrollWidth-m.innerWidth}`);
            if(m.bodyScrollWidth>m.innerWidth) fail(bucket.viewport.name,`${label} body overflow ${m.bodyScrollWidth-m.innerWidth}`);
          }
          async function nextButton(page){return page.locator('[data-dpro-tutorial-action="next"],[data-dpro-tutorial-action="complete"]').first();}
          async function runPointerJourney(spec){
            const bucket={viewport:spec,steps:[],routes:{},drag:null,resume:{},crossPage:{},replay:{},pageErrors:[],consoleErrors:[],network:[]};
            result.widths.push(bucket);
            const context=await browser.newContext({viewport:{width:spec.width,height:spec.height},hasTouch:spec.input==='touch-pointer'});
            await context.route('**/*',async route=>{
              const req=route.request();const method=req.method();bucket.network.push({method,url:req.url(),type:req.resourceType()});
              if(['POST','PUT','PATCH','DELETE'].includes(method)){result.unsafeWrites.push({viewport:spec.name,method,url:req.url()});return route.abort('blockedbyclient');}
              return route.continue();
            });
            const page=await context.newPage();
            page.on('pageerror',e=>bucket.pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')bucket.consoleErrors.push(m.text());});
            await page.goto(`${base}index.html?qa=r3-${spec.name}-${Date.now()}`,{waitUntil:'domcontentloaded'});await waitRuntime(page);await routeMetrics(page,bucket,'index');
            if((await page.locator('[data-dpro-tutorial-start]').textContent())?.trim()!=='操作ガイドを開始') fail(spec.name,'fresh Start label missing');
            await page.locator('[data-dpro-tutorial-start]').click();await assertStep(page,spec.name,1,bucket);await dragQA(page,spec,bucket);

            await page.locator('[data-dpro-tutorial-action="close"]').click();
            if((await page.locator('[data-dpro-tutorial-start]').textContent())?.trim()!=='Resume') fail(spec.name,'Close -> Resume missing');
            await page.locator('[data-dpro-tutorial-start]').click();await assertStep(page,spec.name,1,bucket);bucket.resume.close=true;

            await (await nextButton(page)).click();await assertStep(page,spec.name,2,bucket);
            await page.keyboard.press('Escape');
            if((await page.locator('[data-dpro-tutorial-start]').textContent())?.trim()!=='Resume') fail(spec.name,'Esc -> Resume missing');
            await page.locator('[data-dpro-tutorial-start]').click();await assertStep(page,spec.name,2,bucket);bucket.resume.esc=true;

            await page.locator('[data-dpro-tutorial-action="skip"]').click();
            if((await page.locator('[data-dpro-tutorial-start]').textContent())?.trim()!=='Replay') fail(spec.name,'Skip -> Replay missing');
            await page.locator('[data-dpro-tutorial-start]').click();await assertStep(page,spec.name,1,bucket);bucket.replay.afterSkip=true;

            await (await nextButton(page)).click();await assertStep(page,spec.name,2,bucket);
            await (await nextButton(page)).click();await assertStep(page,spec.name,3,bucket);
            await (await nextButton(page)).click();await assertStep(page,spec.name,4,bucket);
            await Promise.all([page.waitForURL(/member\.html/), (await nextButton(page)).click()]);await waitRuntime(page);await routeMetrics(page,bucket,'member');await assertStep(page,spec.name,5,bucket);bucket.crossPage.indexToMember=true;

            await page.locator('[data-dpro-tutorial-action="close"]').click();await page.reload({waitUntil:'domcontentloaded'});await waitRuntime(page);
            if((await page.locator('[data-dpro-tutorial-start]').textContent())?.trim()!=='Resume') fail(spec.name,'reload + Resume label missing');
            await page.locator('[data-dpro-tutorial-start]').click();await assertStep(page,spec.name,5,bucket);bucket.resume.reload=true;

            await (await nextButton(page)).click();await assertStep(page,spec.name,6,bucket);
            await (await nextButton(page)).click();await assertStep(page,spec.name,7,bucket);
            await Promise.all([page.waitForURL(/owner-ipad\.html/), (await nextButton(page)).click()]);await waitRuntime(page);await routeMetrics(page,bucket,'ownerIpad');await assertStep(page,spec.name,8,bucket);bucket.crossPage.memberToOwner=true;
            await (await nextButton(page)).click();await assertStep(page,spec.name,9,bucket);
            await (await nextButton(page)).click();await assertStep(page,spec.name,10,bucket);
            await page.locator('[data-dpro-tutorial-action="complete"]').click();
            if((await page.locator('[data-dpro-tutorial-start]').textContent())?.trim()!=='Replay') fail(spec.name,'Complete -> Replay missing');
            await Promise.all([page.waitForURL(/index\.html/), page.locator('[data-dpro-tutorial-start]').click()]);await waitRuntime(page);await assertStep(page,spec.name,1,bucket);bucket.replay.afterComplete=true;

            if(bucket.pageErrors.length) fail(spec.name,`pageerror ${bucket.pageErrors.join(' | ')}`);
            if(bucket.consoleErrors.length) fail(spec.name,`console error ${bucket.consoleErrors.join(' | ')}`);
            await context.close();
          }
          async function tabToAction(page,wanted){
            for(let i=0;i<12;i++){
              await page.keyboard.press('Tab');
              const a=await page.evaluate(()=>document.activeElement?.getAttribute?.('data-dpro-tutorial-action')||'');
              if(a===wanted)return true;
            }
            return false;
          }
          async function runKeyboardJourney(spec,bucket){
            const context=await browser.newContext({viewport:{width:spec.width,height:spec.height}});
            await context.route('**/*',async route=>{const m=route.request().method();if(['POST','PUT','PATCH','DELETE'].includes(m)){result.unsafeWrites.push({viewport:`${spec.name}-keyboard`,method:m,url:route.request().url()});return route.abort('blockedbyclient');}return route.continue();});
            const page=await context.newPage();await page.goto(`${base}index.html?qa=keyboard-${spec.name}-${Date.now()}`,{waitUntil:'domcontentloaded'});await waitRuntime(page);
            await page.locator('[data-dpro-tutorial-start]').focus();await page.keyboard.press('Enter');await assertStep(page,`${spec.name}-keyboard`,1,{viewport:spec,steps:[]});
            await page.waitForFunction(()=>document.activeElement?.hasAttribute?.('data-dpro-tutorial-title'));
            let focusVisible=false;
            for(let step=1;step<=10;step++){
              const wanted=step===10?'complete':'next';
              const found=await tabToAction(page,wanted);if(!found){fail(`${spec.name}-keyboard`,`cannot tab to ${wanted} at step ${step}`);break;}
              const focus=await page.evaluate(()=>{const e=document.activeElement,s=getComputedStyle(e);return {outlineStyle:s.outlineStyle,outlineWidth:s.outlineWidth};});
              if(focus.outlineStyle!=='none'&&focus.outlineWidth!=='0px')focusVisible=true;
              if(step===4){await Promise.all([page.waitForURL(/member\.html/),page.keyboard.press('Enter')]);await waitRuntime(page);}
              else if(step===7){await Promise.all([page.waitForURL(/owner-ipad\.html/),page.keyboard.press('Enter')]);await waitRuntime(page);}
              else {await page.keyboard.press('Enter');}
              if(step<10){
                await page.waitForFunction(k=>window.DPRO_TUTORIAL_SCHOOL?.readState?.().currentStepKey===k,`school.first10.${String(step+1).padStart(2,'0')}`);
                await page.waitForFunction(()=>document.activeElement?.hasAttribute?.('data-dpro-tutorial-title'));
              }
            }
            if(!focusVisible)fail(`${spec.name}-keyboard`,'visible focus not proven');
            const final=await page.evaluate(()=>window.DPRO_TUTORIAL_SCHOOL?.readState?.());
            if(!final?.complete)fail(`${spec.name}-keyboard`,'keyboard-only completion did not reach complete');
            bucket.keyboard={complete:!!final?.complete,focusVisible};
            await context.close();
          }

          for(const spec of viewports){
            await runPointerJourney(spec);
            const bucket=result.widths.find(x=>x.viewport.name===spec.name);
            await runKeyboardJourney(spec,bucket);
          }
          await browser.close();
          if(result.unsafeWrites.length){result.businessMutation=result.unsafeWrites.length;result.failures.push(`unsafe write count ${result.unsafeWrites.length}`);}
          result.pass=result.failures.length===0 && result.unsafeWrites.length===0;
          result.completedAt=new Date().toISOString();
          fs.writeFileSync(resultPath,JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          NODE
          node ./school-r3-live-qa.mjs

      - name: Commit QA evidence and remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$QA_RESULT")"
          test -s "$QA_RESULT" || printf '%s\n' '{"schema":"DPRO_TUTORIAL_SCHOOL_R3_LIVE_QA_V1_0","pass":false,"failures":["QA result file missing"],"businessMutation":0}' > "$QA_RESULT"
          pass=$(node -e "const r=require('./$QA_RESULT');process.stdout.write(r.pass?'true':'false')")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f ./school-r3-live-qa.mjs
          rm -f "$WORKFLOW_PATH"
          git add "$QA_RESULT" "$WORKFLOW_PATH"
          git commit -m "Record SCHOOL R3 LIVE QA and remove temporary workflow [skip ci]" || true
          git push origin HEAD:main
          test "$pass" = "true"
