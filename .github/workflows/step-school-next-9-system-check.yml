name: "STEP SCHOOL-NEXT-9 | 性能・セキュリティ・system-check"
run-name: "SCHOOL-NEXT-9 final system check by ${{ github.actor }}"

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/step-school-next-9-system-check.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: school-next-9-system-check
  cancel-in-progress: false

env:
  STEP_NAME: SCHOOL-NEXT-9
  WORKFLOW_FILE: .github/workflows/step-school-next-9-system-check.yml
  STATE_DIR: dpro-next
  CURRENT_STEP_FILE: dpro-next/current-step.yml
  EXPECTED_CURRENT_STEP: SCHOOL-NEXT-9
  NEXT_STEP: SCHOOL-NEXT-10
  BASELINE_TAG: backup-school-next-before-9-20260724
  PAGES_BASE: https://dpromstk2000-lab.github.io/dpro-school-line
  API_BASE: https://dpro-school-line-api.dpromstk2000.workers.dev
  SHOP_CODE: dpro_school_demo
  DEMO_ADMIN_CODE: "1234"
  DEMO_PHONE: 090-9999-0000
  DEMO_PHONE_PLAIN: "09099990000"
  DEMO_STUDENT_NO: SCHOOL-DEMO-999
  EXPECTED_WORKER_VERSION: STEP-SCHOOL-NEXT-1-R1-WORKER-SECURITY-20260723

jobs:
  final-system-check:
    name: 性能・セキュリティ・system-check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 1. リポジトリ取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 前STEP完了・変更前保護
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in system-check.html config.js index.html member.html owner.html owner-ipad.html "${CURRENT_STEP_FILE}" "${WORKFLOW_FILE}"; do test -f "$f"; done
          current="$(grep '^current_step:' "${CURRENT_STEP_FILE}" | cut -d: -f2- | tr -d '"' | xargs)"
          completed="$(grep '^last_completed_step:' "${CURRENT_STEP_FILE}" | cut -d: -f2- | tr -d '"' | xargs)"
          if [ "$current" = "SCHOOL-NEXT-10" ] && [ "$completed" = "SCHOOL-NEXT-9" ]; then
            echo "mode=duplicate" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          [ "$current" = "${EXPECTED_CURRENT_STEP}" ] || { echo "::error::current_step=$current"; exit 1; }
          [ "$completed" = "SCHOOL-NEXT-8" ] || { echo "::error::last_completed_step=$completed"; exit 1; }
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true)' "${WORKFLOW_FILE}"
          echo "mode=apply" >> "${GITHUB_OUTPUT}"
          echo "before_system=$(sha256sum system-check.html | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          echo "before_config=$(sha256sum config.js | awk '{print $1}')" >> "${GITHUB_OUTPUT}"
          echo "before_commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          cp system-check.html "${RUNNER_TEMP}/system-check-before-next9.html"
          cp config.js "${RUNNER_TEMP}/config-before-next9.js"
          cp "${CURRENT_STEP_FILE}" "${RUNNER_TEMP}/current-step-before-next9.yml"
          if ! git rev-parse "refs/tags/${BASELINE_TAG}" >/dev/null 2>&1 && ! git ls-remote --exit-code --tags origin "refs/tags/${BASELINE_TAG}" >/dev/null 2>&1; then
            git tag -a "${BASELINE_TAG}" -m "DPRO 学習塾 LINE / SCHOOL-NEXT-9 変更前正常版"
            git push origin "refs/tags/${BASELINE_TAG}"
          fi

      - name: 2B. 完了後の重複YML削除
        if: steps.preflight.outputs.mode == 'duplicate'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "${WORKFLOW_FILE}"
          git add -A -- "${WORKFLOW_FILE}"
          git diff --cached --quiet && exit 0
          git commit -m "chore(school-next): remove duplicate NEXT-9 workflow upload"
          git push origin main

      - name: 3. system-check最終強化
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import re

          def one(text, old, new, label, flags=0):
              out,n=re.subn(old,new,text,count=1,flags=flags)
              if n!=1: raise RuntimeError(f'{label}: {n}')
              return out
          def before(text, pattern, addition, label, flags=0):
              m=re.search(pattern,text,flags)
              if not m: raise RuntimeError(label)
              return text[:m.start()]+addition+text[m.start():]

          cpath=Path('config.js'); c=cpath.read_text(encoding='utf-8')
          if 'version: "STEP SCHOOL-NEXT-9"' not in c:
              c=one(c,r'// STEP SCHOOL-4','// STEP SCHOOL-NEXT-9','config comment')
              c=one(c,r'version: "STEP SCHOOL-4"','version: "STEP SCHOOL-NEXT-9"','config version')
              audit='''  nextAudit: {\n    expectedWorkerVersion: "STEP-SCHOOL-NEXT-1-R1-WORKER-SECURITY-20260723",\n    fileSizeWarnBytes: 240000,\n    loadWarnMs: 2500,\n    expectedPageMarkers: {\n      system: "STEP SCHOOL-NEXT-9 / system-check.html",\n      index: "STEP SCHOOL-NEXT-7 / index.html",\n      member: "STEP SCHOOL-NEXT-8 / member.html",\n      owner: "STEP SCHOOL-NEXT-8 / owner.html",\n      ipad: "STEP SCHOOL-NEXT-6 / owner-ipad.html"\n    }\n  },\n\n'''
              c=before(c,r'(?m)^\s*endpoints: \{',audit,'config audit settings')
              cpath.write_text(c,encoding='utf-8',newline='\n')

          p=Path('system-check.html'); s=p.read_text(encoding='utf-8')
          if 'STEP SCHOOL-NEXT-9 / system-check.html' not in s:
              required=['STEP SCHOOL-11 / system-check.html',"const VERSION = 'STEP SCHOOL-11';",'async function runAll(){','function updateJudgement(){','function init(){']
              miss=[x for x in required if x not in s]
              if miss: raise RuntimeError('system markers: '+','.join(miss))
              s=one(s,r'<title>.*?</title>','<title>DPRO 学習塾・習い事 LINE｜DPRO NEXT最終一括検査</title>','title')
              s=one(s,r'<span class="badge">STEP SCHOOL-11 / system-check\.html</span>','<span class="badge">STEP SCHOOL-NEXT-9 / system-check.html</span>','badge')
              s=one(s,r'<h1>DPRO 学習塾・習い事 LINE<br>営業前デモ確認画面</h1>','<h1>DPRO 学習塾・習い事 LINE<br>DPRO NEXT最終一括検査</h1>','h1')
              s=one(s,r'<p class="lead">.*?</p>','<p class="lead">Worker・Supabase・主要API・全公開画面・構文・ID重複・容量・読込時間・管理コード拒否・公開情報混入・電話正規化・過去日時・重複防止・業務ロジックをOK・注意・NGでまとめて確認します。</p>','lead')
              s=s.replace('DPRO 学習塾・習い事 LINE / STEP SCHOOL-11 / system-check.html','DPRO 学習塾・習い事 LINE / STEP SCHOOL-NEXT-9 / system-check.html')
              s=s.replace("const VERSION = 'STEP SCHOOL-11';","const VERSION = 'STEP SCHOOL-NEXT-9';")
              css='''\n    .audit-card{border-color:#c7d2fe;background:linear-gradient(135deg,#eef2ff,#ecfdf5)}\n    .audit-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.audit-metric{background:#fff;border:1px solid #dbe6f1;border-radius:16px;padding:14px}.audit-metric strong{display:block;font-size:29px}.audit-metric span{font-size:12px;font-weight:900;color:#64748b}\n    .audit-list{display:grid;gap:10px;margin-top:14px}.audit-row{display:grid;grid-template-columns:80px 1fr;gap:12px;background:#fff;border:1px solid #dbe6f1;border-radius:14px;padding:12px}.audit-status{border-radius:999px;padding:6px 9px;font-size:12px;font-weight:950;text-align:center}.audit-status.OK{background:#dcfce7;color:#047857}.audit-status.注意{background:#ffedd5;color:#c2410c}.audit-status.NG{background:#fee2e2;color:#b91c1c}.audit-detail{color:#64748b;font-size:12px;font-weight:750;line-height:1.65}.audit-summary{margin-top:12px;padding:12px;border-radius:14px;background:#fff;border:1px solid #dbe6f1;font-weight:850}\n'''
              s=before(s,r'(?m)^\s*@media\(max-width:900px\)',css,'audit css')
              html='''\n        <section class="card audit-card" id="finalAuditCard">\n          <div class="section-title"><span class="num">2</span><h2>DPRO NEXT最終自動検査</h2></div>\n          <p class="note">公開HTML本文と主要APIだけを取得し、OK・注意・NGで判定します。全画像・全データは取得しません。</p>\n          <div class="audit-metrics"><div class="audit-metric"><span>検査</span><strong id="auditTotal">0</strong></div><div class="audit-metric"><span>OK</span><strong id="auditOk">0</strong></div><div class="audit-metric"><span>注意</span><strong id="auditAttention">0</strong></div><div class="audit-metric"><span>NG</span><strong id="auditNg">0</strong></div></div>\n          <div class="btns"><button class="btn primary" id="btnFinalAudit">最終自動検査を実行</button><button class="btn green" id="btnCopyAudit">検査結果コピー</button><button class="btn danger" id="btnClearAudit">結果クリア</button></div>\n          <div id="auditSummary" class="audit-summary">まだ実行していません。</div><div id="auditList" class="audit-list"></div>\n        </section>\n\n'''
              s=before(s,r'(?s)<section class="card">\s*<div class="section-title"><span class="num">2</span><h2>全画面導線確認</h2>',html,'audit html')
              s=s.replace('<span class="num">2</span><h2>全画面導線確認</h2>','<span class="num">3</span><h2>全画面導線確認</h2>',1)
              s=s.replace('<span class="num">3</span><h2>手動チェックリスト</h2>','<span class="num">4</span><h2>手動チェックリスト</h2>',1)
              s=s.replace('<span class="num">4</span><h2>API取得結果</h2>','<span class="num">5</span><h2>API取得結果</h2>',1)
              s=one(s,r'(<div id="toast" class="toast">コピーしました</div>\s*)(<script>)',r'\1<script src="./config.js"></script>\n  \2','config script',re.S)
              defaults='''const SHARED_CONFIG = window.DPRO_SCHOOL_CONFIG || {};\n    const AUDIT_CONFIG = SHARED_CONFIG.nextAudit || {};\n    const DEFAULTS = {\n      apiBaseUrl: SHARED_CONFIG.apiBaseUrl || 'https://dpro-school-line-api.dpromstk2000.workers.dev',\n      pagesBaseUrl: SHARED_CONFIG.pagesBaseUrl || 'https://dpromstk2000-lab.github.io/dpro-school-line/',\n      shopCode: SHARED_CONFIG.shopCode || 'dpro_school_demo',\n      adminCode: '1234', demoPhone:'090-9999-0000', demoPhonePlain:'09099990000', demoStudentNo:'SCHOOL-DEMO-999',\n      expectedWorkerVersion: AUDIT_CONFIG.expectedWorkerVersion || 'STEP-SCHOOL-NEXT-1-R1-WORKER-SECURITY-20260723',\n      fileSizeWarnBytes:Number(AUDIT_CONFIG.fileSizeWarnBytes || 240000), loadWarnMs:Number(AUDIT_CONFIG.loadWarnMs || 2500),\n      expectedPageMarkers:AUDIT_CONFIG.expectedPageMarkers || {system:'STEP SCHOOL-NEXT-9 / system-check.html',index:'STEP SCHOOL-NEXT-7 / index.html',member:'STEP SCHOOL-NEXT-8 / member.html',owner:'STEP SCHOOL-NEXT-8 / owner.html',ipad:'STEP SCHOOL-NEXT-6 / owner-ipad.html'}\n    };'''
              s=one(s,r'const DEFAULTS = \{.*?\n\s*\};(?=\s*\n\s*const LS = \{)',defaults,'defaults',re.S)
              s=s.replace("checklist:'dpro_school_step11_checklist'","checklist:'dpro_school_next9_checklist', audit:'dpro_school_next9_audit'")
              s=s.replace('let last = {health:null,dashboard:null,day:null,search:null,prepare:null};','let last = {health:null,dashboard:null,day:null,search:null,prepare:null,audit:[]};')
              urls='''function updateUrls(){\n      $('openSystem').href=withCache('system-check.html','school-next-9'); $('openIndex').href=withCache('index.html','school-next-7'); $('openMember').href=withCache('member.html','school-next-8'); $('openOwner').href=withCache('owner.html','school-next-8'); $('openIpad').href=withCache('owner-ipad.html','school-next-6');\n    }'''
              s=one(s,r'function updateUrls\(\)\{.*?\n\s*\}',urls,'urls',re.S)
              funcs=r'''
          const AUDIT_PAGES=[['system','system-check.html'],['index','index.html'],['member','member.html'],['owner','owner.html'],['ipad','owner-ipad.html']];
          function ae(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
          function ac(){return {total:last.audit.length,ok:last.audit.filter(x=>x.status==='OK').length,attention:last.audit.filter(x=>x.status==='注意').length,ng:last.audit.filter(x=>x.status==='NG').length}}
          function ar(key,label,status,detail){const row={key,label,status,detail:String(detail||'')};const i=last.audit.findIndex(x=>x.key===key);if(i>=0)last.audit[i]=row;else last.audit.push(row);renderAudit()}
          function renderAudit(){const c=ac();$('auditTotal').textContent=c.total;$('auditOk').textContent=c.ok;$('auditAttention').textContent=c.attention;$('auditNg').textContent=c.ng;$('auditList').innerHTML=last.audit.map(x=>`<div class="audit-row"><span class="audit-status ${x.status}">${ae(x.status)}</span><div><b>${ae(x.label)}</b><div class="audit-detail">${ae(x.detail)}</div></div></div>`).join('');$('auditSummary').textContent=c.total?`検査 ${c.total} / OK ${c.ok} / 注意 ${c.attention} / NG ${c.ng}`:'まだ実行していません。';updateJudgement()}
          function auditText(){const c=ac();return ['DPRO 学習塾 LINE / SCHOOL-NEXT-9 最終検査',`OK ${c.ok} / 注意 ${c.attention} / NG ${c.ng}`,'',...last.audit.map(x=>`[${x.status}] ${x.label}\n${x.detail}`)].join('\n')}
          async function timedText(target){const t=performance.now(),r=await fetch(target,{cache:'no-store'}),text=await r.text();return {ok:r.ok,status:r.status,text,ms:Math.round(performance.now()-t),bytes:new Blob([text]).size}}
          async function timedJson(target,opts={}){const x=await timedTextWithOptions(target,opts);let data={};try{data=JSON.parse(x.text)}catch(e){data={raw:x.text}}return {...x,data}}
          async function timedTextWithOptions(target,opts){const t=performance.now(),r=await fetch(target,{...opts,cache:'no-store'}),text=await r.text();return {ok:r.ok,status:r.status,text,ms:Math.round(performance.now()-t),bytes:new Blob([text]).size}}
          function inspectPage(key,file,result){const marker=DEFAULTS.expectedPageMarkers[key];ar(`page-${key}`,`${file} 公開・表記`,result.ok&&result.text.includes(marker)?'OK':'NG',`HTTP ${result.status} / ${result.ms}ms / ${result.bytes}bytes`);ar(`time-${key}`,`${file} 読込時間`,result.ms>DEFAULTS.loadWarnMs?'注意':'OK',`${result.ms}ms`);ar(`size-${key}`,`${file} 容量`,result.bytes>DEFAULTS.fileSizeWarnBytes?'注意':'OK',`${result.bytes}bytes`);const d=new DOMParser().parseFromString(result.text,'text/html'),ids=[...d.querySelectorAll('[id]')].map(n=>n.id),dup=[...new Set(ids.filter((id,i)=>ids.indexOf(id)!==i))];ar(`ids-${key}`,`${file} ID重複`,dup.length?'NG':'OK',dup.length?dup.join(', '):`ID ${ids.length}件`);let js=[];[...d.querySelectorAll('script:not([src])')].forEach((x,i)=>{try{new Function(x.textContent)}catch(e){js.push(`script${i+1}:${e.message}`)}});ar(`js-${key}`,`${file} JavaScript`,js.length?'NG':'OK',js.join(' / ')||'構文PASS');if(key==='index'||key==='member'){const leak=/(X-Admin-Code|\/api\/admin\/|admin_code\s*[:=]|service_role)/i.test(result.text);ar(`leak-${key}`,`${file} 管理情報混入`,leak?'NG':'OK',leak?'管理文字列を検出':'混入なし')}}
          async function runFinalAudit(){if($('btnFinalAudit').disabled)return;$('btnFinalAudit').disabled=true;last.audit=[];renderAudit();try{const h=await timedJson(url('/api/health'));ar('worker','Worker',h.ok?'OK':'NG',`HTTP ${h.status} / ${h.data.worker_version||h.data.version||''}`);ar('db','Supabase',h.data.db_ok===true?'OK':'NG',`db_ok=${h.data.db_ok}`)}catch(e){ar('worker','Worker','NG',e.message)}
          if(adminCode()){const good=await timedJson(url('/api/admin/dashboard',{shop_code:shopCode(),admin_code:adminCode()}));ar('admin-good','管理コード認証',good.ok?'OK':'NG',`HTTP ${good.status}`);const bad=await timedJson(url('/api/admin/dashboard',{shop_code:shopCode(),admin_code:'NEXT9-INVALID'}));ar('admin-bad','無効な管理コード拒否',[400,401,403].includes(bad.status)?'OK':'NG',`HTTP ${bad.status}`);for(const q of [DEFAULTS.demoPhone,DEFAULTS.demoPhonePlain]){const x=await timedJson(url('/api/admin/search',{shop_code:shopCode(),admin_code:adminCode(),q}));ar(`phone-${q}`,'電話番号正規化検索',x.ok?'OK':'NG',`${q} / HTTP ${x.status}`)}}else{ar('admin-good','管理コード認証','NG','管理コード未入力')}
          for(const [key,file] of AUDIT_PAGES){try{inspectPage(key,file,await timedText(withCache(file,`next9-${Date.now()}`)))}catch(e){ar(`page-${key}`,`${file} 公開・表記`,'NG',e.message)}}
          try{const c=await timedText(withCache('config.js',`next9-${Date.now()}`));new Function(c.text);ar('config','config.js','OK',`${c.ms}ms / ${c.bytes}bytes`);ar('phone-code','電話番号正規化実装',c.text.includes('startsWith("+81")')&&c.text.includes('replace(/[^\\d]/g')?'OK':'NG','+81→0・数字以外除去')}catch(e){ar('config','config.js','NG',e.message)}
          const index=(await timedText(withCache('index.html','next9-static'))).text,member=(await timedText(withCache('member.html','next9-static'))).text,owner=(await timedText(withCache('owner.html','next9-static'))).text,ipad=(await timedText(withCache('owner-ipad.html','next9-static'))).text;ar('past','過去日時登録防止',/guardDateInput|過去の日付|date\s*<\s*today/i.test(index)?'OK':'NG','index.html静的確認');ar('duplicate','重複送信防止',/sending|isSubmitting|disabled\s*=\s*true|二重/i.test(index)?'OK':'注意','静的確認・必要なら実機連続タップ');ar('business','主要業務ロジック',index.includes('repeatNotice')&&member.includes('historySection')&&member.includes('memberNextActionSection')&&owner.includes('followupCard')&&ipad.includes('fieldModeBar')?'OK':'NG','前回と同じ・履歴・次アクション・フォロー・現場モード');ar('demo','DEMOデータ準備',last.prepare?'OK':'注意',last.prepare?'準備済み':'まとめて確認で準備してください');$('btnFinalAudit').disabled=false;renderAudit()}
          '''
              s=before(s,r'(?m)^\s*async function runAll\(\)\{',funcs,'audit functions')
              s=one(s,r'(await searchDemo\(DEFAULTS\.demoPhone\);\s*\n)(\s*\})',r'\1          await runFinalAudit();\n\2','run all audit')
              checklist='''const checklistItems = [\n      ['system','system-check.html が SCHOOL-NEXT-9 表示','最終自動検査と結果コピー'],\n      ['index','体験・欠席・振替','過去日・30分単位・前回と同じ'],\n      ['member','生徒証・次にすること・履歴','デモ生徒で確認'],\n      ['owner','今日やること・進捗・フォロー','文面コピーと個別確認'],\n      ['ipad','現場モード・出席・授業中・完了・欠席','管理準備モード切替'],\n      ['responsive','PC・iPad・スマホ最終目視','文字切れ・横はみ出し・重なりなし'],\n      ['security','管理コード拒否・公開情報混入','最終自動検査NGなし'],\n      ['final','販売・公開デモ可能','空画面・英語状態・見切れなし']\n    ];'''
              s=one(s,r'const checklistItems = \[.*?\n\s*\];',checklist,'checklist',re.S)
              judgement='''function updateJudgement(){const done=checklistProgress(),c=ac();if(c.total&&c.ng===0&&done>=checklistItems.length)setStatus('okJudgement',c.attention?`SCHOOL-NEXT-9 許容注意 ${c.attention}件。最終目視後に完了可能です。`:'SCHOOL-NEXT-9 OKです。','ok');else if(c.ng)setStatus('okJudgement',`NG ${c.ng}件を修正してください。`,'ng');else setStatus('okJudgement',`最終自動検査と手動チェック ${done}/${checklistItems.length} を進めてください。`,'warn')}'''
              s=one(s,r'function updateJudgement\(\)\{.*?\n\s*\}',judgement,'judgement',re.S)
              s=s.replace('DPRO 学習塾・習い事 LINE / STEP SCHOOL-11 チェック結果','DPRO 学習塾・習い事 LINE / SCHOOL-NEXT-9 チェック結果')
              s=one(s,r"(\$\('btnRunAll'\)\.onclick=runAll;\s*\n)",r"\1      $('btnFinalAudit').onclick=runFinalAudit;\n      $('btnCopyAudit').onclick=()=>copyText(auditText());\n      $('btnClearAudit').onclick=()=>{last.audit=[];renderAudit();showToast('結果をクリアしました')};\n",'handlers')
              s=one(s,r'(renderChecklist\(\);\s*\n)',r'\1      renderAudit();\n','render audit')
              p.write_text(s,encoding='utf-8',newline='\n')
          print('SCHOOL-NEXT-9 patch complete')
          PY2

      - name: 4. 全ファイル静的検査
        if: steps.preflight.outputs.mode == 'apply'
        id: validate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${STATE_DIR}"
          python3 - <<'PY2'
          from pathlib import Path
          from html.parser import HTMLParser
          from datetime import datetime,timezone,timedelta
          import hashlib,json,os,re,subprocess
          files=['system-check.html','index.html','member.html','owner.html','owner-ipad.html']; results=[]
          def add(k,l,s,d,block=False): results.append({'key':k,'label':l,'status':s,'detail':d,'blocking':bool(block and s=='NG')})
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=True);self.ids=[];self.scripts=[];self.ins=False;self.ext=False;self.buf=[]
              def handle_starttag(self,t,a):
                  d=dict(a);self.ids.append(d['id']) if d.get('id') else None
                  if t=='script': self.ins=True;self.ext=bool(d.get('src'));self.buf=[]
              def handle_data(self,d):
                  if self.ins and not self.ext:self.buf.append(d)
              def handle_endtag(self,t):
                  if t=='script' and self.ins:
