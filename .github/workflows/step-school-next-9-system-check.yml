      - name: 7. GitHub Pages公開・性能記録
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/next9-pages"
          pass=0
          for i in $(seq 1 24); do
            smeta="$(curl -sS -L --max-time 30 -o "${RUNNER_TEMP}/next9-pages/system.html" -w '%{http_code}|%{time_total}|%{size_download}' "${PAGES_BASE}/system-check.html?next9=${GITHUB_RUN_ID}-$i")" || smeta='000|0|0'
            cmeta="$(curl -sS -L --max-time 30 -o "${RUNNER_TEMP}/next9-pages/config.js" -w '%{http_code}|%{time_total}|%{size_download}' "${PAGES_BASE}/config.js?next9=${GITHUB_RUN_ID}-$i")" || cmeta='000|0|0'
            if [[ "$smeta" == 200\|* ]] && [[ "$cmeta" == 200\|* ]] && grep -q 'STEP SCHOOL-NEXT-9 / system-check.html' "${RUNNER_TEMP}/next9-pages/system.html" && grep -q 'id="finalAuditCard"' "${RUNNER_TEMP}/next9-pages/system.html" && grep -q 'version: "STEP SCHOOL-NEXT-9"' "${RUNNER_TEMP}/next9-pages/config.js"; then pass=1;break;fi
            sleep 5
          done
          [ "$pass" = 1 ] || { echo '::error::Pages反映なし';exit 1; }
          export smeta cmeta
          python3 - <<'PY2'
          from pathlib import Path
          from datetime import datetime,timezone,timedelta
          import json,os,subprocess
          rows=[]
          for n,raw in [('system-check.html',os.environ['smeta']),('config.js',os.environ['cmeta'])]:
              st,t,b=raw.split('|');rows.append({'file':n,'http_status':int(st),'time_seconds':float(t),'bytes':float(b),'status':'注意' if float(t)>2.5 or float(b)>240000 else 'OK'})
          for n in ['index.html','member.html','owner.html','owner-ipad.html']:
              r=subprocess.run(['curl','-sS','-L','--max-time','30','-o','/dev/null','-w','%{http_code}|%{time_total}|%{size_download}',f'https://dpromstk2000-lab.github.io/dpro-school-line/{n}?next9=1'],capture_output=True,text=True);st,t,b=(r.stdout.strip() or '000|0|0').split('|');rows.append({'file':n,'http_status':int(st),'time_seconds':float(t),'bytes':float(b),'status':'NG' if int(st)!=200 else ('注意' if float(t)>2.5 or float(b)>240000 else 'OK')})
          Path('dpro-next/school-next-9-public-performance.json').write_text(json.dumps({'step':'SCHOOL-NEXT-9','checked_at_jst':datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds'),'results':rows},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if any(x['status']=='NG' for x in rows):raise SystemExit('public page NG')
          PY2
          git add "${STATE_DIR}/school-next-9-public-performance.json"
          git commit -m "chore(school-next): record NEXT-9 public performance"
          git push origin main

