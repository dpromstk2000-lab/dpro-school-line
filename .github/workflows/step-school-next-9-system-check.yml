      - name: 5. Worker・主要API・無効コード拒否検査
        if: steps.preflight.outputs.mode == 'apply'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${STATE_DIR}" "${RUNNER_TEMP}/next9-api"
          meta(){ curl -sS -L --retry 2 --max-time 30 -o "$2" -w '%{http_code}|%{time_total}|%{size_download}' "$1"; }
          H="$(meta "${API_BASE}/api/health?next9=${GITHUB_RUN_ID}" "${RUNNER_TEMP}/next9-api/health.json")"
          P="$(curl -sS -L --retry 2 --max-time 30 -X POST -H 'Content-Type: application/json' --data "{\"shop_code\":\"${SHOP_CODE}\",\"admin_code\":\"${DEMO_ADMIN_CODE}\"}" -o "${RUNNER_TEMP}/next9-api/prepare.json" -w '%{http_code}|%{time_total}|%{size_download}' "${API_BASE}/api/admin/demo/prepare")"
          D="$(meta "${API_BASE}/api/admin/dashboard?shop_code=${SHOP_CODE}&admin_code=${DEMO_ADMIN_CODE}" "${RUNNER_TEMP}/next9-api/dashboard.json")"
          I="$(meta "${API_BASE}/api/admin/dashboard?shop_code=${SHOP_CODE}&admin_code=NEXT9-INVALID" "${RUNNER_TEMP}/next9-api/invalid.json")"
          S1="$(meta "${API_BASE}/api/admin/search?shop_code=${SHOP_CODE}&admin_code=${DEMO_ADMIN_CODE}&q=${DEMO_PHONE}" "${RUNNER_TEMP}/next9-api/search1.json")"
          S2="$(meta "${API_BASE}/api/admin/search?shop_code=${SHOP_CODE}&admin_code=${DEMO_ADMIN_CODE}&q=${DEMO_PHONE_PLAIN}" "${RUNNER_TEMP}/next9-api/search2.json")"
          M="$(meta "${API_BASE}/api/member/profile?shop_code=${SHOP_CODE}&phone=${DEMO_PHONE}&student_no=${DEMO_STUDENT_NO}" "${RUNNER_TEMP}/next9-api/member.json")"
          export H P D I S1 S2 M
          python3 - <<'PY2'
          from pathlib import Path
          import json,os
          rows=[];blocking=[]
          for name,env,expected in [('health','H',{200}),('prepare','P',{200}),('dashboard','D',{200}),('invalid_admin','I',{400,401,403}),('search_hyphen','S1',{200}),('search_plain','S2',{200}),('member','M',{200})]:
              raw=os.environ[env];status=int(raw.split('|')[0]);rows.append({'name':name,'status':status,'ok':status in expected,'meta':raw});blocking.append(f'{name}:{status}') if status not in expected else None
          h=json.loads(Path(os.environ['RUNNER_TEMP']+'/next9-api/health.json').read_text());version=h.get('worker_version') or h.get('version');blocking.append('worker version') if version!=os.environ['EXPECTED_WORKER_VERSION'] else None;blocking.append('db_ok') if h.get('db_ok') is not True else None
