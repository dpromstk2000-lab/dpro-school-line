        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com";git pull --ff-only origin main || true
          current="$(grep '^current_step:' "${CURRENT_STEP_FILE}" | cut -d: -f2- | tr -d '"' | xargs || true)";[ "$current" = SCHOOL-NEXT-10 ] && exit 0
          cp "${RUNNER_TEMP}/system-check-before-next9.html" system-check.html 2>/dev/null || true;cp "${RUNNER_TEMP}/config-before-next9.js" config.js 2>/dev/null || true;cp "${RUNNER_TEMP}/current-step-before-next9.yml" "${CURRENT_STEP_FILE}" 2>/dev/null || true
          python3 - <<'PY2'
