name: SCHOOL Tutorial R5 Finalize Visual QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/school-r5-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-r5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout newest SCHOOL main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R5 candidate manuals and machine QA
        shell: bash
        run: |
          set -euo pipefail

          test -f DPRO_TUTORIAL_SCHOOL_QUICK_START_V1.0.pdf
          test -f DPRO_TUTORIAL_SCHOOL_DETAILED_MANUAL_V1.0.pdf
          test -f DPRO_TUTORIAL_SCHOOL_QUICK_START_V1.0.png
          for n in 01 02 03 04; do
            test -f "DPRO_TUTORIAL_SCHOOL_DETAILED_MANUAL_V1.0_${n}.png"
          done
          test -f tutorial-qa/school-r5-manual-qa.json

          echo "2ed27cd7b128c5c56b4a8cb6cb8b8aeff87a437e359964af5ec48835046975e1  DPRO_TUTORIAL_SCHOOL_QUICK_START_V1.0.pdf" | sha256sum -c -
          echo "ca0688c73372b176363601c5dd9cee079e50eded4cf7a5fb01b239fd03b91236  DPRO_TUTORIAL_SCHOOL_DETAILED_MANUAL_V1.0.pdf" | sha256sum -c -

          node - <<'NODE'
          const fs = require('fs');
          const p = 'tutorial-qa/school-r5-manual-qa.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));

          const fail = (m) => { throw new Error(m); };
          if (r.quickPdfPages !== 1) fail('quickPdfPages != 1');
          if (r.detailPdfPages !== 4) fail('detailPdfPages != 4');
          if (!Array.isArray(r.quickRenderedPages) || r.quickRenderedPages.length !== 1) fail('quick rendered page count');
          if (!Array.isArray(r.detailRenderedPages) || r.detailRenderedPages.length !== 4) fail('detail rendered page count');
          if (![...r.quickRenderedPages, ...r.detailRenderedPages].every(x => x.nonblank === true)) fail('blank page detected');
          if (!Array.isArray(r.qr) || r.qr.length !== 2 || !r.qr.every(x => x.pass === true && x.decoded === x.expected)) fail('QR QA failed');
          if (!Array.isArray(r.unsafeWrites) || r.unsafeWrites.length !== 0) fail('unsafeWrites not empty');
          if (r.businessMutation !== 0) fail('businessMutation != 0');
          if (r.visualReview !== 'PENDING_ASSISTANT_FULL_PAGE_REVIEW') fail('unexpected visualReview state');
          if (r.pass !== false) fail('candidate pass flag should still be false before finalization');
          NODE

      - name: Record assistant full-page visual PASS
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = 'tutorial-qa/school-r5-manual-qa.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));

          r.visualReview = 'PASS_ASSISTANT_FULL_PAGE_REVIEW';
          r.visualPageQA = [
            {file:'DPRO_TUTORIAL_SCHOOL_QUICK_START_V1.0.png', page:1, pass:true, clipping:0, missingGlyphs:0, brokenImages:0, overlap:0, unreadableText:0, blankAccidentalPage:0},
            {file:'DPRO_TUTORIAL_SCHOOL_DETAILED_MANUAL_V1.0_01.png', page:1, pass:true, clipping:0, missingGlyphs:0, brokenImages:0, overlap:0, unreadableText:0, blankAccidentalPage:0},
            {file:'DPRO_TUTORIAL_SCHOOL_DETAILED_MANUAL_V1.0_02.png', page:2, pass:true, clipping:0, missingGlyphs:0, brokenImages:0, overlap:0, unreadableText:0, blankAccidentalPage:0},
            {file:'DPRO_TUTORIAL_SCHOOL_DETAILED_MANUAL_V1.0_03.png', page:3, pass:true, clipping:0, missingGlyphs:0, brokenImages:0, overlap:0, unreadableText:0, blankAccidentalPage:0},
            {file:'DPRO_TUTORIAL_SCHOOL_DETAILED_MANUAL_V1.0_04.png', page:4, pass:true, clipping:0, missingGlyphs:0, brokenImages:0, overlap:0, unreadableText:0, blankAccidentalPage:0}
          ];
          r.manualSha256 = {
            quickPdf: '2ed27cd7b128c5c56b4a8cb6cb8b8aeff87a437e359964af5ec48835046975e1',
            detailedPdf: 'ca0688c73372b176363601c5dd9cee079e50eded4cf7a5fb01b239fd03b91236'
          };
          r.personalSensitiveDataReview = 'PASS_NO_REAL_STUDENT_GUARDIAN_CUSTOMER_OR_PRODUCTION_SECRET_OBSERVED';
          r.first10Count = 10;
          r.standard = 'V1.1_LOCKED';
          r.forwardOnly = true;
          r.r7 = 'NOT_AUTHORIZED_NOT_EXECUTED';
          r.pass = true;
          r.completedAt = new Date().toISOString();

          fs.writeFileSync(p, JSON.stringify(r, null, 2) + '\n');
          NODE

      - name: Commit R5 PASS evidence and remove temporary finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tutorial-qa/school-r5-manual-qa.json
          git rm -f .github/workflows/school-r5-finalize.yml

          git commit -m "Finalize SCHOOL R5 visual QA PASS [skip ci]"
          git push origin HEAD:main
