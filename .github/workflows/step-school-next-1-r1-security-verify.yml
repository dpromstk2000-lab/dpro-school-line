name: "STEP SCHOOL-NEXT-1-R1 | Worker公開情報安全修正確認"
run-name: "SCHOOL-NEXT-1-R1 security verify by ${{ github.actor }}"

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/step-school-next-1-r1-security-verify.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: school-next-1-r1-security-verify
  cancel-in-progress: false

env:
  STEP_NAME: SCHOOL-NEXT-1-R1
  WORKFLOW_FILE: .github/workflows/step-school-next-1-r1-security-verify.yml
  ORIGINAL_WORKFLOW_FILE: .github/workflows/step-school-next-1-baseline.yml
  STATE_DIR: dpro-next
  API_BASE: https://dpro-school-line-api.dpromstk2000.workers.dev
  PAGES_BASE: https://dpromstk2000-lab.github.io/dpro-school-line
  SHOP_CODE: dpro_school_demo
  EXPECTED_WORKER_VERSION: STEP-SCHOOL-NEXT-1-R1-WORKER-SECURITY-20260723

jobs:
  verify:
    name: Worker安全修正・NEXT-1完了確認
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. リポジトリ取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 前STEP・対象ファイル確認
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          test "${GITHUB_REF_NAME}" = "main"
          test -f "${WORKFLOW_FILE}"
          test -f "${ORIGINAL_WORKFLOW_FILE}"
          test -f "${STATE_DIR}/current-step.yml"
          grep -Eq 'current_step: "SCHOOL-NEXT-1-R(1|2)_REQUIRED"|current_step: SCHOOL-NEXT-1-R(1|2)_REQUIRED' "${STATE_DIR}/current-step.yml"

          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true); puts "YAML syntax OK"' "${WORKFLOW_FILE}"

      - name: 3. Worker・公開API・会員照合・全画面検査
        id: external
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "${STATE_DIR}"

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          API = os.environ["API_BASE"].rstrip("/")
          PAGES = os.environ["PAGES_BASE"].rstrip("/")
          SHOP = os.environ["SHOP_CODE"]
          EXPECTED = os.environ["EXPECTED_WORKER_VERSION"]
          OUT = Path(os.environ["STATE_DIR"])
          OUT.mkdir(exist_ok=True)
          JST = timezone(timedelta(hours=9))

          results = []

          def add(key, label, status, detail, blocking=False):
              results.append({
                  "key": key,
                  "label": label,
                  "status": status,
                  "detail": detail,
                  "blocking": bool(blocking),
              })

          def request_json(url, *, headers=None, expected_status=None):
              req = urllib.request.Request(url, headers=headers or {"Accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as res:
                      status = res.status
                      raw = res.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read().decode("utf-8", "replace")
              data = None
              try:
                  data = json.loads(raw) if raw else None
              except Exception:
                  data = {"raw": raw}
              if expected_status is not None and status != expected_status:
                  raise AssertionError(f"HTTP {status}, expected {expected_status}: {raw[:300]}")
              return status, data

          def find_forbidden(value, forbidden, path="root"):
              found = []
              if isinstance(value, dict):
                  for key, child in value.items():
                      lower = str(key).lower()
                      child_path = f"{path}.{key}"
                      if lower in forbidden:
                          found.append(child_path)
                      found.extend(find_forbidden(child, forbidden, child_path))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      found.extend(find_forbidden(child, forbidden, f"{path}[{index}]"))
              return found

          # Worker health and exact deployed version
          try:
              status, health = request_json(f"{API}/api/health", expected_status=200)
              version = (health or {}).get("version", "")
              if version != EXPECTED:
                  add("worker_version", "Worker差し替え", "NG", f"version={version or '未取得'} / expected={EXPECTED}", True)
              elif not (health or {}).get("db_ok"):
                  add("worker_version", "Worker差し替え", "NG", "Workerは新しいがDB接続がNG", True)
              else:
                  add("worker_version", "Worker差し替え", "OK", f"HTTP {status} / version={version} / db_ok=true")
          except Exception as exc:
              add("worker_version", "Worker差し替え", "NG", str(exc), True)

          # Public config must keep necessary display data and exclude internal fields.
          public_forbidden = {
              "admin_code", "owner_name", "memo", "id", "created_at", "updated_at",
              "phone_digits", "line_user_id", "line_display_name", "teacher_memo",
              "owner_memo", "note_for_teacher", "note_for_owner", "allergy_or_caution"
          }
          try:
              query = urllib.parse.urlencode({"shop_code": SHOP})
              status, config = request_json(f"{API}/api/public/config?{query}", expected_status=200)
              found = find_forbidden(config, public_forbidden)
              if found:
                  add("public_config", "公開設定API", "NG", "管理用キーを検出: " + ", ".join(found[:20]), True)
              elif not (config or {}).get("shop", {}).get("shop_name"):
                  add("public_config", "公開設定API", "NG", "shop_nameがありません", True)
              elif not isinstance((config or {}).get("courses"), list) or not isinstance((config or {}).get("teachers"), list):
                  add("public_config", "公開設定API", "NG", "coursesまたはteachersが配列ではありません", True)
              else:
                  add("public_config", "公開設定API", "OK", f"HTTP {status} / 内部情報なし / courses={len(config.get('courses', []))} / teachers={len(config.get('teachers', []))}")
          except Exception as exc:
              add("public_config", "公開設定API", "NG", str(exc), True)

          # Member endpoint must require both credentials, validate their relationship, and sanitize output.
          member_forbidden = {
              "admin_code", "owner_name", "memo", "id", "created_at", "updated_at",
              "phone_digits", "line_user_id", "line_display_name", "email", "guardian_no",
              "shop_code", "teacher_memo", "owner_memo", "note_for_teacher", "note_for_owner",
              "allergy_or_caution", "monthly_fee", "student_id", "guardian_id", "related_lesson_id"
          }
          valid_params = urllib.parse.urlencode({
              "shop_code": SHOP,
              "phone": "090-9999-0000",
              "student_no": "SCHOOL-DEMO-999",
          })
          try:
              status, member = request_json(f"{API}/api/member/profile?{valid_params}", expected_status=200)
              found = find_forbidden(member, member_forbidden)
              if found:
                  add("member_sanitize", "LINE会員API安全化", "NG", "内部キーを検出: " + ", ".join(found[:20]), True)
              elif not (member or {}).get("student", {}).get("student_no"):
                  add("member_sanitize", "LINE会員API安全化", "NG", "student_noがありません", True)
              elif not (member or {}).get("guardian", {}).get("guardian_name"):
                  add("member_sanitize", "LINE会員API安全化", "NG", "guardian_nameがありません", True)
              else:
                  add("member_sanitize", "LINE会員API安全化", "OK", f"HTTP {status} / 内部情報なし / 電話番号と生徒番号の一致データ取得OK")
          except Exception as exc:
              add("member_sanitize", "LINE会員API安全化", "NG", str(exc), True)

          try:
              normalized_cases = ["０９０−９９９９−００００", "+81 90 9999 0000"]
              for candidate in normalized_cases:
                  params = urllib.parse.urlencode({
                      "shop_code": SHOP,
                      "phone": candidate,
                      "student_no": "SCHOOL-DEMO-999",
                  })
                  request_json(f"{API}/api/member/profile?{params}", expected_status=200)
              add("phone_normalize", "電話番号正規化", "OK", "全角数字・Unicodeハイフン・+81を一致確認")
          except Exception as exc:
              add("phone_normalize", "電話番号正規化", "NG", str(exc), True)

          try:
              missing = urllib.parse.urlencode({"shop_code": SHOP, "student_no": "SCHOOL-DEMO-999"})
              status, data = request_json(f"{API}/api/member/profile?{missing}", expected_status=400)
              add("member_both_required", "会員キー両方必須", "OK", f"電話番号なしをHTTP {status}で拒否")
          except Exception as exc:
              add("member_both_required", "会員キー両方必須", "NG", str(exc), True)

          try:
              mismatch = urllib.parse.urlencode({
                  "shop_code": SHOP,
                  "phone": "090-0000-0000",
                  "student_no": "SCHOOL-DEMO-999",
              })
              status, data = request_json(f"{API}/api/member/profile?{mismatch}", expected_status=404)
              add("member_relation", "保護者・生徒所属一致", "OK", f"不一致組合せをHTTP {status}で拒否")
          except Exception as exc:
              add("member_relation", "保護者・生徒所属一致", "NG", str(exc), True)

          # Admin rejection remains intact.
          try:
              query = urllib.parse.urlencode({"shop_code": SHOP, "admin_code": "0000"})
              status, data = request_json(
                  f"{API}/api/admin/dashboard?{query}",
                  headers={"Accept": "application/json", "X-Admin-Code": "0000", "X-Shop-Code": SHOP},
                  expected_status=401,
              )
              add("admin_reject", "管理コード拒否", "OK", f"不正コードをHTTP {status}で拒否")
          except Exception as exc:
              add("admin_reject", "管理コード拒否", "NG", str(exc), True)

          # Public pages must still render.
          for page in ["index.html", "member.html", "owner.html", "owner-ipad.html", "system-check.html"]:
              try:
                  req = urllib.request.Request(f"{PAGES}/{page}?v=school-next-1-r1", headers={"User-Agent": "DPRO-NEXT-CHECK/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as res:
                      body = res.read()
                      ctype = res.headers.get("Content-Type", "")
                      if res.status != 200 or b"<html" not in body.lower():
                          raise AssertionError(f"HTTP {res.status} / Content-Type={ctype}")
                      add(f"page_{page}", f"{page}公開", "OK", f"HTTP 200 / {len(body):,} bytes")
              except Exception as exc:
                  add(f"page_{page}", f"{page}公開", "NG", str(exc), True)

          counts = {name: sum(1 for row in results if row["status"] == name) for name in ["OK", "注意", "NG"]}
          blocking_ng = sum(1 for row in results if row["status"] == "NG" and row["blocking"])
          payload = {
              "step": "SCHOOL-NEXT-1-R1",
              "checked_at_jst": datetime.now(JST).isoformat(timespec="seconds"),
              "expected_worker_version": EXPECTED,
              "results": results,
              "counts": counts,
              "blocking_ng": blocking_ng,
          }
          (OUT / "school-next-1-r1-security-check.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

          output = os.environ.get("GITHUB_OUTPUT")
          if output:
              with open(output, "a", encoding="utf-8") as fh:
                  fh.write(f"blocking_ng={blocking_ng}\n")
                  fh.write(f"ok_count={counts['OK']}\n")
                  fh.write(f"ng_count={counts['NG']}\n")
          PY

      - name: 4. 完成台帳・変更記録更新
        if: always()
        shell: bash
        env:
          BLOCKING_NG: ${{ steps.external.outputs.blocking_ng }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import json, os

          state_dir = Path(os.environ["STATE_DIR"])
          result_path = state_dir / "school-next-1-r1-security-check.json"
          payload = json.loads(result_path.read_text(encoding="utf-8")) if result_path.exists() else {
              "blocking_ng": 1,
              "counts": {"OK": 0, "注意": 0, "NG": 1},
              "results": [{"key": "workflow", "status": "NG", "detail": "検査結果ファイルを作成できませんでした", "blocking": True}],
          }
          success = int(payload.get("blocking_ng", 1)) == 0
          jst = timezone(timedelta(hours=9))
          now = datetime.now(jst).isoformat(timespec="seconds")

          current = "SCHOOL-NEXT-2" if success else "SCHOOL-NEXT-1-R2_REQUIRED"
          last_completed = "SCHOOL-NEXT-1" if success else ""
          state = [
              'system: "DPRO 学習塾 LINE"',
              'standard: "DPRO NEXT"',
              f'current_step: "{current}"',
              f'last_completed_step: "{last_completed}"',
              f'last_result: "{"OK" if success else "NG"}"',
              'baseline_sha: "035ba1a0df04cb0b0854d05d3255ff71df20bed0"',
              'backup_tag: "backup-school-next-before-1-20260723"',
              f'updated_at_jst: "{now}"',
              'worker_changed: true',
              'supabase_changed: false',
              'api_changed: true',
              f'worker_version: "{os.environ["EXPECTED_WORKER_VERSION"]}"',
          ]
          (state_dir / "current-step.yml").write_text("\n".join(state) + "\n", encoding="utf-8")

          record = [
              'step: "SCHOOL-NEXT-1-R1"',
              f'result: "{"OK" if success else "NG"}"',
              f'completed_at_jst: "{now if success else ""}"',
              f'checked_at_jst: "{now}"',
              'reason: "公開設定API・公開受付レスポンス・会員APIの内部情報除外と会員所属照合"',
              'worker_changed: true',
              'worker_deploy_required: true',
              'supabase_changed: false',
              'sql_required: false',
              'github_pages_changed: false',
              'api_changed: true',
              f'worker_version: "{os.environ["EXPECTED_WORKER_VERSION"]}"',
              f'next_step: "{current}"',
          ]
          (state_dir / "school-next-1-r1-change-record.yml").write_text("\n".join(record) + "\n", encoding="utf-8")
          PY

      - name: 5. 結果保存・成功時YML自己削除・自動Commit Push
        if: always()
        shell: bash
        env:
          BLOCKING_NG: ${{ steps.external.outputs.blocking_ng }}
        run: |
          set -Eeuo pipefail
          BLOCKING_NG="${BLOCKING_NG:-1}"

          if [ "${BLOCKING_NG}" = "0" ]; then
            rm -f "${WORKFLOW_FILE}" "${ORIGINAL_WORKFLOW_FILE}"
          fi

          git add -A "${STATE_DIR}" "${WORKFLOW_FILE}" "${ORIGINAL_WORKFLOW_FILE}"
          if git diff --cached --quiet; then
            echo "保存対象の差分はありません。"
          else
            if [ "${BLOCKING_NG}" = "0" ]; then
              git commit -m "fix(school-next): complete NEXT-1 R1 security verification"
            else
              git commit -m "chore(school-next): record NEXT-1 R1 verification failure"
            fi
            git push origin HEAD:main
          fi

      - name: 6. 最終判定
        if: always()
        shell: bash
        env:
          BLOCKING_NG: ${{ steps.external.outputs.blocking_ng }}
        run: |
          set -Eeuo pipefail
          BLOCKING_NG="${BLOCKING_NG:-1}"
          if [ "${BLOCKING_NG}" != "0" ]; then
            echo "::error::SCHOOL-NEXT-1-R1に未解決のNGがあります。dpro-next/school-next-1-r1-security-check.jsonを確認してください。"
            exit 1
          fi
          echo "SCHOOL-NEXT-1-R1 PASS / current_step: SCHOOL-NEXT-2"
